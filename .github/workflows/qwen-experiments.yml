name: Qwen two-card experiments

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test selection (hardware opens both cards; serving must be stopped)
        type: choice
        options: [inventory, hardware, model-inventory, baseline, interleave, interleave-diagnostic, interleave-mixed, profile, sampling-kernel, sampling]
        default: inventory
      cards_allocated:
        description: Operator confirms both cards allocated exclusively for this run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 120
    steps:
      - name: Verify dedicated host
        shell: bash
        run: |
          test "$RUNNER_NAME" = "thatch-build-amd64-02-cp-temp"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read-only inventory
        if: inputs.suite == 'inventory'
        shell: bash
        run: bash scripts/ci/qwen-inventory.sh
      - name: Hardware correctness gates
        if: inputs.suite == 'hardware'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
        run: timeout 2400 bash scripts/ci/run-hardware.sh
      - name: Model runtime discovery
        if: inputs.suite == 'model-inventory'
        shell: bash
        run: timeout 180 bash scripts/ci/model-inventory.sh
      - name: Full-model baseline
        if: inputs.suite == 'baseline'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
        run: timeout 6600 bash scripts/ci/run-baseline.sh
      - name: Interleaving correctness gates
        if: inputs.suite == 'interleave' || inputs.suite == 'interleave-diagnostic' || inputs.suite == 'interleave-mixed'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_BOUNDARY_DIAGNOSTICS: ${{ inputs.suite == 'interleave-diagnostic' && '1' || '0' }}
          QWEN_INTERLEAVE_MIXED: ${{ inputs.suite == 'interleave-mixed' && '1' || '0' }}
        run: timeout 6600 bash scripts/ci/run-interleave.sh
      - name: Layer attribution profiles
        if: inputs.suite == 'profile'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: profile
        run: timeout 3600 bash scripts/ci/run-baseline.sh
      - name: TP2 force-argmax prerequisite
        if: inputs.suite == 'sampling-kernel'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: sampling-kernel
        run: timeout 1200 bash scripts/ci/run-baseline.sh
      - name: Full-model host versus device sampling
        if: inputs.suite == 'sampling'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: sampling
        run: timeout 4800 bash scripts/ci/run-baseline.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-hardware-inventory-${{ github.run_id }}
          path: experiment-results/
          retention-days: 7
          if-no-files-found: error
