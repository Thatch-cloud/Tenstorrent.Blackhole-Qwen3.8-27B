name: Qwen two-card experiments

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test selection (hardware opens both cards; serving must be stopped)
        type: choice
        options: [learned-mlp, learned-attention, learned-convolution, feature-projection-full, feature-projection, inventory, hardware, model-inventory, gdn-source, baseline, interleave, interleave-diagnostic, interleave-mixed, profile, model-profile, verifier-profile, mlp-sweep, mlp-packing, mlp-fusion, projection-1d, full-model-fusion, full-prefix, target-feature-prefill, target-features, target-feature-batch, target-feature-replay, target-feature-prefix, full-batch, full-coding-cost, full-compact-gdn, full-gdn-input-reuse, full-gdn-row-clones, full-gdn-row-layout, full-gdn-device-loop, full-norm-batch, full-attention-groups, full-attention-dma, full-attention-parallel, full-attention-tree, full-attention-tree-replay, full-attention-replay, full-attention-mask-once, full-attention-engine, full-attention-engine-wide, full-norm-replay, full-norm-selection, full-norm-engine, full-verifier-replay, full-verifier-selection, full-verifier-engine, full-batch-attribution, attention-batch, attention-timing, attention-groups, attention-group-layer, attention-group-dma, attention-dma-layer, attention-parallel-groups, attention-mask-replay, attention-replay, attention-tree-scratch, attention-tree-parallel, attention-tree-layer, attention-tree-replay, gdn-prefix, gdn-block, gdn-active, gdn-direct, gdn-inplace, gdn-inplace-timing, gdn-checkpoint-cost, gdn-checkpoint-dma, gdn-multitoken, gdn-multitoken-norm, gdn-value-split, gdn-value-split-timing, gdn-value-split-prefetch, gdn-value-split-norm-batch, gdn-norm-batch-layer, gdn-multitoken-conv, device-readback, device-recovery, sampling-kernel, sampling, sampling-extended]
        default: inventory
      recover_runtime:
        description: Inventory only; recover exact pinned image by verified registry digest, without card access
        type: boolean
        default: false
      cards_allocated:
        description: Operator confirms both cards allocated exclusively for this run
        type: boolean
        default: false
      coding_request:
        description: One short non-repeated coding task; full-norm-engine only
        type: boolean
        default: false
      reset_authorized:
        description: Explicit approval for one reset of the two allocated cards (recovery suite only)
        type: boolean
        default: false
      prefix_zero_reuse:
        description: Opt-in prefix-copy experiment, full-attention-tree suite only
        type: boolean
        default: false
      learned_stack:
        description: Opt-in five-layer learned gate, learned-attention suite only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false

jobs:
  inventory:
    env:
      QWEN_CODING_REQUEST: ${{ inputs.coding_request && '1' || '0' }}
      QWEN_PREFIX_ZERO_REUSE: ${{ inputs.prefix_zero_reuse && '1' || '0' }}
      QWEN_LEARNED_STACK: ${{ inputs.learned_stack && '1' || '0' }}
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 120
    steps:
      - name: Verify dedicated host
        shell: bash
        run: |
          test "$RUNNER_NAME" = "thatch-build-amd64-02-cp-temp"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Recover exact pinned runtime without device access
        if: inputs.suite == 'inventory' && inputs.recover_runtime
        shell: bash
        env:
          REGISTRY_USER: ${{ secrets.THATCH_REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.THATCH_REGISTRY_PASSWORD }}
        run: |
          mkdir -p experiment-results
          if [ -n "$REGISTRY_USER" ] || [ -n "$REGISTRY_PASSWORD" ]; then
            test -n "$REGISTRY_USER" && test -n "$REGISTRY_PASSWORD"
            config=$(mktemp -d "$RUNNER_TEMP/qwen-registry.XXXXXX")
            trap 'rm -rf -- "$config"' EXIT
            export DOCKER_CONFIG="$config"
            printf '%s' "$REGISTRY_PASSWORD" | timeout 60 docker login zot.thatch.local:5000 --username "$REGISTRY_USER" --password-stdin
          fi
          unset REGISTRY_USER REGISTRY_PASSWORD
          timeout -k 15 1980 python3 -u scripts/ci/recover_runtime.py 2>&1 | tee experiment-results/runtime-recovery.log
      - name: Read-only inventory
        if: inputs.suite == 'inventory'
        shell: bash
        run: bash scripts/ci/qwen-inventory.sh
      - name: Authorized two-card reset
        if: inputs.suite == 'device-recovery'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RESET_AUTHORIZED: ${{ inputs.reset_authorized && '1' || '0' }}
        run: timeout -k 15 300 bash scripts/ci/reset-cards.sh
      - name: Post-reset transfer health
        if: success() && inputs.suite == 'device-recovery'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: device-readback
        run: timeout -k 30 300 bash scripts/ci/run-baseline.sh
      - name: Hardware correctness gates
        if: inputs.suite == 'hardware'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
        run: timeout 2400 bash scripts/ci/run-hardware.sh
      - name: Learned projection numerical diagnostic
        if: inputs.suite == 'learned-mlp' || inputs.suite == 'learned-attention' || inputs.suite == 'learned-convolution' || inputs.suite == 'feature-projection' || inputs.suite == 'feature-projection-full'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: ${{ inputs.suite }}
        run: timeout -k 30 ${{ inputs.learned_stack && '7000' || '4800' }} bash scripts/ci/run-baseline.sh
      - name: Model runtime discovery
        if: inputs.suite == 'model-inventory'
        shell: bash
        run: timeout 180 bash scripts/ci/model-inventory.sh
      - name: Read-only GDN source audit
        if: inputs.suite == 'gdn-source'
        shell: bash
        run: timeout -k 30 180 bash scripts/ci/gdn-source-audit.sh
      - name: Full-model baseline
        if: inputs.suite == 'baseline'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
        run: timeout 6600 bash scripts/ci/run-baseline.sh
      - name: Interleaving correctness gates
        if: inputs.suite == 'interleave' || inputs.suite == 'interleave-diagnostic' || inputs.suite == 'interleave-mixed'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_BOUNDARY_DIAGNOSTICS: ${{ inputs.suite == 'interleave-diagnostic' && '1' || '0' }}
          QWEN_INTERLEAVE_MIXED: ${{ inputs.suite == 'interleave-mixed' && '1' || '0' }}
        run: timeout 6600 bash scripts/ci/run-interleave.sh
      - name: Matched T8 verifier attribution
        if: inputs.suite == 'verifier-profile'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: verifier-profile
        run: timeout 6600 bash scripts/ci/run-baseline.sh
      - name: Layer attribution profiles
        if: inputs.suite == 'profile' || inputs.suite == 'model-profile'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: ${{ inputs.suite }}
        run: timeout 3600 bash scripts/ci/run-baseline.sh
      - name: TP2 force-argmax prerequisite
        if: inputs.suite == 'sampling-kernel'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: sampling-kernel
        run: timeout 1200 bash scripts/ci/run-baseline.sh
      - name: Real-weight TP2 MLP sweep
        if: inputs.suite == 'mlp-sweep' || inputs.suite == 'mlp-packing' || inputs.suite == 'mlp-fusion' || inputs.suite == 'projection-1d'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: ${{ inputs.suite }}
        run: timeout 2400 bash scripts/ci/run-baseline.sh
      - name: Full-model exact fusion gate
        if: inputs.suite == 'full-model-fusion'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: full-model-fusion
        run: timeout 3300 bash scripts/ci/run-baseline.sh
      - name: Full-model host versus device sampling
        if: inputs.suite == 'sampling' || inputs.suite == 'sampling-extended'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: ${{ inputs.suite }}
        run: timeout 4800 bash scripts/ci/run-baseline.sh
      - name: Full-model prefix correctness and verification cost
        if: inputs.suite == 'target-feature-prefill' || inputs.suite == 'target-feature-prefix' || inputs.suite == 'target-feature-replay' || inputs.suite == 'target-feature-batch' || inputs.suite == 'target-features' || inputs.suite == 'full-prefix' || inputs.suite == 'full-batch' || inputs.suite == 'full-coding-cost' || inputs.suite == 'full-compact-gdn' || inputs.suite == 'full-gdn-input-reuse' || inputs.suite == 'full-gdn-row-clones' || inputs.suite == 'full-gdn-row-layout' || inputs.suite == 'full-gdn-device-loop' || inputs.suite == 'full-norm-batch' || inputs.suite == 'full-norm-replay' || inputs.suite == 'full-norm-selection' || inputs.suite == 'full-norm-engine' || inputs.suite == 'full-verifier-replay' || inputs.suite == 'full-verifier-selection' || inputs.suite == 'full-verifier-engine' || inputs.suite == 'full-attention-groups' || inputs.suite == 'full-attention-dma' || inputs.suite == 'full-attention-parallel' || inputs.suite == 'full-attention-replay' || inputs.suite == 'full-attention-mask-once' || inputs.suite == 'full-attention-engine'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: ${{ inputs.suite }}
        run: timeout 5100 bash scripts/ci/run-baseline.sh
      - name: Bounded full-model stage attribution
        if: inputs.suite == 'full-batch-attribution'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: full-batch-attribution
        run: timeout 2100 bash scripts/ci/run-baseline.sh
      - name: Attention shared-page batched decode prerequisite
        if: inputs.suite == 'attention-batch' || inputs.suite == 'attention-timing' || inputs.suite == 'attention-groups' || inputs.suite == 'attention-group-layer' || inputs.suite == 'attention-group-dma' || inputs.suite == 'attention-dma-layer' || inputs.suite == 'attention-parallel-groups' || inputs.suite == 'attention-mask-replay' || inputs.suite == 'attention-replay'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: ${{ inputs.suite }}
        run: timeout 2100 bash scripts/ci/run-baseline.sh
      - name: Disposable native SDPA scratch build and exact microbenchmark
        if: inputs.suite == 'attention-tree-scratch' || inputs.suite == 'attention-tree-parallel' || inputs.suite == 'attention-tree-layer'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: ${{ inputs.suite }}
        run: timeout 4200 bash scripts/ci/run-baseline.sh
      - name: Disposable compact-scratch replay gate
        if: inputs.suite == 'attention-tree-replay'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: attention-tree-replay
        run: timeout 5100 bash scripts/ci/run-baseline.sh
      - name: Disposable compact-scratch full-model attention gate
        if: inputs.suite == 'full-attention-tree' || inputs.suite == 'full-attention-tree-replay' || inputs.suite == 'full-attention-engine-wide'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: ${{ inputs.suite }}
        run: timeout 7000 bash scripts/ci/run-baseline.sh
      - name: GDN exact prefix and rollback prerequisite
        if: inputs.suite == 'gdn-prefix' || inputs.suite == 'gdn-block' || inputs.suite == 'gdn-active' || inputs.suite == 'gdn-direct' || inputs.suite == 'gdn-inplace' || inputs.suite == 'gdn-inplace-timing' || inputs.suite == 'gdn-checkpoint-cost' || inputs.suite == 'gdn-checkpoint-dma' || inputs.suite == 'gdn-multitoken' || inputs.suite == 'gdn-value-split' || inputs.suite == 'gdn-value-split-timing' || inputs.suite == 'gdn-value-split-prefetch' || inputs.suite == 'gdn-value-split-norm-batch' || inputs.suite == 'gdn-norm-batch-layer' || inputs.suite == 'gdn-multitoken-norm' || inputs.suite == 'gdn-multitoken-conv' || inputs.suite == 'device-readback'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: ${{ inputs.suite }}
        run: timeout 2100 bash scripts/ci/run-baseline.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-hardware-inventory-${{ github.run_id }}
          path: experiment-results/
          retention-days: 7
          if-no-files-found: error
