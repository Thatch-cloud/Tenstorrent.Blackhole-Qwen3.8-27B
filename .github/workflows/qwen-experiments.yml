name: Qwen two-card experiments

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test selection (hardware opens both cards; serving must be stopped)
        type: choice
        options: [inventory, hardware, model-inventory, gdn-source, baseline, interleave, interleave-diagnostic, interleave-mixed, profile, model-profile, mlp-sweep, mlp-packing, mlp-fusion, projection-1d, full-model-fusion, full-prefix, full-batch, full-coding-cost, full-compact-gdn, full-gdn-input-reuse, full-gdn-row-clones, full-gdn-row-layout, full-gdn-device-loop, full-verifier-replay, full-batch-attribution, attention-batch, attention-timing, gdn-prefix, gdn-block, gdn-active, gdn-direct, gdn-inplace, gdn-inplace-timing, gdn-checkpoint-cost, gdn-checkpoint-dma, gdn-multitoken, gdn-multitoken-norm, gdn-multitoken-conv, device-readback, device-recovery, sampling-kernel, sampling, sampling-extended]
        default: inventory
      cards_allocated:
        description: Operator confirms both cards allocated exclusively for this run
        type: boolean
        default: false
      reset_authorized:
        description: Explicit approval for one reset of the two allocated cards (recovery suite only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 120
    steps:
      - name: Verify dedicated host
        shell: bash
        run: |
          test "$RUNNER_NAME" = "thatch-build-amd64-02-cp-temp"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read-only inventory
        if: inputs.suite == 'inventory'
        shell: bash
        run: bash scripts/ci/qwen-inventory.sh
      - name: Authorized two-card reset
        if: inputs.suite == 'device-recovery'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RESET_AUTHORIZED: ${{ inputs.reset_authorized && '1' || '0' }}
        run: timeout -k 15 300 bash scripts/ci/reset-cards.sh
      - name: Post-reset transfer health
        if: success() && inputs.suite == 'device-recovery'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: device-readback
        run: timeout -k 30 300 bash scripts/ci/run-baseline.sh
      - name: Hardware correctness gates
        if: inputs.suite == 'hardware'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
        run: timeout 2400 bash scripts/ci/run-hardware.sh
      - name: Model runtime discovery
        if: inputs.suite == 'model-inventory'
        shell: bash
        run: timeout 180 bash scripts/ci/model-inventory.sh
      - name: Read-only GDN source audit
        if: inputs.suite == 'gdn-source'
        shell: bash
        run: timeout -k 30 180 bash scripts/ci/gdn-source-audit.sh
      - name: Full-model baseline
        if: inputs.suite == 'baseline'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
        run: timeout 6600 bash scripts/ci/run-baseline.sh
      - name: Interleaving correctness gates
        if: inputs.suite == 'interleave' || inputs.suite == 'interleave-diagnostic' || inputs.suite == 'interleave-mixed'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_BOUNDARY_DIAGNOSTICS: ${{ inputs.suite == 'interleave-diagnostic' && '1' || '0' }}
          QWEN_INTERLEAVE_MIXED: ${{ inputs.suite == 'interleave-mixed' && '1' || '0' }}
        run: timeout 6600 bash scripts/ci/run-interleave.sh
      - name: Layer attribution profiles
        if: inputs.suite == 'profile' || inputs.suite == 'model-profile'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: ${{ inputs.suite }}
        run: timeout 3600 bash scripts/ci/run-baseline.sh
      - name: TP2 force-argmax prerequisite
        if: inputs.suite == 'sampling-kernel'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: sampling-kernel
        run: timeout 1200 bash scripts/ci/run-baseline.sh
      - name: Real-weight TP2 MLP sweep
        if: inputs.suite == 'mlp-sweep' || inputs.suite == 'mlp-packing' || inputs.suite == 'mlp-fusion' || inputs.suite == 'projection-1d'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: ${{ inputs.suite }}
        run: timeout 2400 bash scripts/ci/run-baseline.sh
      - name: Full-model exact fusion gate
        if: inputs.suite == 'full-model-fusion'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: full-model-fusion
        run: timeout 3300 bash scripts/ci/run-baseline.sh
      - name: Full-model host versus device sampling
        if: inputs.suite == 'sampling' || inputs.suite == 'sampling-extended'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: ${{ inputs.suite }}
        run: timeout 4800 bash scripts/ci/run-baseline.sh
      - name: Full-model prefix correctness and verification cost
        if: inputs.suite == 'full-prefix' || inputs.suite == 'full-batch' || inputs.suite == 'full-coding-cost' || inputs.suite == 'full-compact-gdn' || inputs.suite == 'full-gdn-input-reuse' || inputs.suite == 'full-gdn-row-clones' || inputs.suite == 'full-gdn-row-layout' || inputs.suite == 'full-gdn-device-loop' || inputs.suite == 'full-verifier-replay'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: ${{ inputs.suite }}
        run: timeout 5100 bash scripts/ci/run-baseline.sh
      - name: Bounded full-model stage attribution
        if: inputs.suite == 'full-batch-attribution'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: full-batch-attribution
        run: timeout 2100 bash scripts/ci/run-baseline.sh
      - name: Attention shared-page batched decode prerequisite
        if: inputs.suite == 'attention-batch' || inputs.suite == 'attention-timing'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: ${{ inputs.suite }}
        run: timeout 2100 bash scripts/ci/run-baseline.sh
      - name: GDN exact prefix and rollback prerequisite
        if: inputs.suite == 'gdn-prefix' || inputs.suite == 'gdn-block' || inputs.suite == 'gdn-active' || inputs.suite == 'gdn-direct' || inputs.suite == 'gdn-inplace' || inputs.suite == 'gdn-inplace-timing' || inputs.suite == 'gdn-checkpoint-cost' || inputs.suite == 'gdn-checkpoint-dma' || inputs.suite == 'gdn-multitoken' || inputs.suite == 'gdn-multitoken-norm' || inputs.suite == 'gdn-multitoken-conv' || inputs.suite == 'device-readback'
        shell: bash
        env:
          QWEN_CARDS_ALLOCATED: ${{ inputs.cards_allocated && '1' || '0' }}
          QWEN_RUN_MODE: ${{ inputs.suite }}
        run: timeout 2100 bash scripts/ci/run-baseline.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-hardware-inventory-${{ github.run_id }}
          path: experiment-results/
          retention-days: 7
          if-no-files-found: error
