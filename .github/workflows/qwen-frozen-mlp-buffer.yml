name: Qwen frozen T16 MLP buffer simulation
on:
  push:
    tags: ['experiment/frozen-mlp-buffer-sim-v1']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: buffer-orchestrator
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8c102b20df22329106955b4006bf4d650bb94e40
          path: buffer-candidate
          persist-credentials: false
      - name: Stage isolated buffer candidate
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p buffer-candidate/experiment-results
          python3 -B buffer-orchestrator/scripts/ci/frozen_recipe_context.py \
            --checkout buffer-candidate --context 8192 \
            --manifest buffer-candidate/experiment-results/frozen-geometry.json
          python3 -B buffer-orchestrator/scripts/ci/frozen_mlp_buffer_trial.py \
            --checkout buffer-candidate --manifest buffer-candidate/experiment-results/buffer-candidate.json
          git -C buffer-candidate diff --check
          git -C buffer-candidate diff > buffer-candidate/experiment-results/buffer.patch
      - name: T16 eager and changed-input replay with byte-exact weight checks
        timeout-minutes: 10
        working-directory: buffer-candidate
        env:
          QWEN_SIM_ONLY: '1'
          QWEN_LEARNED_STACK: '1'
          QWEN_SIM_CASE: fusion-t16-target
        run: timeout -k 30 570 bash scripts/ci/run-simulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-frozen-mlp-buffer-${{ github.run_id }}-${{ github.run_attempt }}
          path: buffer-candidate/experiment-results/
