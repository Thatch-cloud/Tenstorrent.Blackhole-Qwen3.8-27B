name: Qwen GDN dependency wait simulation
on:
  push:
    tags: ['experiment/gdn-wait-clock-sim-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: gdn-clock-orchestrator
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8c102b20df22329106955b4006bf4d650bb94e40
          path: gdn-clock-candidate
          persist-credentials: false
      - name: Stage removable individual dependency clocks
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p gdn-clock-candidate/experiment-results
          python3 -B gdn-clock-orchestrator/scripts/ci/frozen_recipe_context.py \
            --checkout gdn-clock-candidate --context 8192 \
            --manifest gdn-clock-candidate/experiment-results/frozen-geometry.json
          python3 -B gdn-clock-orchestrator/scripts/ci/gdn_wait_clock_stage.py \
            --checkout gdn-clock-candidate \
            --manifest gdn-clock-candidate/experiment-results/recurrence-clock-stage.json
          git -C gdn-clock-candidate diff --check
          git -C gdn-clock-candidate diff > gdn-clock-candidate/experiment-results/recurrence-clock.patch
      - name: Synthetic eager and changed-input replay qualification
        timeout-minutes: 10
        working-directory: gdn-clock-candidate
        env:
          QWEN_SIM_ONLY: '1'
          QWEN_LEARNED_STACK: '1'
          QWEN_SIM_CASE: gdn-shared-recurrence
        run: timeout -k 30 570 bash scripts/ci/run-simulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-gdn-wait-clock-${{ github.run_id }}-${{ github.run_attempt }}
          path: gdn-clock-candidate/experiment-results/
