name: Qwen frozen recipe 32K numerical check
on:
  push:
    tags: ['experiment/frozen-32k-numerical-v1', 'experiment/frozen-32k-reciprocal-eager-v1', 'experiment/frozen-32k-reciprocal-replay-v1', 'experiment/frozen-32k-reciprocal-diagnostics-v1', 'experiment/frozen-32k-target-replay-v1', 'experiment/frozen-32k-target-replay-v2', 'experiment/frozen-32k-target-replay-scratch-v1']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  numerical:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: ${{ contains(github.ref, 'target-replay-') && 12 || 20 }}
    steps:
      - name: Restore ownership of prior simulator artifacts
        run: |
          workspace=$(realpath -e "$GITHUB_WORKSPACE")
          results="$workspace/frozen-recipe/experiment-results"
          if [ -e "$results" ]; then
            test ! -L "$results"
            test "$(realpath -e "$results")" = "$results"
            sudo -n chown -R -h "$(id -u):$(id -g)" "$results"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: frozen-orchestrator
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8c102b20df22329106955b4006bf4d650bb94e40
          path: frozen-recipe
          persist-credentials: false
      - name: Apply shared recipe geometry
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p frozen-recipe/experiment-results
          candidate=()
          if [[ "$GITHUB_REF" = refs/tags/experiment/frozen-32k-target-replay-* ]]; then
            candidate=(--target-replay)
          fi
          if [ "$GITHUB_REF" = refs/tags/experiment/frozen-32k-reciprocal-eager-v1 ]; then
            candidate=(--scalar-reciprocal --eager-only)
          fi
          if [ "$GITHUB_REF" = refs/tags/experiment/frozen-32k-reciprocal-replay-v1 ]; then
            candidate=(--scalar-reciprocal --probe-seconds 1020)
          fi
          if [ "$GITHUB_REF" = refs/tags/experiment/frozen-32k-reciprocal-diagnostics-v1 ]; then
            candidate=(--scalar-reciprocal)
          fi
          python3 -B frozen-orchestrator/scripts/ci/frozen_recipe_context.py \
            --checkout frozen-recipe --context 32768 \
            "${candidate[@]}" \
            --manifest frozen-recipe/experiment-results/frozen-geometry.json
          git -C frozen-recipe diff --check
          git -C frozen-recipe diff > frozen-recipe/experiment-results/geometry.patch
      - name: Cache-required 32K numerical probe without model weights
        timeout-minutes: 19
        working-directory: frozen-recipe
        env:
          QWEN_SIM_ONLY: '1'
          QWEN_LEARNED_STACK: '1'
          QWEN_SIM_CASE: ${{ contains(github.ref, 'target-replay-') && 'target-t16-attention-8k' || 'dspark-native-8k-attention' }}
          QWEN_DSPARK_REQUEST_CONTEXT: '32768'
          QWEN_FROZEN_PROBE_PART: ${{ endsWith(github.ref, 'reciprocal-diagnostics-v1') && 'diagnostics' || 'numerical' }}
          QWEN_FROZEN_BUILD_ONLY: '0'
          QWEN_FROZEN_TARGET_SCRATCH: ${{ endsWith(github.ref, 'target-replay-scratch-v1') && '1' || '0' }}
        run: |
          limit=1090
          if [ "$QWEN_SIM_CASE" = target-t16-attention-8k ]; then limit=620; fi
          timeout -k 45 "$limit" bash scripts/ci/run-simulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-frozen-32k-numerical-${{ github.run_id }}-${{ github.run_attempt }}
          path: frozen-recipe/experiment-results/
