name: Qwen Lever N M3native gate
on:
  push:
    tags: ['experiment/lever-n-m3native-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  graft:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: m3native
          persist-credentials: false
      - name: Graft the native 64-row decode patch onto the pinned sources
        working-directory: m3native
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results graft/attention graft/gdn
          image=sha256:01ccd6f8586d365d7116983d49c25cc8188008f388adbe00146a4035549ec785
          root=/opt/tt-metal/models/demos/blackhole/qwen36/tt
          name="qwen-m3native-extract-$GITHUB_RUN_ID"
          docker create --name "$name" --entrypoint /bin/true "$image" >/dev/null
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker cp "$name:$root/model_config.py" graft/model_config.py.orig
          docker cp "$name:$root/attention/tp.py" graft/attention/tp.py.orig
          docker cp "$name:$root/gdn/tp.py" graft/gdn/tp.py.orig
          docker cp "$name:$root/mlp.py" graft/mlp.py.orig
          sha256sum graft/model_config.py.orig graft/attention/tp.py.orig graft/gdn/tp.py.orig graft/mlp.py.orig \
            >> experiment-results/source.sha256
          python3 -B - <<'PY'
          import ast, io, sys
          sys.path.insert(0, 'scripts/ci')
          import lever_n_m3native_patch as patcher
          for name, apply in patcher.PATCHES.items():
              source = io.open('graft/%s.orig' % name, encoding='utf-8').read()
              patched = apply(source)
              ast.parse(patched)
              io.open('graft/%s' % name, 'w', encoding='utf-8', newline='\n').write(patched)
              print('%s: %d -> %d bytes' % (name, len(source), len(patched)))
          PY
          sha256sum graft/model_config.py graft/attention/tp.py graft/gdn/tp.py graft/mlp.py \
            >> experiment-results/graft.sha256
          cat experiment-results/graft.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3native-graft-${{ github.run_id }}
          path: m3native/graft/
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m3native-graft-sha-${{ github.run_id }}
          path: m3native/experiment-results/

  arm:
    needs: graft
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: m3native
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m3native-graft-${{ github.run_id }}
          path: m3native/graft/
      - name: Confirm no process holds a card
        working-directory: m3native
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          paths=()
          for node in "${nodes[@]}"; do paths+=("/dev/tenstorrent/$node"); done
          # The rig's telemetry exporter opens every card for a tt-smi snapshot every 30 s
          # (run 35582967265 failed here on exactly that: 'tt-smi' as the only holder). A
          # tt-smi holder is read-only and gone within seconds, so it is ignored and the
          # check retries; any other holder still fails the job.
          clear=0
          for attempt in 1 2 3 4 5 6; do
            status=0
            "${prefix[@]}" fuser -v "${paths[@]}" > experiment-results/holders.txt 2>&1 || status=$?
            if [ "$status" = 1 ] && [ ! -s experiment-results/holders.txt ]; then clear=1; break; fi
            if [ "$status" = 0 ] && ! grep -v -E '^\s*USER|tt-smi|^/dev/tenstorrent/[0-9]+:\s*$' experiment-results/holders.txt | grep -q .; then clear=1; break; fi
            sleep 2
          done
          if [ "$clear" != 1 ]; then
            echo 'Device ownership not clear'
            cat experiment-results/holders.txt || true
            exit 1
          fi
      - name: Reset every board before this job opens the pair
        working-directory: m3native
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          # A long four-user run leaves an active ethernet core on device 0 that the next
          # open cannot bring back: llrt.cpp:594 "Timed out while waiting for active
          # ethernet core 31-25 to become active again" (runs 35560086522 and 35560086573,
          # the latter twice - once right after the former had passed). Reset EVERY board
          # before the job opens the pair, exactly as qwen-card-reset.yml does: both link
          # ends must come back together (resetting one board alone left the mesh at 1x1,
          # run 35414390308). No firmware is written and no host reboot happens. The
          # preceding step already proved no process holds a card.
          mkdir -p experiment-results
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          smi=$(command -v tt-smi || echo /home/thatch/.local/bin/tt-smi)
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E "^[0-9]+$" | sort)
          paths=()
          for node in "${nodes[@]}"; do paths+=("/dev/tenstorrent/$node"); done
          status=0
          timeout -k 20 420 "${prefix[@]}" "$smi" -r "${paths[@]}" > experiment-results/reset.log 2>&1 || status=$?
          if [ "$status" != 0 ]; then
            echo "multi-board reset exited $status; resetting each in turn" >> experiment-results/reset.log
            status=0
            for path in "${paths[@]}"; do
              timeout -k 20 300 "${prefix[@]}" "$smi" -r "$path" >> experiment-results/reset.log 2>&1 || status=$?
            done
          fi
          echo "reset_exit=$status" | tee experiment-results/reset.status
          tail -20 experiment-results/reset.log || true
          timeout -k 5 30 "${prefix[@]}" "$smi" -ls 2>&1 | tee experiment-results/boards-after-reset.txt | tail -8
          test "$status" = 0
      - name: Run the native M3 gate
        working-directory: m3native
        timeout-minutes: 40
        shell: bash
        run: |
          # Two arms from one commit, told apart by the tag: -v2 and -v3 are consumed
          # (v3 was the plain opgraft-K64 mount refused at attach by the combined-runtime
          # binary pin, run 35558196471); -v4 is the plain native_m3 graft rerun (attn prep
          # and head concat still two-call, K64 not mounted) so the five per_core_M=2 matmul
          # grids are isolated; -v5 mounts ~/opgraft-K64c (the same batch-64 attn_decode_prep
          # and nlp_concat_heads_decode kernels, rebuilt over the combined SDPA factory) and
          # sets QWEN_FAST_NATIVE_ATTN=1 and QWEN_FAST_RUNTIME_BINARY_SHA256 through the
          # run-arm: the round with no two-call op, on the binary runtime_binary_override
          # now admits.
          case "$GITHUB_REF_NAME" in
            *-v5) export KOPGRAFT64=/home/thatch/opgraft-K64c ;;
            *-v6) export M3NATIVE_PROFILE=1 ;;
            *-v7) export M3NATIVE_TRACED_PROPOSAL=1 ;;
            *-v8) export M3NATIVE_MAX_TOKENS=48 ;;
            *-v10|*-v11) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 ;;
            *-v12) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_PROFILE=1 ;;
            *-v13) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 ;;
            *-v14) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 ;;
            *-v17) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 ;;
            *-v18|*-v19|*-v21) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 M3NATIVE_FAST_COMMIT=1 ;;
            *-v20|*-v26) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 M3NATIVE_FAST_COMMIT=1 M3NATIVE_REPLAY_GROUP_ROWS=8 ;;
            *-v22|*-v23|*-v28) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 M3NATIVE_FAST_COMMIT=1 M3NATIVE_PACKED_PROPOSAL=1 ;;
            *-v24|*-v25) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_FAST_COMMIT=1 ;;
            *-v27) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 M3NATIVE_FAST_COMMIT=1 M3NATIVE_PIPELINED_PUBLISH=1 ;;
            *-v29) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 M3NATIVE_FAST_COMMIT=1 M3NATIVE_TRACED_PUBLISH=1 ;;
            # -v15/-v16: the 131k one-user/two-user attach arm. No reference exists at 131k
            # yet, so M3NATIVE_ALLOW_MISSING_REFERENCES=1 keeps the gate reporting instead of
            # requiring gate_passed. QWEN_DSPARK_REQUEST_CONTEXT and QWEN_FAST_MAX_POSITION are
            # derived from these inside the run-arm - there is no separate "ladder" env to set
            # here: the earlier 131k single-stream qualification used a disjoint offline
            # harness (dspark_request_experiment.py via qwen-combined-ladder.yml against the
            # historical 8c102b20 checkout), not this vLLM+packed-decode stack, and the staged
            # T16 combined-runtime recipe this gate serves is CLI-locked to context 32768
            # (frozen_recipe_context.py:196-198). See docs/lever-n-131k-attach-arm.md for the
            # exact refusal expected: attach succeeds and prints dram headroom, but the T16
            # gate refuses the first request's engine construction before any packed round.
            *-v15) export M3NATIVE_USERS=1 M3NATIVE_CONTEXT=131328 M3NATIVE_PROMPT_TOKENS=131072 M3NATIVE_ALLOW_MISSING_REFERENCES=1 ;;
            *-v16) export M3NATIVE_USERS=2 M3NATIVE_CONTEXT=131328 M3NATIVE_PROMPT_TOKENS=131072 M3NATIVE_ALLOW_MISSING_REFERENCES=1 ;;
          esac
          echo "tag=$GITHUB_REF_NAME KOPGRAFT64=${KOPGRAFT64:-}"
          bash scripts/ci/lever_n_m3native_run_arm.sh
      - name: Report the gate
        working-directory: m3native
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/ci/lever_n_m3native_gate_report.py \
            --report experiment-results/m3native-gate.json \
            --log experiment-results/m3native-gate-stdout.log
      - name: Attribute the packed round
        working-directory: m3native
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s experiment-results/profile/.logs/cpp_device_perf_report.csv ]; then
            python3 -B scripts/ci/lever_n_m3native_profile_report.py \
              --profile-dir experiment-results/profile \
              --log experiment-results/m3native-gate-stdout.log \
              --out experiment-results/m3native-profile.json
          else
            echo 'No device profiler CSV (not a profile tag, or the profiler wrote nothing); skipping attribution.'
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m3native-gate-${{ github.run_id }}
          path: m3native/experiment-results/
          include-hidden-files: true
