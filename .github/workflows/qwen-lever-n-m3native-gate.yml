            *-v169|*-v170|*-v171|*-v172|*-v173) image=sha256:841de9a62713a2187ac0d06d8281718bbf29ffcb7af7dabe8cf1d69e6d515e8a ;;
            *-v174|*-v175|*-v176|*-v177|*-v178|*-v179|*-v180|*-v181) image=sha256:126b30dfa72b0e008884f3a8a1cfcb5b7f79eadcdeaeda1cd0f91350dde6ee73 ;;
            *-v182|*-v183|*-v184|*-v185|*-v186) image=sha256:c96bad68978fa3ba6d7313fb928834d2c2cb600747607cb84218fb590309c09f ;;
            *-v187) image=sha256:126b30dfa72b0e008884f3a8a1cfcb5b7f79eadcdeaeda1cd0f91350dde6ee73 ;;
            *-v188|*-v189|*-v190) image=sha256:5fd27fcc1b3e8c69613e61c97ee1b09481714a91a0792e842d0b7559ed4af032 ;;
            *-v191|*-v192|*-v193) image=sha256:463964d577321f2cebd5d29422edcaf848ade3ba4c5260c890497b6b2accfe98 ;;
            *-v194|*-v195|*-v196|*-v197|*-v198|*-v199) image=sha256:70c27e7539db757e3b166f0d14ccdc32edf86532017b6f2f50310fcaad855c3f ;;
            *-v200|*-v201|*-v202|*-v203|*-v204|*-v205) image=sha256:ece389152f699213f89c7295f4479cfc3f9f73bf1ca9c8bf7548617fefa5b6ba ;;
            *-v206|*-v207|*-v208|*-v209|*-v210|*-v211) image=sha256:0fd9ad1f14a4e5d3d4464be55465cb6bb8d52e1b533c430d1c2f7f219df2b0e8 ;;
            *-v212|*-v213|*-v214|*-v215|*-v216|*-v217) image=sha256:0fd9ad1f14a4e5d3d4464be55465cb6bb8d52e1b533c430d1c2f7f219df2b0e8 ;;
            *-v218|*-v219|*-v220|*-v221|*-v222|*-v223|*-v224) image=sha256:c9a585ef3eebb775c8de1883b0e0032ec3b16305feb1e23968e0661f401363e9 ;;
            *-v225|*-v226|*-v227|*-v228|*-v229|*-v230) image=sha256:203633f5ef28ca92449d2008bc3aeee2a7303a8d671046dac4d6cdea82a8976f ;;
          esac
          echo "graft image: $image"
          root=/opt/tt-metal/models/demos/blackhole/qwen36/tt
          name="qwen-m3native-extract-$GITHUB_RUN_ID"
          docker create --name "$name" --entrypoint /bin/true "$image" >/dev/null
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          case "$GITHUB_REF_NAME" in
            *-v36|*-v37|*-v38|*-v40|*-v42|*-v44|*-v45|*-v46|*-v47|*-v48|*-v49|*-v50|*-v51|*-v52|*-v53|*-v54|*-v55|*-v56|*-v57|*-v58|*-v59|*-v60|*-v61|*-v62|*-v63|*-v64|*-v65|*-v66|*-v67|*-v68|*-v69|*-v70|*-v71|*-v72|*-v73|*-v74|*-v75|*-v76|*-v77|*-v78|*-v79|*-v80|*-v81|*-v82|*-v118|*-v119|*-v121|*-v128) export M3NATIVE_LEVER_N=1 ;;
          esac
          python3 -B - <<'PY' > graft/manifest.txt
          import os
          import sys
          sys.path.insert(0, 'scripts/ci')
          import lever_n_m3native_patch as patcher
          selected = patcher.with_lever_n() if os.environ.get('M3NATIVE_LEVER_N') else patcher.SOURCES
          for relative, (directory, _) in sorted(selected.items()):
              print('%s %s' % (directory, relative))
          PY
          cat graft/manifest.txt
          while read -r directory relative; do
            mkdir -p "graft/$(dirname "$relative")"
            docker cp "$name:$directory/$relative" "graft/$relative.orig"
          done < graft/manifest.txt
          python3 -B - <<'PY'
          import ast
          import io
          import os
          import sys
          sys.path.insert(0, 'scripts/ci')
          import lever_n_m3native_patch as patcher
          selected = patcher.with_lever_n() if os.environ.get('M3NATIVE_LEVER_N') else patcher.SOURCES
          for relative, (directory, apply) in sorted(selected.items()):
              source = io.open('graft/%s.orig' % relative, encoding='utf-8').read()
              patched = apply(source)
              ast.parse(patched)
              io.open('graft/%s' % relative, 'w', encoding='utf-8', newline='\n').write(patched)
              print('%s from %s: %d -> %d bytes' % (relative, directory, len(source), len(patched)))
          PY
          while read -r directory relative; do
            sha256sum "graft/$relative.orig" >> experiment-results/source.sha256
            sha256sum "graft/$relative" >> experiment-results/graft.sha256
          done < graft/manifest.txt
          # Lever #2: the unpatched op files the arm mounts beside gdn/tp.py under
          # M3NATIVE_GDN_PREFILL_CONV=1, staged from lever_n_m3native_patch.PREFILL_CONV_FILES (the
          # same table the arm derives its mounts from). Staged on every tag; mounted only on the flag.
          python3 -B - <<'PY' > graft/prefill-conv-manifest.txt
          import sys
          sys.path.insert(0, 'scripts/ci')
          import lever_n_m3native_patch as patcher
          for relative, source in sorted(patcher.PREFILL_CONV_FILES.items()):
              print('%s %s' % (source, relative))
          PY
          while read -r source relative; do
            mkdir -p "graft/$(dirname "$relative")"
            cp "scripts/ci/$source" "graft/$relative"
            sha256sum "graft/$relative" >> experiment-results/graft.sha256
          done < graft/prefill-conv-manifest.txt
          # C1e (lever_n_m3native_patch section J): the unpatched op files the arm mounts beside mlp.py
          # under M3NATIVE_C1_EXACT=1, staged from lever_n_m3native_patch.C1E_FILES (the same table the
          # arm derives its mounts from). Staged on every tag; mounted only on the flag.
          python3 -B - <<'PY' > graft/c1e-manifest.txt
          import sys
          sys.path.insert(0, 'scripts/ci')
          import lever_n_m3native_patch as patcher
          for relative, source in sorted(patcher.C1E_FILES.items()):
              print('%s %s' % (source, relative))
          PY
          while read -r source relative; do
            mkdir -p "graft/$(dirname "$relative")"
            cp "scripts/ci/$source" "graft/$relative"
            sha256sum "graft/$relative" >> experiment-results/graft.sha256
          done < graft/c1e-manifest.txt
          cat experiment-results/graft.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3native-graft-${{ github.run_id }}
          path: m3native/graft/
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m3native-graft-sha-${{ github.run_id }}
          path: m3native/experiment-results/

  arm:
    needs: graft
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: m3native
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m3native-graft-${{ github.run_id }}
          path: m3native/graft/
      - name: Confirm no process holds a serving card
        working-directory: m3native
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          # The serving pair only: card M and card A by board id (scripts/ci/serving_pair.sh, the two
          # ids the arm mounts), their nodes resolved now, waiting up to 60 s for a board still coming
          # back from a reset. Card B is the qualification card: a session on it holds its node and
          # must not fail this job, so this check never names it.
          . scripts/ci/serving_pair.sh
          serving_pair_nodes 60 > experiment-results/serving-pair.txt
          cat experiment-results/serving-pair.txt
          paths=("${SERVING_PAIR_NODES[@]}")
          test "${#paths[@]}" = 2
          # The rig's telemetry exporter opens every card for a tt-smi snapshot every 30 s
          # (run 35582967265 failed here on exactly that: 'tt-smi' as the only holder). A
          # tt-smi holder is read-only and gone within seconds, so it is ignored and the
          # check retries; any other holder still fails the job.
          clear=0
          for attempt in 1 2 3 4 5 6; do
            status=0
            "${prefix[@]}" fuser -v "${paths[@]}" > experiment-results/holders.txt 2>&1 || status=$?
            if [ "$status" = 1 ] && [ ! -s experiment-results/holders.txt ]; then clear=1; break; fi
            if [ "$status" = 0 ] && ! grep -v -E '^\s*USER|tt-smi|^/dev/tenstorrent/[0-9]+:\s*$' experiment-results/holders.txt | grep -q .; then clear=1; break; fi
            sleep 2
          done
          if [ "$clear" != 1 ]; then
            echo 'Device ownership of the serving pair not clear'
            cat experiment-results/holders.txt || true
            exit 1
          fi
      - name: Reset the serving pair (card M and card A together) before this job opens it
        working-directory: m3native
        # 8 minutes for the reset, plus the self-heal's bound (60 s wait, then per card up to two
        # rescans of ~30 s and a 60 s link wait, and two re-probes of ~80 s each): a step killed
        # between an unbind and its bind leaves a card unbound. The heal starts no rescan and no
        # unbind after 720 s (serving_pair_heal 60 720, below): keep it 120 s under this.
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          # A long four-user run leaves an active ethernet core on device 0 that the next
          # open cannot bring back: llrt.cpp:594 "Timed out while waiting for active
          # ethernet core 31-25 to become active again" (runs 35560086522 and 35560086573,
          # the latter twice - once right after the former had passed). Reset the pair
          # before the job opens it: card M and card A, BOTH link ends in one tt-smi call,
          # as qwen-card-reset.yml resets both - resetting one board alone left the mesh at
          # 1x1 (run 35414390308). No firmware is written and no host reboot happens. The
          # preceding step already proved no process holds card M or card A.
          #
          # Never card B: it is the qualification card (PCIe only, no link to either), and a
          # session may be running on it. tt-smi -r is given only the two /dev/tenstorrent
          # nodes that card M's and card A's board ids resolve to right before the call, each
          # checked against its PCI address (d1 and f3; scripts/ci/serving_pair.sh) - never a
          # bare number, which tt-smi reads as its own board index, and which renumbers across
          # resets and switch power-cycles. tt-smi's post-reset re-init and -ls still enumerate
          # every board, card B included, as the rig's telemetry exporter does every 30 s: a
          # hung card B can fail this step, but nothing here resets it.
          mkdir -p experiment-results
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          smi=$(command -v tt-smi || echo /home/thatch/.local/bin/tt-smi)
          . scripts/ci/serving_pair.sh
          serving_pair_resolve 60 > experiment-results/serving-pair-before-reset.txt
          cat experiment-results/serving-pair-before-reset.txt
          test "${#SERVING_PAIR_NODES[@]}" = 2
          echo "resetting card M and card A together: ${SERVING_PAIR_NODES[*]} (PCI ${SERVING_PAIR_PCI[*]})" \
            | tee experiment-results/reset.log
          status=0
          timeout -k 20 420 "${prefix[@]}" "$smi" -r "${SERVING_PAIR_NODES[@]}" >> experiment-results/reset.log 2>&1 || status=$?
          if [ "$status" != 0 ]; then
            # A failed pair reset can leave a serving card off the bus (run v217: card A's switch
            # port could not train its link, 0000:f3:00.0 vanished, and the resolve refused) or
            # without its by-id link: before each card is resolved, the self-heal (serving_pair_heal,
            # described below) brings it back - a rescan of that card's own upstream port, a driver
            # re-probe. The nodes may have renumbered, and card A is absent for seconds after a
            # reset: each card is resolved again by board id and PCI address right before its own
            # reset, waiting up to 120 s as the arm does. A heal that refuses, or a pair that does
            # not come back, resets nothing more and fails the job.
            echo "pair reset exited $status; resetting card M, then card A, each resolved again by board id" \
              | tee -a experiment-results/reset.log
            status=0
            for i in 0 1; do
              if ! serving_pair_heal 60 720 >> experiment-results/reset.log 2>&1; then status=1; break; fi
              if ! serving_pair_resolve 120 >> experiment-results/reset.log 2>&1; then status=1; break; fi
              timeout -k 20 300 "${prefix[@]}" "$smi" -r "${SERVING_PAIR_NODES[$i]}" >> experiment-results/reset.log 2>&1 || status=$?
            done
          fi
          # The telemetry race (run v190): card A, behind the PCIe switch, can come back from the
          # reset before its ARC firmware is ready - the driver logs 'Telemetry not available', the
          # node exists and tt-smi -ls lists the board, but udev never creates its by-id link, and
          # the arm refuses after its 120 s wait. serving_pair_heal waits up to 60 s for both links,
          # then re-probes the driver (unbind, 3 s, bind) of a serving card whose link is still
          # missing: only card M's or card A's own PCI address, only while that device is present,
          # bound to the tenstorrent driver and held by no process, at most twice per card, waiting
          # up to 60 s for the link after each. A serving card whose PCI device is absent (its link
          # did not train, run v217) is first rescanned at its own upstream port only (0000:d0:01.1
          # for card M, 0000:f2:00.0 for card A), at most twice, waiting up to 30 s for the device
          # after each. No further reset. A link that does not come back fails this step
          # (heal.status); it never guesses. No rescan and no unbind starts after 720 s of this
          # step (timeout-minutes 14 = 840 s, less 120 s): a slow reset must not leave the runner's
          # timeout to kill the heal between an unbind and its bind, which would leave a card unbound.
          heal=0
          if [ "$status" = 0 ]; then
            serving_pair_heal 60 720 2>&1 | tee -a experiment-results/reset.log || heal=$?
          fi
          echo "heal_exit=$heal" | tee experiment-results/heal.status
          echo "reset_exit=$status" | tee experiment-results/reset.status
          tail -20 experiment-results/reset.log || true
          # A board that does not answer -ls must not hide the reset's own status.
          { timeout -k 5 30 "${prefix[@]}" "$smi" -ls 2>&1 || true; } | tee experiment-results/boards-after-reset.txt | tail -8
          # The nodes may have renumbered: the arm resolves the board ids again (waiting up to 120 s)
          # before its docker run; this records where the pair is now.
          serving_pair_resolve > experiment-results/serving-pair-after-reset.txt 2>&1 || true
          cat experiment-results/serving-pair-after-reset.txt || true
          test "$status" = 0
          test "$heal" = 0
      - name: Run the native M3 gate
        working-directory: m3native
        timeout-minutes: 40
        shell: bash
        run: |
          # Two arms from one commit, told apart by the tag: -v2 and -v3 are consumed
          # (v3 was the plain opgraft-K64 mount refused at attach by the combined-runtime
          # binary pin, run 35558196471); -v4 is the plain native_m3 graft rerun (attn prep
          # and head concat still two-call, K64 not mounted) so the five per_core_M=2 matmul
          # grids are isolated; -v5 mounts ~/opgraft-K64c (the same batch-64 attn_decode_prep
          # and nlp_concat_heads_decode kernels, rebuilt over the combined SDPA factory) and
          # sets QWEN_FAST_NATIVE_ATTN=1 and QWEN_FAST_RUNTIME_BINARY_SHA256 through the
          # run-arm: the round with no two-call op, on the binary runtime_binary_override
          # now admits.
          case "$GITHUB_REF_NAME" in
            *-v5) export KOPGRAFT64=/home/thatch/opgraft-K64c ;;
            *-v6) export M3NATIVE_PROFILE=1 ;;
            *-v7) export M3NATIVE_TRACED_PROPOSAL=1 ;;
            *-v8) export M3NATIVE_MAX_TOKENS=48 ;;
            *-v10|*-v11) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 ;;
            *-v12) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_PROFILE=1 ;;
            *-v13) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 ;;
            *-v14) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 ;;
