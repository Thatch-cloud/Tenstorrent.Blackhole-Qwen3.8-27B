        run: |
          set -euo pipefail
          python3 -B scripts/ci/lever_n_m3native_gate_report.py \
            --report experiment-results/m3native-gate.json \
            --log experiment-results/m3native-gate-stdout.log
      - name: Attribute the packed round
        working-directory: m3native
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s experiment-results/profile/.logs/cpp_device_perf_report.csv ]; then
            python3 -B scripts/ci/lever_n_m3native_profile_report.py \
              --profile-dir experiment-results/profile \
              --log experiment-results/m3native-gate-stdout.log \
              --out experiment-results/m3native-profile.json
          else
            echo 'No device profiler CSV (not a profile tag, or the profiler wrote nothing); skipping attribution.'
          fi
          # Prefill ranking M2: only when the layer.py flush hook actually ran. Its markers are in
          # the raw server log (experiment-results/gate) or the stdout copy, whichever has them.
          flush_log=$(grep -rlF '[PINDIAG] prefill profile flush' experiment-results/gate \
                      experiment-results/m3native-gate-stdout.log 2>/dev/null | head -1 || true)
          if [ -s experiment-results/profile/.logs/cpp_device_perf_report.csv ] && [ -n "$flush_log" ]; then
            python3 -B scripts/ci/lever_n_prefill_profile_report.py \
              --profile-dir experiment-results/profile \
              --log "$flush_log" \
              --out experiment-results/m3native-prefill-profile.json || true
          elif [ -s experiment-results/profile/.logs/cpp_device_perf_report.csv ]; then
            echo '::warning::PREFILL PROFILE FLUSH HOOK DID NOT RUN: a device profile CSV exists but no' \
                 "'[PINDIAG] prefill profile flush' marker is in the server log; per-core buffers may" \
                 'have overflowed mid-chunk (the ~40% capture), so no prefill report was produced.'
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m3native-gate-${{ github.run_id }}
          path: m3native/experiment-results/
          include-hidden-files: true
