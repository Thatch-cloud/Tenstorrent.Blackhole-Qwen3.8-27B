name: Qwen Lever N M3native gate
on:
  push:
    tags: ['experiment/lever-n-m3native-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  graft:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: m3native
          persist-credentials: false
      - name: Graft the native 64-row decode patch onto the pinned sources
        working-directory: m3native
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results graft/attention graft/gdn
          image=sha256:e41ef884f4c8e07ce6632511fac19364af35dc73d601f05f5191784a64a3a768
          case "$GITHUB_REF_NAME" in
            *-v39|*-v40) image=sha256:e215968de71241971e2a42bb1fb7e426a84d60cb970af8f73ad278ef44363260 ;;
            *-v41|*-v42|*-v43|*-v44) image=sha256:836e7abb249b04018ce59848d290738142a7b9e6589e6770944f98d4b7630793 ;;
            *-v45|*-v46) image=sha256:8ce279e6ad9a55304f85a49a3626c3635fb2203c23fcc42a06e826019778c11a ;;
            *-v47|*-v48) image=sha256:330b1593c4fe0dc1b02b3abaa0922552eb978721bfc16f276b1a4831f806505b ;;
            *-v49|*-v50) image=sha256:ebb0d2976cb7e376a8f8792aebf90f4dfcfb49a617607f32b9f08b35ee3858f0 ;;
            *-v51|*-v52) image=sha256:ebbf753d6dbdf685017f17b1941c93b43928d39aa9c598ef2dfcb9d7faa2e1fa ;;
            *-v53|*-v54) image=sha256:ebbf753d6dbdf685017f17b1941c93b43928d39aa9c598ef2dfcb9d7faa2e1fa ;;
            *-v55|*-v56) image=sha256:ebbf753d6dbdf685017f17b1941c93b43928d39aa9c598ef2dfcb9d7faa2e1fa ;;
            *-v57|*-v58) image=sha256:ebbf753d6dbdf685017f17b1941c93b43928d39aa9c598ef2dfcb9d7faa2e1fa ;;
            *-v59|*-v60) image=sha256:ebbf753d6dbdf685017f17b1941c93b43928d39aa9c598ef2dfcb9d7faa2e1fa ;;
            *-v61|*-v62) image=sha256:9f95422301a85819dd3186a7cef3da01dc436f186f9bf5e80ea0d54a5384fda9 ;;
            *-v63|*-v64) image=sha256:06fd3a7f9f476adea65921c113b3e6349f02740b1ee23ba7fb14fb87c750214c ;;
            *-v65|*-v66) image=sha256:06fd3a7f9f476adea65921c113b3e6349f02740b1ee23ba7fb14fb87c750214c ;;
            *-v67|*-v68) image=sha256:06fd3a7f9f476adea65921c113b3e6349f02740b1ee23ba7fb14fb87c750214c ;;
            *-v69|*-v70) image=sha256:a3432592f52c38867cf475ccf0b46afec4cb839dc156cd602ed0254a3f42f675 ;;
            *-v71|*-v72) image=sha256:08a835c70446adee26b1f76564468e3191c02eb673d9b679b2db3f404c6b8f58 ;;
            *-v73|*-v74) image=sha256:08a835c70446adee26b1f76564468e3191c02eb673d9b679b2db3f404c6b8f58 ;;
            *-v75|*-v76) image=sha256:67a28229d3fbc2a653cc7f725e1de03e8ba9130c4a3ef2d0ca8a92dfd25253d6 ;;
            *-v77|*-v78) image=sha256:67a28229d3fbc2a653cc7f725e1de03e8ba9130c4a3ef2d0ca8a92dfd25253d6 ;;
            *-v79|*-v80|*-v81|*-v82) image=sha256:67a28229d3fbc2a653cc7f725e1de03e8ba9130c4a3ef2d0ca8a92dfd25253d6 ;;
            *-v83|*-v84|*-v85|*-v86) image=sha256:67a28229d3fbc2a653cc7f725e1de03e8ba9130c4a3ef2d0ca8a92dfd25253d6 ;;
            *-v87) image=sha256:452008d1c9d9608b99da3ad670cd803cdc341b4cbd3db44f448be551f75afa93 ;;
            *-v88|*-v89|*-v90|*-v91|*-v92|*-v95|*-v96|*-v97|*-v98) image=sha256:f369d08cb505dce89e8db616fcf993061aa399dbb9610eb6c43230b2f5637d1a ;;
            *-v99|*-v100|*-v101|*-v102|*-v103|*-v104|*-v105|*-v106|*-v107|*-v108|*-v109|*-v110|*-v111|*-v112|*-v113|*-v114|*-v115|*-v116) image=sha256:0648ca9ad663acc72e7d8ea59d9cde0f9218b583ad74a60d58ff2f31bddd6fae ;;
            *-v117|*-v118|*-v119|*-v120|*-v121|*-v122|*-v123|*-v124|*-v125|*-v126|*-v127) image=sha256:1b9b644549d4409c4fc80e2f92c183e665e7e693c37cccc95b4bb760a6d7d537 ;;
            *-v128|*-v129|*-v130|*-v131|*-v132|*-v133|*-v134|*-v135|*-v136|*-v137) image=sha256:eceb2daa744c3345368a638488a804f0ffe8b76f6b0680945a47bb527bdb55a9 ;;
            *-v138|*-v139|*-v140|*-v141|*-v142|*-v143) image=sha256:02f758e1d21f2970e81b21338ec284dc7bc5841a1637ff98920ca66a9e309cd0 ;;
            *-v144|*-v145|*-v146|*-v147|*-v148) image=sha256:126b30dfa72b0e008884f3a8a1cfcb5b7f79eadcdeaeda1cd0f91350dde6ee73 ;;
            *-v149|*-v150|*-v151|*-v152|*-v153|*-v154|*-v155|*-v156) image=sha256:126b30dfa72b0e008884f3a8a1cfcb5b7f79eadcdeaeda1cd0f91350dde6ee73 ;;
            *-v161|*-v162|*-v163|*-v164|*-v165|*-v166|*-v167|*-v168) image=sha256:126b30dfa72b0e008884f3a8a1cfcb5b7f79eadcdeaeda1cd0f91350dde6ee73 ;;
          esac
          echo "graft image: $image"
          root=/opt/tt-metal/models/demos/blackhole/qwen36/tt
          name="qwen-m3native-extract-$GITHUB_RUN_ID"
          docker create --name "$name" --entrypoint /bin/true "$image" >/dev/null
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          case "$GITHUB_REF_NAME" in
            *-v36|*-v37|*-v38|*-v40|*-v42|*-v44|*-v45|*-v46|*-v47|*-v48|*-v49|*-v50|*-v51|*-v52|*-v53|*-v54|*-v55|*-v56|*-v57|*-v58|*-v59|*-v60|*-v61|*-v62|*-v63|*-v64|*-v65|*-v66|*-v67|*-v68|*-v69|*-v70|*-v71|*-v72|*-v73|*-v74|*-v75|*-v76|*-v77|*-v78|*-v79|*-v80|*-v81|*-v82|*-v118|*-v119|*-v121|*-v128) export M3NATIVE_LEVER_N=1 ;;
          esac
          python3 -B - <<'PY' > graft/manifest.txt
          import os
          import sys
          sys.path.insert(0, 'scripts/ci')
          import lever_n_m3native_patch as patcher
          selected = patcher.with_lever_n() if os.environ.get('M3NATIVE_LEVER_N') else patcher.SOURCES
          for relative, (directory, _) in sorted(selected.items()):
              print('%s %s' % (directory, relative))
          PY
          cat graft/manifest.txt
          while read -r directory relative; do
            mkdir -p "graft/$(dirname "$relative")"
            docker cp "$name:$directory/$relative" "graft/$relative.orig"
          done < graft/manifest.txt
          python3 -B - <<'PY'
          import ast
          import io
          import os
          import sys
          sys.path.insert(0, 'scripts/ci')
          import lever_n_m3native_patch as patcher
          selected = patcher.with_lever_n() if os.environ.get('M3NATIVE_LEVER_N') else patcher.SOURCES
          for relative, (directory, apply) in sorted(selected.items()):
              source = io.open('graft/%s.orig' % relative, encoding='utf-8').read()
              patched = apply(source)
              ast.parse(patched)
              io.open('graft/%s' % relative, 'w', encoding='utf-8', newline='\n').write(patched)
              print('%s from %s: %d -> %d bytes' % (relative, directory, len(source), len(patched)))
          PY
          while read -r directory relative; do
            sha256sum "graft/$relative.orig" >> experiment-results/source.sha256
            sha256sum "graft/$relative" >> experiment-results/graft.sha256
          done < graft/manifest.txt
          # Lever #2: the unpatched op files the arm mounts beside gdn/tp.py under
          # M3NATIVE_GDN_PREFILL_CONV=1, staged from lever_n_m3native_patch.PREFILL_CONV_FILES (the
          # same table the arm derives its mounts from). Staged on every tag; mounted only on the flag.
          python3 -B - <<'PY' > graft/prefill-conv-manifest.txt
          import sys
          sys.path.insert(0, 'scripts/ci')
          import lever_n_m3native_patch as patcher
          for relative, source in sorted(patcher.PREFILL_CONV_FILES.items()):
              print('%s %s' % (source, relative))
          PY
          while read -r source relative; do
            mkdir -p "graft/$(dirname "$relative")"
            cp "scripts/ci/$source" "graft/$relative"
            sha256sum "graft/$relative" >> experiment-results/graft.sha256
          done < graft/prefill-conv-manifest.txt
          cat experiment-results/graft.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3native-graft-${{ github.run_id }}
          path: m3native/graft/
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m3native-graft-sha-${{ github.run_id }}
          path: m3native/experiment-results/

  arm:
    needs: graft
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: m3native
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m3native-graft-${{ github.run_id }}
          path: m3native/graft/
      - name: Confirm no process holds a card
        working-directory: m3native
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          paths=()
          for node in "${nodes[@]}"; do paths+=("/dev/tenstorrent/$node"); done
          # The rig's telemetry exporter opens every card for a tt-smi snapshot every 30 s
          # (run 35582967265 failed here on exactly that: 'tt-smi' as the only holder). A
          # tt-smi holder is read-only and gone within seconds, so it is ignored and the
          # check retries; any other holder still fails the job.
          clear=0
          for attempt in 1 2 3 4 5 6; do
            status=0
            "${prefix[@]}" fuser -v "${paths[@]}" > experiment-results/holders.txt 2>&1 || status=$?
            if [ "$status" = 1 ] && [ ! -s experiment-results/holders.txt ]; then clear=1; break; fi
            if [ "$status" = 0 ] && ! grep -v -E '^\s*USER|tt-smi|^/dev/tenstorrent/[0-9]+:\s*$' experiment-results/holders.txt | grep -q .; then clear=1; break; fi
            sleep 2
          done
          if [ "$clear" != 1 ]; then
            echo 'Device ownership not clear'
            cat experiment-results/holders.txt || true
            exit 1
          fi
      - name: Reset every board before this job opens the pair
        working-directory: m3native
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          # A long four-user run leaves an active ethernet core on device 0 that the next
          # open cannot bring back: llrt.cpp:594 "Timed out while waiting for active
          # ethernet core 31-25 to become active again" (runs 35560086522 and 35560086573,
          # the latter twice - once right after the former had passed). Reset EVERY board
          # before the job opens the pair, exactly as qwen-card-reset.yml does: both link
          # ends must come back together (resetting one board alone left the mesh at 1x1,
          # run 35414390308). No firmware is written and no host reboot happens. The
          # preceding step already proved no process holds a card.
          mkdir -p experiment-results
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          smi=$(command -v tt-smi || echo /home/thatch/.local/bin/tt-smi)
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E "^[0-9]+$" | sort)
          paths=()
          for node in "${nodes[@]}"; do paths+=("/dev/tenstorrent/$node"); done
          status=0
          timeout -k 20 420 "${prefix[@]}" "$smi" -r "${paths[@]}" > experiment-results/reset.log 2>&1 || status=$?
          if [ "$status" != 0 ]; then
            echo "multi-board reset exited $status; resetting each in turn" >> experiment-results/reset.log
            status=0
            for path in "${paths[@]}"; do
              timeout -k 20 300 "${prefix[@]}" "$smi" -r "$path" >> experiment-results/reset.log 2>&1 || status=$?
            done
          fi
          echo "reset_exit=$status" | tee experiment-results/reset.status
          tail -20 experiment-results/reset.log || true
          timeout -k 5 30 "${prefix[@]}" "$smi" -ls 2>&1 | tee experiment-results/boards-after-reset.txt | tail -8
          test "$status" = 0
      - name: Run the native M3 gate
        working-directory: m3native
        timeout-minutes: 40
        shell: bash
        run: |
          # Two arms from one commit, told apart by the tag: -v2 and -v3 are consumed
          # (v3 was the plain opgraft-K64 mount refused at attach by the combined-runtime
          # binary pin, run 35558196471); -v4 is the plain native_m3 graft rerun (attn prep
          # and head concat still two-call, K64 not mounted) so the five per_core_M=2 matmul
          # grids are isolated; -v5 mounts ~/opgraft-K64c (the same batch-64 attn_decode_prep
          # and nlp_concat_heads_decode kernels, rebuilt over the combined SDPA factory) and
          # sets QWEN_FAST_NATIVE_ATTN=1 and QWEN_FAST_RUNTIME_BINARY_SHA256 through the
          # run-arm: the round with no two-call op, on the binary runtime_binary_override
          # now admits.
          case "$GITHUB_REF_NAME" in
            *-v5) export KOPGRAFT64=/home/thatch/opgraft-K64c ;;
            *-v6) export M3NATIVE_PROFILE=1 ;;
            *-v7) export M3NATIVE_TRACED_PROPOSAL=1 ;;
            *-v8) export M3NATIVE_MAX_TOKENS=48 ;;
            *-v10|*-v11) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 ;;
            *-v12) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_PROFILE=1 ;;
            *-v13) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 ;;
            *-v14) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 ;;
            *-v17) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 ;;
            *-v18|*-v19|*-v21|*-v30) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 M3NATIVE_FAST_COMMIT=1 ;;
            *-v20|*-v26) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 M3NATIVE_FAST_COMMIT=1 M3NATIVE_REPLAY_GROUP_ROWS=8 ;;
            *-v22|*-v23|*-v28|*-v31) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 M3NATIVE_FAST_COMMIT=1 M3NATIVE_PACKED_PROPOSAL=1 ;;
            *-v33) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 M3NATIVE_FAST_COMMIT=1 M3NATIVE_PACKED_PROPOSAL=1 M3NATIVE_TRACED_PUBLISH=1 ;;
            *-v34) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 M3NATIVE_FAST_COMMIT=1 M3NATIVE_PACKED_PROPOSAL=1 M3NATIVE_TRACED_PUBLISH=1 M3NATIVE_GDN_STATE_COPY_BATCH=1 ;;
            *-v35) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 M3NATIVE_FAST_COMMIT=1 M3NATIVE_PACKED_PROPOSAL=1 M3NATIVE_TRACED_PUBLISH=1 M3NATIVE_GDN_STATE_COPY_BATCH=1 M3NATIVE_PREFILL_CHUNK=32 ;;
            *-v36|*-v37|*-v38) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 M3NATIVE_FAST_COMMIT=1 M3NATIVE_PACKED_PROPOSAL=1 M3NATIVE_TRACED_PUBLISH=1 M3NATIVE_GDN_STATE_COPY_BATCH=1 M3NATIVE_PREFILL_CHUNK_TOKENS=2048 ;;
            *-v39) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 M3NATIVE_FAST_COMMIT=1 M3NATIVE_PACKED_PROPOSAL=1 M3NATIVE_TRACED_PUBLISH=1 M3NATIVE_GDN_STATE_COPY_BATCH=1 M3NATIVE_IMAGE=sha256:e215968de71241971e2a42bb1fb7e426a84d60cb970af8f73ad278ef44363260 ;;
            *-v40) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 M3NATIVE_FAST_COMMIT=1 M3NATIVE_PACKED_PROPOSAL=1 M3NATIVE_TRACED_PUBLISH=1 M3NATIVE_GDN_STATE_COPY_BATCH=1 M3NATIVE_PREFILL_CHUNK_TOKENS=2048 M3NATIVE_IMAGE=sha256:e215968de71241971e2a42bb1fb7e426a84d60cb970af8f73ad278ef44363260 ;;
            *-v41) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 M3NATIVE_FAST_COMMIT=1 M3NATIVE_PACKED_PROPOSAL=1 M3NATIVE_TRACED_PUBLISH=1 M3NATIVE_GDN_STATE_COPY_BATCH=1 M3NATIVE_IMAGE=sha256:836e7abb249b04018ce59848d290738142a7b9e6589e6770944f98d4b7630793 ;;
            *-v42) export KOPGRAFT64=/home/thatch/opgraft-K64c M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 M3NATIVE_FAST_COMMIT=1 M3NATIVE_PACKED_PROPOSAL=1 M3NATIVE_TRACED_PUBLISH=1 M3NATIVE_GDN_STATE_COPY_BATCH=1 M3NATIVE_PREFILL_CHUNK_TOKENS=2048 M3NATIVE_IMAGE=sha256:836e7abb249b04018ce59848d290738142a7b9e6589e6770944f98d4b7630793 ;;
            *-v43) export M3NATIVE_TRACED_PROPOSAL=1 M3NATIVE_PIPELINED_COMMITS=1 M3NATIVE_PIPELINED_PROPOSALS=1 M3NATIVE_GDN_USER_BATCH=1 M3NATIVE_FAST_COMMIT=1 M3NATIVE_PACKED_PROPOSAL=1 M3NATIVE_TRACED_PUBLISH=1 M3NATIVE_GDN_STATE_COPY_BATCH=1 M3NATIVE_IMAGE=sha256:836e7abb249b04018ce59848d290738142a7b9e6589e6770944f98d4b7630793 ;;
            *-v44) export M3NATIVE_PREFILL_CHUNK_TOKENS=2048 M3NATIVE_IMAGE=sha256:836e7abb249b04018ce59848d290738142a7b9e6589e6770944f98d4b7630793 ;;
            *-v45) export M3NATIVE_PREFILL_CHUNK_TOKENS=2048 M3NATIVE_IMAGE=sha256:8ce279e6ad9a55304f85a49a3626c3635fb2203c23fcc42a06e826019778c11a ;;
            *-v46) export M3NATIVE_IMAGE=sha256:8ce279e6ad9a55304f85a49a3626c3635fb2203c23fcc42a06e826019778c11a ;;
            *-v47) export M3NATIVE_PREFILL_CHUNK_TOKENS=2048 M3NATIVE_IMAGE=sha256:330b1593c4fe0dc1b02b3abaa0922552eb978721bfc16f276b1a4831f806505b ;;
            *-v48) export M3NATIVE_IMAGE=sha256:330b1593c4fe0dc1b02b3abaa0922552eb978721bfc16f276b1a4831f806505b ;;
            *-v49) export M3NATIVE_PREFILL_CHUNK_TOKENS=2048 M3NATIVE_IMAGE=sha256:ebb0d2976cb7e376a8f8792aebf90f4dfcfb49a617607f32b9f08b35ee3858f0 ;;
            *-v50) export M3NATIVE_IMAGE=sha256:ebb0d2976cb7e376a8f8792aebf90f4dfcfb49a617607f32b9f08b35ee3858f0 ;;
            *-v51) export M3NATIVE_PREFILL_CHUNK_TOKENS=2048 M3NATIVE_IMAGE=sha256:ebbf753d6dbdf685017f17b1941c93b43928d39aa9c598ef2dfcb9d7faa2e1fa ;;
            *-v52) export M3NATIVE_IMAGE=sha256:ebbf753d6dbdf685017f17b1941c93b43928d39aa9c598ef2dfcb9d7faa2e1fa ;;
