name: Qwen shift matmul probe
on:
  push:
    tags: ['experiment/shift-matmul-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  measure:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: sm
          persist-credentials: false
      - name: Reset the boards before opening the mesh
        working-directory: sm
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          smi=$(command -v tt-smi || echo /home/thatch/.local/bin/tt-smi)
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          paths=()
          for node in "${nodes[@]}"; do paths+=("/dev/tenstorrent/$node"); done
          status=0
          timeout -k 20 420 "${prefix[@]}" "$smi" -r "${paths[@]}" > experiment-results/pre-reset.log 2>&1 || status=$?
          echo "pre_reset_exit=$status" | tee experiment-results/pre-reset.status
          tail -5 experiment-results/pre-reset.log || true
      - name: Confirm no process holds a card
        working-directory: sm
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          paths=()
          for node in "${nodes[@]}"; do paths+=("/dev/tenstorrent/$node"); done
          status=0
          "${prefix[@]}" fuser -v "${paths[@]}" > experiment-results/holders.txt 2>&1 || status=$?
          if [ "$status" != 1 ] || [ -s experiment-results/holders.txt ]; then
            echo 'Device ownership not clear'
            cat experiment-results/holders.txt || true
            exit 1
          fi
      - name: Is shift-by-matmul cheaper than the slice FIR
        working-directory: sm
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          image=sha256:f1e9b1a64b4f7aa04cd3d3b36fefed4d47320bfdd0f4d108d2ca85a932cf9465
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          devices=()
          for node in "${nodes[@]}"; do devices+=(--device "/dev/tenstorrent/$node"); done
          name="qwen-shift-mm-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'timeout 20 docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout -k 30 900 docker run --rm --name "$name" --network none \
            --cap-drop ALL --cap-add SYS_NICE --security-opt no-new-privileges \
            --pids-limit 4096 --cpus 8 --memory 48g --shm-size 8g \
            "${devices[@]}" \
            --mount type=bind,src=/dev/hugepages-1G,dst=/dev/hugepages-1G \
            --mount "type=bind,src=$PWD,dst=/source,readonly" \
            --tmpfs /tmp:rw,size=512m \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/source/scripts/ci \
            -e QWEN_HARDWARE_TESTS=1 -e QWEN_CARDS_ALLOCATED=1 \
            -e TT_METAL_HOME=/opt/tt-metal \
            -e TT_MESH_GRAPH_DESC_PATH=/opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p150_x2_mesh_graph_descriptor.textproto \
            --entrypoint python3 "$image" -B /source/scripts/ci/gdn_shift_matmul_probe.py \
            --rows 2048 --cols 5120 --iters 20 \
            > experiment-results/shift-mm.log 2>&1 || true
          if grep -qE 'Unable to find image|^docker: ' experiment-results/shift-mm.log; then
            echo 'The container never started: docker rejected the invocation.'
            head -5 experiment-results/shift-mm.log || true
            exit 1
          fi
          sed -n '/SHIFT_MM_JSON_BEGIN/,/SHIFT_MM_JSON_END/p' \
            experiment-results/shift-mm.log | sed '1d;$d' \
            > experiment-results/shift-mm.json || true
          if [ ! -s experiment-results/shift-mm.json ]; then
            echo 'No structured result; tail of stdout:'
            tail -60 experiment-results/shift-mm.log || true
            exit 1
          fi
          cat experiment-results/shift-mm.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-shift-matmul-${{ github.run_id }}
          path: sm/experiment-results/
