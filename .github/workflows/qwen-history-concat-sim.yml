name: Qwen history concat lifetime qualification
on:
  push:
    tags: ['experiment/history-concat-sim-*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 6
    steps:
      - name: Verify host and restore result ownership
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          workspace=$(realpath -e "$GITHUB_WORKSPACE")
          results="$workspace/history-concat-source/experiment-results"
          if [ -e "$results" ]; then
            test ! -L "$results"
            test "$(realpath -e "$results")" = "$results"
            sudo -n chown -R -h "$(id -u):$(id -g)" "$results"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: history-concat-source
          persist-credentials: false
      - name: Weight-free two-chip concat lifetimes
        working-directory: history-concat-source
        env:
          QWEN_SIM_ONLY: '1'
          QWEN_LEARNED_STACK: '1'
          QWEN_SIM_CASE: history-concat
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          timeout -k 15 330 bash scripts/ci/run-simulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-history-concat-sim-${{ github.run_id }}
          path: history-concat-source/experiment-results/
