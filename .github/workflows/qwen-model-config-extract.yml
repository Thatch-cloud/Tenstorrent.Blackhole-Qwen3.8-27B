name: Qwen model config extract
on:
  push:
    tags: ['experiment/model-config-extract-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  extract:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: mc
          persist-credentials: false
      - name: Extract model_config.py and the architecture config
        working-directory: mc
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results/source
          image=sha256:bd878710e15c574e53451976122a9ebb0d5f146fdd37eeb92a9138f773be33fa
          name="qwen-model-config-$GITHUB_RUN_ID"
          docker create --name "$name" --entrypoint /bin/true "$image" >/dev/null
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          root=/opt/tt-metal/models/demos/blackhole/qwen36/tt
          for f in model_config.py model.py; do
            docker cp "$name:$root/$f" "experiment-results/source/$f" 2>/dev/null || true
          done
          ls -l experiment-results/source/
          sha256sum experiment-results/source/* >> experiment-results/source.sha256 || true
          echo '=== math fidelity settings ==='
          grep -nE 'fidelity|HiFi|LoFi|MathFidelity|fp32_dest|packer_l1|dst_full' \
            experiment-results/source/model_config.py 2>/dev/null | head -40 \
            > experiment-results/fidelity.txt || true
          cat experiment-results/fidelity.txt || true
          echo '=== weight dtypes ==='
          grep -nE 'bfp4|bfp8|bfloat16|BFP4|BFP8|DataType|dtype' \
            experiment-results/source/model_config.py 2>/dev/null | head -40 \
            > experiment-results/dtypes.txt || true
          cat experiment-results/dtypes.txt || true
      - name: Count parameters and price the prefill
        working-directory: mc
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          target=/home/thatch/hf-cache/hub/models--Qwen--Qwen3.8-27B
          config=$(ls "$target"/snapshots/*/config.json 2>/dev/null | head -1 || true)
          if [ -z "$config" ]; then
            echo 'No config.json found under the HF cache; recording that and stopping'
            ls -d "$target"/snapshots/* 2>/dev/null || true
            exit 0
          fi
          cp "$config" experiment-results/config.json
          echo '=== config.json ==='
          cat experiment-results/config.json
          python3 -B scripts/ci/model_param_count.py \
            --config experiment-results/config.json \
            --json experiment-results/param-count.json \
            > experiment-results/param-count.txt 2>&1 || true
          cat experiment-results/param-count.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-model-config-${{ github.run_id }}
          path: mc/experiment-results/
