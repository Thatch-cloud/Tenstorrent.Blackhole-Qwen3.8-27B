name: Qwen fabric-relay Phase-0 identity capture
on:
  push:
    tags: ['experiment/fabric-relay-phase0-v1', 'experiment/fabric-relay-phase0-v2']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  identity:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 3
    steps:
      - name: Verify host
        run: test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
      # Shallow clone into a fresh directory instead of actions/checkout:
      # the runner work area holds stale checkout state that makes
      # actions/checkout fail with "not a git repository" after its own
      # content wipe. A plain clone is self-contained and unaffected.
      - name: Shallow-clone the repository fresh
        timeout-minutes: 2
        run: |
          set -euo pipefail
          workdir=$(mktemp -d /tmp/fabric-relay-src.XXXXXX)
          git clone --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$workdir/repo"
          echo "FABRIC_RELAY_SOURCE_DIR=$workdir/repo" >> "$GITHUB_ENV"
      - name: Read-only host and device identity snapshot
        timeout-minutes: 2
        working-directory: ${{ env.FABRIC_RELAY_SOURCE_DIR }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/fabric-relay-phase0"
          python3 -B scripts/ci/fabric_relay_phase0_identity.py \
            --out "$GITHUB_WORKSPACE/fabric-relay-phase0/identity.json"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/fabric-relay-phase0/repo_revision.txt"
          printf 'No runtime or serving-default change: this capture opens no device and loads no weight.\n' \
            > "$GITHUB_WORKSPACE/fabric-relay-phase0/README.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-fabric-relay-phase0-${{ github.run_id }}
          path: fabric-relay-phase0/
