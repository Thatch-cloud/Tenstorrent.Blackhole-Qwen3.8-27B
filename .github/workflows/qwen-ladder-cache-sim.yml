name: Qwen wide page-table replay qualification
on:
  push:
    tags: ['experiment/ladder-cache-sim-v1', 'experiment/ladder-cache-sim-v2', 'experiment/ladder-cache-sim-v3', 'experiment/ladder-cache-sim-v4']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  simulator:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        context: [65536, 131072]
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 9
    steps:
      - name: Verify host and restore result ownership
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          workspace=$(realpath -e "$GITHUB_WORKSPACE")
          results="$workspace/ladder-cache-source/experiment-results"
          if [ -e "$results" ]; then
            test ! -L "$results"
            test "$(realpath -e "$results")" = "$results"
            sudo -n chown -R -h "$(id -u):$(id -g)" "$results"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: ladder-cache-source
          persist-credentials: false
      - name: Weight-free page-table eager and changed-input replay
        working-directory: ladder-cache-source
        env:
          QWEN_SIM_ONLY: '1'
          QWEN_LEARNED_STACK: '1'
          QWEN_SIM_CASE: ladder-cache
          QWEN_LADDER_CONTEXT: '${{ matrix.context }}'
        run: timeout -k 15 450 bash scripts/ci/run-simulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-ladder-cache-sim-${{ matrix.context }}-${{ github.run_id }}
          path: ladder-cache-source/experiment-results/
