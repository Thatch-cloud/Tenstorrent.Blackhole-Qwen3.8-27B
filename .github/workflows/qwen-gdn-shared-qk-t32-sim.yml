name: Qwen T32 shared-QK recurrence and scatter replay
on:
  push:
    tags: ['experiment/gdn-shared-qk-t32-sim-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: gdn-t32-orchestrator
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8c102b20df22329106955b4006bf4d650bb94e40
          path: gdn-t32-candidate
          persist-credentials: false
      - name: Admit storage and stage full-width shared-QK and scatter
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p gdn-t32-candidate/experiment-results
          python3 -B gdn-t32-orchestrator/scripts/ci/runner_io_gate.py --attempts 1 \
            --output gdn-t32-candidate/experiment-results/runner-io-admission.json
          python3 -B gdn-t32-orchestrator/scripts/ci/frozen_recipe_context.py --checkout gdn-t32-candidate \
            --context 8192 --manifest gdn-t32-candidate/experiment-results/frozen-geometry.json
          python3 -B gdn-t32-orchestrator/scripts/ci/gdn_shared_qk_t32_stage.py --checkout gdn-t32-candidate \
            --manifest gdn-t32-candidate/experiment-results/gdn-t32-candidate.json
          git -C gdn-t32-candidate diff --check
      - name: Compare complete recurrent states and changed-input trace replay
        timeout-minutes: 8
        working-directory: gdn-t32-candidate
        env:
          QWEN_SIM_ONLY: '1'
          QWEN_LEARNED_STACK: '1'
          QWEN_SIM_CASE: gdn-shared-recurrence
        run: timeout -k 20 450 bash scripts/ci/run-simulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-gdn-shared-qk-t32-${{ github.run_id }}-${{ github.run_attempt }}
          path: gdn-t32-candidate/experiment-results/
          if-no-files-found: error
