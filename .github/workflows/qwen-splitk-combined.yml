name: Qwen combined T16 split-K audit
on:
  push:
    tags: ['experiment/dspark-splitk-combined-v1', 'experiment/dspark-splitk-combined-v2', 'experiment/dspark-splitk-combined-v3', 'experiment/dspark-splitk-combined-v4', 'experiment/dspark-splitk-combined-v5', 'experiment/dspark-splitk-timed-v1', 'experiment/dspark-splitk-timed-v2', 'experiment/dspark-64k-mlp-v1', 'experiment/dspark-splitk-timed-mlp-v1', 'experiment/dspark-64k-shared-v1']
  workflow_dispatch:
    inputs:
      cards_allocated:
        description: Both P150A cards exclusively allocated; serving stopped
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  combined:
    if: github.event_name == 'push' || inputs.cards_allocated
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 12
    steps:
      - name: Verify host and restore result ownership
        shell: bash
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          workspace=$(realpath -e "$GITHUB_WORKSPACE")
          results="$workspace/experiment-results"
          if [ -e "$results" ]; then
            test ! -L "$results"
            test "$(realpath -e "$results")" = "$results"
            sudo -n chown -R -h "$(id -u):$(id -g)" "$results"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build combined runtime and audit one 64K T16 request
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          QWEN_CARDS_ALLOCATED: '1'
          QWEN_SPLITK_COMBINED: '1'
          QWEN_64K_MLP_AUDIT: ${{ (github.ref == 'refs/tags/experiment/dspark-64k-mlp-v1' || github.ref == 'refs/tags/experiment/dspark-64k-shared-v1') && '1' || '0' }}
          QWEN_64K_SHARED_QK_AUDIT: ${{ github.ref == 'refs/tags/experiment/dspark-64k-shared-v1' && '1' || '0' }}
          QWEN_64K_MLP_TIMED: ${{ github.ref == 'refs/tags/experiment/dspark-splitk-timed-mlp-v1' && '1' || '0' }}
          QWEN_DSPARK_MODE: request-norm-scatter
          QWEN_DSPARK_64K_TRIAL: '1'
          QWEN_DSPARK_PHASE_PROBE: '1'
          QWEN_DSPARK_CAPTURED_PUBLICATION: '1'
          QWEN_DSPARK_SCORE_SFPU: '1'
          QWEN_DSPARK_SUM_SFPU: '1'
          QWEN_DSPARK_MASK_BITS: '1'
          QWEN_DSPARK_DIRECT_FP32_STAGE: '1'
          QWEN_DSPARK_NORMALIZATION_DIRECT_STAGE: '1'
          QWEN_DSPARK_CENTER_TILE_FILL: '1'
          QWEN_TARGET_T16_64K_REQUEST: '1'
          QWEN_DSPARK_SFPU_REQUEST_SCREEN: ${{ startsWith(github.ref, 'refs/tags/experiment/dspark-splitk-timed-') && '0' || '1' }}
          QWEN_DSPARK_SFPU_TIMED: ${{ startsWith(github.ref, 'refs/tags/experiment/dspark-splitk-timed-') && '1' || '0' }}
        shell: bash
        run: |
          mkdir -p experiment-results
          chmod 2775 experiment-results
          timeout -k 10 540 bash scripts/ci/run-dspark-hardware.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-splitk-combined-${{ github.run_id }}
          path: experiment-results/
          if-no-files-found: warn
