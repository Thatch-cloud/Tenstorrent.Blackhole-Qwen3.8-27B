name: Qwen CPU probe
on:
  push:
    tags: ['experiment/cpu-probe-v*']
permissions:
  contents: read
# No device, no weights, no mesh. Deliberately NOT in the exclusive group: this
# takes no card and must not queue behind a hardware run.
concurrency:
  group: qwen-cpu-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: cp
          persist-credentials: false
      - name: Run the CPU probe in the serving image, no devices attached
        working-directory: cp
        timeout-minutes: 11
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results
          # Image A (the served image since v99): the sdpa_decode dump must be of the kernels that run.
          image=sha256:0648ca9ad663acc72e7d8ea59d9cde0f9218b583ad74a60d58ff2f31bddd6fae
          m3native=sha256:e41ef884f4c8e07ce6632511fac19364af35dc73d601f05f5191784a64a3a768
          fastserv=sha256:836e7abb249b04018ce59848d290738142a7b9e6589e6770944f98d4b7630793
          for pair in "m3native:$m3native" "fastserv:$fastserv"; do
            label=${pair%%:*}
            ref=${pair#*:}
            c="qwen-treediff-$label-$GITHUB_RUN_ID"
            docker create --name "$c" --entrypoint /bin/true "$ref" >/dev/null
            mkdir -p "treediff/$label"
            docker cp "$c:/experiment-scripts/ci" "treediff/$label/" >/dev/null 2>&1 || true
            docker rm -f "$c" >/dev/null 2>&1 || true
          done
          python3 -B - <<'TREEPY' | tee experiment-results/tree-diff.txt
          import hashlib, pathlib
          roots = {n: pathlib.Path('treediff') / n / 'ci' for n in ('m3native', 'fastserv')}
          for name, root in roots.items():
              print('%s: %d files' % (name, len(list(root.glob('*.py')))))
          def digests(root):
              out = {}
              for f in sorted(root.glob('*.py')):
                  out[f.name] = hashlib.sha256(f.read_bytes()).hexdigest()[:16]
              return out
          a, b = digests(roots['m3native']), digests(roots['fastserv'])
          only_a = sorted(set(a) - set(b))
          only_b = sorted(set(b) - set(a))
          differ = sorted(n for n in set(a) & set(b) if a[n] != b[n])
          print()
          print('ONLY IN m3native (%d): %s' % (len(only_a), ' '.join(only_a)))
          print('ONLY IN fastserv (%d): %s' % (len(only_b), ' '.join(only_b)))
          print()
          print('DIFFERING CONTENT (%d):' % len(differ))
          GDN = [n for n in differ if 'gdn' in n or 'conv' in n]
          for n in differ:
              print('   %-44s %s %s%s' % (n, a[n], b[n], '   <-- GDN/conv chain' if n in GDN else ''))
          print()
          print('GDN/conv files that differ: %s' % (' '.join(GDN) or 'none'))
          TREEPY
          rm -rf treediff
          # Every probe_*.py in scripts/ci runs, so adding a probe needs no workflow
          # edit and a stale name cannot silently re-run yesterday's question. Each
          # must print VERDICT; the step fails if any does not.
          scripts=$(cd scripts/ci && ls probe_*.py | sort)
          echo "probes: $scripts"
          for script in $scripts; do
            name="qwen-cpu-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${script%.py}"
            echo "=== $script ===" | tee -a experiment-results/probe.log
            timeout -k 20 420 docker run --rm --name "$name" --network none --cap-drop ALL --security-opt no-new-privileges --pids-limit 1024 --cpus 8 --memory 16g --tmpfs /tmp:rw,size=512m --mount "type=bind,src=$PWD/scripts/ci,dst=/probe,readonly" -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/probe:/experiment-scripts/ci -e VLLM_PLUGINS='' -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 -e OMP_NUM_THREADS=2 -e MKL_NUM_THREADS=2 --entrypoint python3 "$image" -B "/probe/$script" >> experiment-results/probe.log 2>&1 || true
            timeout 20 docker rm -f "$name" >/dev/null 2>&1 || true
          done
          if grep -qE 'Unable to find image|^docker: ' experiment-results/probe.log; then
            echo 'A container never started.'
            head -5 experiment-results/probe.log || true
            exit 1
          fi
          cat experiment-results/probe.log
          want=$(echo "$scripts" | wc -w)
          got=$(grep -c '^VERDICT' experiment-results/probe.log || true)
          echo "probes=$want verdicts=$got"
          if [ "$got" != "$want" ]; then
            echo 'A probe did not reach a verdict.'
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-cpu-probe-${{ github.run_id }}
          path: cp/experiment-results/
