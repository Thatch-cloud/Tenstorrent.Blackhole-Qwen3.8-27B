name: Qwen CPU probe
on:
  push:
    tags: ['experiment/cpu-probe-v*']
permissions:
  contents: read
# No device, no weights, no mesh. Deliberately NOT in the exclusive group: this
# takes no card and must not queue behind a hardware run.
concurrency:
  group: qwen-cpu-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: cp
          persist-credentials: false
      - name: Run the CPU probe in the serving image, no devices attached
        working-directory: cp
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results
          image=sha256:43cbdd84bca9975197f898d72d34e0e87392df6b5ac289f720e2bdfbf231f407
          # Every probe_*.py in scripts/ci runs, so adding a probe needs no workflow
          # edit and a stale name cannot silently re-run yesterday's question. Each
          # must print VERDICT; the step fails if any does not.
          scripts=$(cd scripts/ci && ls probe_*.py | sort)
          echo "probes: $scripts"
          for script in $scripts; do
            name="qwen-cpu-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${script%.py}"
            echo "=== $script ===" | tee -a experiment-results/probe.log
            timeout -k 20 420 docker run --rm --name "$name" --network none --cap-drop ALL --security-opt no-new-privileges --pids-limit 1024 --cpus 8 --memory 16g --tmpfs /tmp:rw,size=512m --mount "type=bind,src=$PWD/scripts/ci,dst=/probe,readonly" -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/probe:/experiment-scripts/ci -e VLLM_PLUGINS='' -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 -e OMP_NUM_THREADS=2 -e MKL_NUM_THREADS=2 --entrypoint python3 "$image" -B "/probe/$script" >> experiment-results/probe.log 2>&1 || true
            timeout 20 docker rm -f "$name" >/dev/null 2>&1 || true
          done
          if grep -qE 'Unable to find image|^docker: ' experiment-results/probe.log; then
            echo 'A container never started.'
            head -5 experiment-results/probe.log || true
            exit 1
          fi
          cat experiment-results/probe.log
          want=$(echo "$scripts" | wc -w)
          got=$(grep -c '^VERDICT' experiment-results/probe.log || true)
          echo "probes=$want verdicts=$got"
          if [ "$got" != "$want" ]; then
            echo 'A probe did not reach a verdict.'
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-cpu-probe-${{ github.run_id }}
          path: cp/experiment-results/
