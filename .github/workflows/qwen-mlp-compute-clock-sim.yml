name: Qwen bounded MLP compute-clock replay simulation
on:
  push:
    tags: ['experiment/mlp-compute-clock-sim-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: clock-orchestrator
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8c102b20df22329106955b4006bf4d650bb94e40
          path: clock-candidate
          persist-credentials: false
      - name: Stage bounded diagnostic against frozen T16
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p clock-candidate/experiment-results
          python3 -B clock-orchestrator/scripts/ci/frozen_recipe_context.py \
            --checkout clock-candidate --context 8192 \
            --manifest clock-candidate/experiment-results/frozen-geometry.json
          python3 -B clock-orchestrator/scripts/ci/mlp_compute_clock_stage.py \
            --checkout clock-candidate --manifest clock-candidate/experiment-results/compute-clock-candidate.json
          git -C clock-candidate diff --check
          git -C clock-candidate diff > clock-candidate/experiment-results/clock.patch
      - name: Exact T16 eager and changed-input replay with fresh samples
        timeout-minutes: 10
        working-directory: clock-candidate
        env:
          QWEN_SIM_ONLY: '1'
          QWEN_LEARNED_STACK: '1'
          QWEN_SIM_CASE: fusion-t16-target
        run: timeout -k 30 570 bash scripts/ci/run-simulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-mlp-compute-clock-sim-${{ github.run_id }}-${{ github.run_attempt }}
          path: clock-candidate/experiment-results/
