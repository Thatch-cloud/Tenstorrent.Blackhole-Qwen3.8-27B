name: Qwen drafter HiFi2 remaining projection simulations
on:
  push:
    tags: ['experiment/dspark-projection-hifi2-matrix-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        projection: [self_attn.k_proj.weight, self_attn.v_proj.weight, self_attn.o_proj.weight, mlp.gate_proj.weight, mlp.up_proj.weight, mlp.down_proj.weight]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: order-orchestrator
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8c102b20df22329106955b4006bf4d650bb94e40
          path: order-candidate
          persist-credentials: false
      - name: Stage isolated drafter projection candidate
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p order-candidate/experiment-results
          python3 -B order-orchestrator/scripts/ci/frozen_recipe_context.py --checkout order-candidate \
            --context 8192 --manifest order-candidate/experiment-results/frozen-geometry.json
          python3 -B order-orchestrator/scripts/ci/dspark_projection_precision_stage.py --checkout order-candidate \
            --projection '${{ matrix.projection }}' --manifest order-candidate/experiment-results/precision-candidate.json
          git -C order-candidate diff --check
      - name: Measure precision differences and exact same-policy replay
        timeout-minutes: 10
        working-directory: order-candidate
        env:
          QWEN_SIM_ONLY: '1'
          QWEN_LEARNED_STACK: '1'
          QWEN_SIM_CASE: dspark-projection-hifi2
        run: timeout -k 30 570 bash scripts/ci/run-simulator.sh
      - name: Independently validate projection identity and replay
        run: |
          python3 -B order-orchestrator/scripts/ci/dspark_projection_precision_report.py \
            order-candidate/experiment-results/dspark-projection-hifi2.json --projection '${{ matrix.projection }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-dspark-projection-hifi2-${{ matrix.projection }}-${{ github.run_id }}
          path: order-candidate/experiment-results/
