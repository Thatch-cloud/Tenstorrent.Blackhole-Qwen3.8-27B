name: Qwen matched combined full-response timing
on:
  push:
    tags: ['experiment/matched-combined-timed-v1', 'experiment/workers16-combined-timed-v1', 'experiment/workers16-history-profile-v1', 'experiment/workers16-history-profile-v2', 'experiment/matched-score-pair-v1']
permissions:
  contents: read
  actions: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  combined:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 12
    steps:
      - name: Verify host and restore result ownership
        shell: bash
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          workspace=$(realpath -e "$GITHUB_WORKSPACE")
          results="$workspace/experiment-results"
          if [ -e "$results" ]; then
            test ! -L "$results"
            test "$(realpath -e "$results")" = "$results"
            sudo -n chown -R -h "$(id -u):$(id -g)" "$results"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject contended host before loading weights
        timeout-minutes: 1
        shell: bash
        run: |
          mkdir -p experiment-results
          chmod 2775 experiment-results
          timeout -k 5 25 python3 -B scripts/ci/runner_io_gate.py --output experiment-results/runner-io-admission.json
      - name: Cached build and two complete 64K requests
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          QWEN_CARDS_ALLOCATED: '1'
          QWEN_MATCHED_COMBINED: '1'
          QWEN_MATCHED_SCORE_LAYOUT: ${{ github.ref_name == 'experiment/matched-score-pair-v1' && '1' || '0' }}
          QWEN_MATCHED_SCORE_PAIR: ${{ github.ref_name == 'experiment/matched-score-pair-v1' && '1' || '0' }}
          QWEN_SPLITK_WORKERS: ${{ startsWith(github.ref_name, 'experiment/workers16-') && '16' || '8' }}
          QWEN_HISTORY_WAIT_PROFILE: ${{ startsWith(github.ref_name, 'experiment/workers16-history-profile-') && '1' || '0' }}
          QWEN_SPLITK_COMBINED: '1'
          QWEN_64K_MLP_TIMED: '1'
          QWEN_64K_SHARED_QK_TIMED: '1'
          QWEN_64K_SCORE_TIMED: '1'
          QWEN_LAZY_WEIGHT_LOAD: '1'
          QWEN_DSPARK_MODE: request-norm-scatter
          QWEN_DSPARK_64K_TRIAL: '1'
          QWEN_DSPARK_PHASE_PROBE: '1'
          QWEN_DSPARK_CAPTURED_PUBLICATION: '1'
          QWEN_DSPARK_SCORE_SFPU: '1'
          QWEN_DSPARK_SUM_SFPU: '1'
          QWEN_DSPARK_MASK_BITS: '1'
          QWEN_DSPARK_DIRECT_FP32_STAGE: '1'
          QWEN_DSPARK_NORMALIZATION_DIRECT_STAGE: '1'
          QWEN_DSPARK_CENTER_TILE_FILL: '1'
          QWEN_TARGET_T16_64K_REQUEST: '1'
          QWEN_DSPARK_SFPU_REQUEST_SCREEN: '0'
          QWEN_DSPARK_SFPU_TIMED: '1'
        run: |
          mkdir -p experiment-results
          chmod 2775 experiment-results
          timeout -k 10 590 bash scripts/ci/run-dspark-hardware.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-matched-timed-${{ github.run_id }}-${{ github.run_attempt }}
          path: experiment-results/
