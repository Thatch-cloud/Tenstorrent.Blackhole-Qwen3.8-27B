name: Qwen GDN user-slot copy simulator
on:
  push:
    tags: ['experiment/gdn-slot-copy-sim-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: slot-candidate
          persist-credentials: false
      - name: Admit host and stage weight-free slot probe
        working-directory: slot-candidate
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results
          python3 -B scripts/ci/runner_io_gate.py --attempts 1 --output experiment-results/runner-io-admission.json
          cp scripts/ci/gdn-slot-copy-probe.py scripts/ci/history-append-probe.py
          cmp scripts/ci/gdn-slot-copy-probe.py scripts/ci/history-append-probe.py
          python3 -B - <<'PY'
          from pathlib import Path
          path = Path('scripts/ci/simulator-suite.sh')
          source = path.read_text()
          anchor = 'timeout -k 10 180 python3 -u /experiment-scripts/ci/history-append-probe.py'
          if source.count(anchor) != 1:
              raise ValueError('Expected one bounded history probe route')
          path.write_text(source.replace(anchor, anchor.replace('180', '240')))
          PY
      - name: Eager and changed-input replay on two simulated chips
        working-directory: slot-candidate
        env:
          QWEN_SIM_ONLY: '1'
          QWEN_LEARNED_STACK: '1'
          QWEN_SIM_CASE: history-append
        run: timeout -k 15 330 bash scripts/ci/run-simulator.sh
      - name: Independently validate all source and destination slots
        working-directory: slot-candidate
        run: |
          test "$(cat experiment-results/history-append.exit-status)" = 0
          python3 -B scripts/ci/gdn_slot_copy_report.py experiment-results/history-append.json scripts/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-gdn-slot-copy-${{ github.run_id }}-${{ github.run_attempt }}
          path: slot-candidate/experiment-results/
          if-no-files-found: error
