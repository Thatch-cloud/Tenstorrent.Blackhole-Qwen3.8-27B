name: Qwen C2 serving image
# Build, smoke and publish the C2 serving base (docker/qwen-c2-serving.Dockerfile) on the rig,
# driven by .github/c2-serving-job.env at the tagged commit. The rig's LAN is not always
# reachable; its runners reach GitHub outbound, so this is the way in from offsite.
# Actions (C2_ACTIONS, space-separated, run in this order):
#   status - what the rig holds: the last manual build log, C2 images, card M's and card A's holders, the agent
#   reset  - (see its steps) cards M and A together, or with C2_CARDS=quad all four cards together with the heal
#   fabric - C2_CARDS=quad only: the four-card fabric probe (scripts/ci/tp4_fabric_probe.py) inside the image on
#            every Blackhole board present, the (1, 4) mesh the TP4 profiles open: the ring, the links each edge
#            trained and the model's own all-gather / reduce-scatter timed at 1 and 2 links; fabric-probe.json.
#            C2_FABRIC_PROBE=rs-tile runs scripts/ci/tp4_rs_tile_spike.py instead (the model's own all-reduce on a
#            64-row block against its one-tile calls, bit for bit, then the tile-split wrapper): rs-tile-spike.json
#   cardm  - a single-card qualification harness (C2_CARDM_HARNESS, e.g. optimisation/ttnn-op/k64j/run_card_b.sh)
#            on card M alone, card B being reserved for another project: QUAL_CARD=card M, ALLOW_SERVING_CARD=1, after
#            the same refusals as the gate (anything holding M or A, a platform serving container); never card
#            A or card B, and never a reset (put reset before it after a hang); results in cardm/
#   build  - build tt-vllm:qwen38-c2-$C2_IMAGE_TAG unless present (waits for a build in flight);
#            the overlay is docker/qwen-c2-overlay.txt, and the tag lands only after G1 provenance
#            (binaries and op directories, overlay sha256s and revision, boot argv and exact's v235
#            environment, the layer model, the frozen-recipe pins; provenance.json in the results)
#            passes. Before a first build, `c2_image_provenance.py --base-drift` on the P8 base shows
#            what G1 would fail on, read-only.
#   drift  - read-only, no cards: G1's strings, layer and frozen-pin checks on the P8 base
#            (c2_image_provenance.py --base-drift), base-drift.log/.json in the results; reports,
#            never fails the job - the build's G1 enforces
#   probe  - the prefix-reuse P0a probe (scripts/ci/prefix_p0a_probe.py) inside
#            tt-vllm:qwen38-c2-$C2_IMAGE_TAG, on the CPU: no --device, no network, the model
#            snapshot read-only; opens no card. Then the prefix gates' oracle against the same
#            real scheduler graft (scripts/ci/prefix_oracle_check.py)
#   smoke  - run it on cards M+A shaped like the node agent's container, then the API smoke
#            (scripts/ci/c2_serving_smoke.py); the container is always removed
#   gate   - the m3native gate harness inside the image, in the agent's container shape, serving
#            the contract's argv (scripts/ci/c2_serving_gate.py): C2_GATE_PLAN bringup (4 x 131072
#            real text against v235's texts), matrix (a prompt length per user, solo vs concurrent
#            under the exactness policy), memory (G5's DRAM lines), lifecycle (drops, cancels,
#            max_tokens=1, ignore_eos, freed slots, against a solo arm); C2_PROFILE picks the profile.
#            C2_GATE_PLAN ops-twin and ops-trace are the TP4 op-level device profile (docs/tp4-profile.md): after
#            every other plan, the twin first, on the four-card timed profile (c2-packed-tp4-speed); the CPP report
#            (compressed) and its analysis are written to gate/ops/ in the artifact.
#            C2_GATE_SALT fresh|none salts every stream on a prefix-reuse profile (c2-packed-prefix: the
#            capture path under the S2 plans; the gate mounts its own salt key).
#            The driver refuses plans that do not fit the step's and the job's time left; every gate
#            container is removed however the step ends
#   prefix - the prefix-reuse (general-prefix, G1) gates in the agent's container shape
#            (scripts/ci/c2_prefix_gate.py): C2_PREFIX_PLAN bringup (grants disabled == the baseline
#            byte for byte, the first hit compiles nothing, the install and platform lines, the anchor
#            probe), exactness (a real-text agent chain 2.6k -> 60k, every turn cold vs hit in full, the
#            2047/2048/2049 boundaries and tail-only hits, a changed suffix, an early divergence, a shared
#            system block; audit and eager arms), lifecycle (arrivals, aborts, a KV flood, a small store,
#            a tiny pool, reset_prefix_cache, the kill switch, an in-place restart), timing (busy agents in
#            the metering shape, hit rate from the model's L-Q). On c2-packed-prefix (the fast path's
#            sticky sessions, baseline c2-packed) the same plans judge the DFlash drop and C0 plan, strict
#            equality, the S2 lines, and exactness-shared (four agents on one system block in packed rounds).
#            Every prefix container is removed however the step ends, and the kill-switch file only if the
#            gate wrote it
#   replay - the agent's serving sequence in a copy of its container (scripts/ci/c2_platform_replay.py);
#            C2_REPLAY_SERVED_MODEL, when set, is the name it must advertise (default Qwen/Qwen3.8-27B:tt).
#            With C2_CARDS=quad the copy gets every Blackhole board present (card_set.sh, none named) and
#            C2_REPLAY_PROFILE, a P150x4 profile, is required: the profile the copy must BOOT by the image default
#            (the agent forwards no QWEN_C2_PROFILE, so none is set); each boot's vLLM subprocess log (/tmp in the
#            container, not docker logs) must then also show that profile, the four-card mesh, the admission
#            passed, parser M armed, the extent path engaged and the prefill warm
#   push   - push it to zot and print the digest
# (status, platform, unserve, priority and reset are described at their steps.) The job file is
# parsed by scripts/ci/c2_serving_job.py, which refuses anything these steps must not act on.
# C2_CARDS picks the card set the hardware steps open: pair (cards M and A, the default) or quad (every Blackhole
# board present, resolved by board id when used - scripts/ci/card_set.sh - and mounted into the gate and prefix
# containers, with the general-tp4 profiles). It is one job, one runner and one concurrency group either way: the
# four-card job holds every card the pair job does, so the group needs no second name and no run of any other
# hardware workflow can overlap it. scripts/ci/c2_serving_job.py refuses a quad job that asks for a pair-shaped
# step (cardm, priority) or a profile that does not open the (1, 4) mesh, and the reverse.
# The smoke opens M+A, so it shares the two-card concurrency group and refuses if anything
# holds either card or a platform serving container exists.
on:
  push:
    tags: ['experiment/c2-serving-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  c2-serving:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: c2
          persist-credentials: false
          fetch-depth: 0  # the build's closure tests read the bundle and P8 base commits
      - name: Read the job file
        id: job
        working-directory: c2
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          python3 scripts/ci/c2_serving_job.py .github/c2-serving-job.env >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
          # When the job began: the gate step budgets its plans against what the job's timeout leaves.
          echo "C2_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/c2-results"
      - name: Status
        if: contains(steps.job.outputs.actions, 'status')
        working-directory: c2
        shell: bash
        run: |
          set +e
          echo "=== manual build log"; tail -40 /home/thatch/c2-build.log 2>&1
          echo "=== build in flight"; pgrep -af build-c2-serving-image || echo none
          echo "=== images"; docker images --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.CreatedSince}} {{.Size}}' | grep -E 'qwen38-c2|thatch-serving-tt' | head
          echo "=== persistent cache"; sudo -n du -sh /home/thatch/hf-cache/hub/.qwen-c2 /home/thatch/hf-cache/hub/.qwen-c2.partial 2>&1
          # Card M and card A only, resolved by board id as the reset step resolves them (scripts/ci/serving_pair.sh):
          # card B is reserved for another project, so its link, its node and its holders are never listed here.
          echo "=== cards M and A"
          . scripts/ci/serving_pair.sh
          for card in $QUAL_SERVING_CARDS; do ls -l "$QUAL_BYID_ROOT/$card" 2>&1; done
          if serving_pair_nodes; then sudo -n fuser -v "${SERVING_PAIR_NODES[@]}" 2>&1 || echo "no holders"; fi
          # Whether this tt-smi can reset M and A without re-detecting every board afterwards (card B is reserved):
          # the reset step passes --no_reinit only once this listing shows the flag.
          echo "=== tt-smi reset options"; smi=$(command -v tt-smi || echo /home/thatch/.local/bin/tt-smi)
          "$smi" --version 2>&1 | head -2; "$smi" --help 2>&1 | grep -i -E -A1 "reinit|--reset|-r " | head -12
          echo "=== serving containers"; docker ps -a --format '{{.Names}} {{.Image}} {{.Status}}' | grep -E 'thatch-inference|qwen-c2' || echo none
          # pipefail survives set +e: a journal of heartbeats only (grep -v selects nothing) must not fail the step (run 36710266877).
          echo "=== agent"; journalctl --user -u thatch-node-agent --since -3h --no-pager 2>&1 | grep -v -i heartbeat | tail -15 || true
      - name: Status of the four-card set
        if: contains(steps.job.outputs.actions, 'status') && steps.job.outputs.cards == 'quad'
        working-directory: c2
        timeout-minutes: 10
        shell: bash
        run: |
          set +e
          # Every Blackhole board present, by board id, as the reset step resolves them (scripts/ci/card_set.sh):
          # links, nodes, PCI addresses, upstream ports, holders, and the disk the four-card weight cache needs.
          . scripts/ci/card_set.sh
          echo "=== four-card set"
          card_set_resolve 0
          echo "resolve exit $?"
          if [ "${#CARD_SET_NODES[@]}" != 0 ]; then
            card_set_unheld "$RUNNER_TEMP/c2-results/quad-holders.txt" && echo "no holders (tt-smi aside)" \
              || { echo "held:"; cat "$RUNNER_TEMP/c2-results/quad-holders.txt"; }
          fi
          # The four-card preconditions (each printed, none acted on): 1 GiB hugepages (four devices map one each),
          # the firmware and ethernet versions tt-smi reports per board, the driver's -121 (I2C/telemetry) errors
          # since boot, and whether this user can open every node.
          echo "=== hugepages (1 GiB pages: four devices need four free)"
          hp=/sys/kernel/mm/hugepages/hugepages-1048576kB
          echo "total $(cat $hp/nr_hugepages 2>&1) free $(cat $hp/free_hugepages 2>&1)"
          [ "$(cat $hp/free_hugepages 2>/dev/null || echo 0)" -ge 4 ] || echo "WARNING: fewer than 4 free 1 GiB hugepages"
          echo "=== firmware and ethernet versions"
          smi=$(command -v tt-smi || echo /home/thatch/.local/bin/tt-smi)
          "$smi" --version 2>&1 | head -2
          "$smi" -s 2>/dev/null | grep -i -E 'fw_bundle|eth_fw|cm_fw|dm_app_fw|dm_bl_fw|flash_bundle' | sort | uniq -c
          echo "=== driver -121 errors since boot"
          sudo -n dmesg 2>/dev/null | grep -i -E 'tenstorrent|tt-kmd' | grep -E -e '-121' | tail -5 || true
          echo "count: $(sudo -n dmesg 2>/dev/null | grep -i -E 'tenstorrent|tt-kmd' | grep -c -E -e '-121')"
          echo "=== node permissions (this user opens each)"
          for node in "${CARD_SET_NODES[@]}"; do
            if [ -r "$node" ] && [ -w "$node" ]; then echo "$node rw"; else echo "WARNING: $node not readable and writable by $(id -un)"; fi
          done
          echo "=== persistent cache (a (1, 4) weight cache is a new ~28 GiB beside the pair's)"
          df -h /home/thatch/hf-cache/hub 2>&1 | tail -2
          sudo -n du -sh /home/thatch/hf-cache/hub/.qwen-c2 2>&1
          echo "=== serving containers"; docker ps -a --format '{{.Names}} {{.Image}} {{.Status}}' | grep -E 'thatch-inference|qwen-c2' || echo none
      - name: Remove superseded images
        if: contains(steps.job.outputs.actions, 'rmi')
        shell: bash
        env:
          RMI_TAGS: ${{ steps.job.outputs.rmi_tags }}
        run: |
          # Deletes only the named superseded C2 images (scripts/ci/c2_serving_job.py refused any production tag). No force
          # flag, no pruning: an image a container uses is left alone, and so is everything outside the list.
          set +e
          echo "=== disk before"; df -h /
          for tag in $RMI_TAGS; do
            full=zot.thatch.local:5000/tt-vllm:qwen38-c2-$tag
            if ! docker image inspect "$full" >/dev/null 2>&1; then
              echo "$full: absent"; continue
            fi
            users=$(docker ps -a --filter "ancestor=$full" -q)
            if [ -n "$users" ]; then
              echo "$full: in use by $(echo $users | wc -w) container(s), kept"; continue
            fi
            if docker rmi "$full"; then echo "$full: removed"; else echo "$full: docker rmi failed (kept)"; fi
          done
          echo "=== disk after"; df -h /
          exit 0
      - name: Prune build cache and dangling images
        # The rig is the production control plane: the kubelet garbage-collects images at 85% of its root disk and evicts
        # at 95% (2026-09-27 DiskPressure). Image builds add ~32 GB each. This removes only BuildKit cache older than 12 h
        # and dangling (untagged) images: no tagged image, no volume, no container.
        if: contains(steps.job.outputs.actions, 'prune')
        shell: bash
        run: |
          set +e
          echo "=== disk before"; df -h /; docker system df
          docker builder prune -f --filter until=12h
          docker image prune -f
          echo "=== disk after"; df -h /; docker system df
          exit 0
      - name: Stop the node agent
        if: contains(steps.job.outputs.actions, 'agentstop')
        shell: bash
        run: |
          # Actions runs bash with -e: `systemctl is-active` exits 3 for an inactive unit, which killed run 36988136422 after the
          # stop had worked. Every failure here is handled explicitly instead.
          set +e
          set -uo pipefail
          # Stopping the agent stops the serving container it started, so the cards come free. The unserve step after
          # this one removes what is left. The unit lives on the host only: a pod has none, and a job that landed on one
          # would otherwise "stop" nothing and report success.
          # The runner runs as the agent's user with HOME set to the runner's own directory: the unit is under the user's passwd
          # home, and systemctl --user needs the user's bus (run 36987818797 looked under the runner's HOME and refused).
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=$XDG_RUNTIME_DIR/bus}"
          agent_home=$(getent passwd "$(id -un)" | cut -d: -f6)
          unit="${agent_home:-/nonexistent}/.config/systemd/user/thatch-node-agent.service"
          loaded=$(systemctl --user show -p LoadState --value thatch-node-agent.service 2>&1)
          echo "runner user $(id -un), passwd home ${agent_home:-?}, unit file $([ -f "$unit" ] && echo present || echo absent), LoadState ${loaded}"
          if [ ! -f "$unit" ] || [ "$loaded" != loaded ]; then
            echo "::error::the node agent's user unit is not visible here (unit $unit, LoadState $loaded): not the host runner, or no user bus; refusing" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/c2-results"
          echo "node agent before: $(systemctl --user is-active thatch-node-agent.service)"
          systemctl --user stop thatch-node-agent.service
          state=unknown
          for _ in $(seq 1 45); do
            state=$(systemctl --user is-active thatch-node-agent.service)
            [ "$state" != active ] && break
            sleep 2
          done
          echo "node agent after: $state"
          if [ "$state" = active ]; then
            echo "::error::the node agent is still active 90 s after the stop" >&2
            exit 1
          fi
          echo "node agent stopped ($state)" >> "$RUNNER_TEMP/c2-results/agent.log"
          echo "=== inference containers (the unserve step removes them)"
          docker ps -a --format '{{.Names}} {{.Image}} {{.Status}}' | grep '^thatch-inference-' || echo none
      - name: Platform serving container (read-only)
        if: contains(steps.job.outputs.actions, 'platform')
        shell: bash
        run: |
          set +e
          results="$RUNNER_TEMP/c2-results"
          for c in $(docker ps -a --format '{{.Names}}' | grep '^thatch-inference-'); do
            echo "=== $c"
            docker inspect -f '{{.State.Status}} started={{.State.StartedAt}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} image={{.Image}}' "$c"
            docker inspect -f '{{json .Config.Env}}' "$c" | tr ',' '\n' | grep -E 'QWEN_C2|THATCH_VLLM_KWARGS|MESH|TT_MESH|THATCH_MODEL_ENGINE|QWEN36' | cut -c1-300
            port=$(docker port "$c" 8000/tcp | head -1 | sed 's/.*://')
            echo "published port: $port"
            curl -sS -m 10 "http://127.0.0.1:$port/healthz"; echo
            curl -sS -m 10 "http://127.0.0.1:$port/v1/models" | head -c 600; echo
            curl -sS -m 120 "http://127.0.0.1:$port/v1/chat/completions" -H 'content-type: application/json' \
              -d '{"model":"Qwen/Qwen3.8-27B","max_tokens":24,"messages":[{"role":"user","content":"Say hello."}]}' | head -c 1200; echo
            docker stats --no-stream "$c"
          done
          d=/home/thatch/.local/state/thatch/serving-diagnostics
          echo "=== diagnostics $d"; ls -lat "$d" 2>&1 | head -12
          for f in $(ls -t "$d" 2>/dev/null | head -4); do
            echo "--- $f"; cp "$d/$f" "$results/" 2>/dev/null || sudo -n cp "$d/$f" "$results/"
            python3 -c 'import sys; sys.stdout.write(open(sys.argv[1], errors="replace").read().replace(chr(92) + "n", chr(10)))' "$d/$f" \
              | grep -v -E '^\[[0-9a-f]+:[0-9]+\] \[ *[0-9]+\]' | tail -80
          done
          # pipefail survives set +e: a journal of heartbeats only (grep -v selects nothing) must not fail the step (run 36710266877).
          echo "=== agent"; journalctl --user -u thatch-node-agent --since -30min --no-pager 2>&1 | grep -v -i heartbeat | tail -40 || true
      - name: Take the platform serving container down
        if: contains(steps.job.outputs.actions, 'unserve')
        shell: bash
        run: |
          set -uo pipefail
          # Frees cards M+A for development: a graceful stop (the image's engine skips tt-metal's
          # teardown, so the pair reopens cleanly), then removal. The placement itself is removed
          # through the admin API; until then the platform may try to load it again.
          for c in $(docker ps -a --format '{{.Names}}' | grep '^thatch-inference-'); do
            echo "stopping $c ($(docker inspect -f '{{.State.Status}} {{.Config.Image}}' "$c"))"
            docker stop -t 60 "$c"
            docker rm "$c"
          done
          m=$(readlink -f /dev/tenstorrent/by-id/blackhole-CEF5729692C19E6D)
          a=$(readlink -f /dev/tenstorrent/by-id/blackhole-3707293C249A5E67)
          echo "holders of M ($m) and A ($a):"; sudo -n fuser -v "$m" "$a" 2>&1 || echo "none"
      - name: CPU priority for the serving container
        if: contains(steps.job.outputs.actions, 'priority')
        working-directory: c2
        timeout-minutes: 20
        shell: bash
        run: |
          set -uo pipefail
          # Measures the live serving container's decode before and after: system.slice's CPUWeight
          # raised to kubepods.slice's (persistent systemd drop-in), and ci-docker-fence taught to
          # give every thatch-inference-* container weight 10000 on cores 0-15,32-47 as it starts.
          results="$RUNNER_TEMP/c2-results"
          c=$(docker ps --format '{{.Names}}' | grep '^thatch-inference-' | head -1)
          test -n "$c" || { echo "no serving container running" >&2; exit 1; }
          port=$(docker port "$c" 8000/tcp | head -1 | sed 's/.*://')
          id=$(docker inspect -f '{{.Id}}' "$c")
          scope=/sys/fs/cgroup/system.slice/docker-$id.scope
          show() {
            echo "--- $1: loadavg $(cut -d' ' -f1-3 /proc/loadavg)"
            for f in /sys/fs/cgroup/kubepods.slice/cpu.weight /sys/fs/cgroup/system.slice/cpu.weight "$scope/cpu.weight" \
                     "$scope/cpuset.cpus" "$scope/cpu.max"; do printf '%s = %s\n' "$f" "$(cat "$f" 2>/dev/null)"; done
            grep -E 'nr_throttled|throttled_usec' "$scope/cpu.stat" | tr '\n' ' '; echo
            echo "busy ARC runner pods: $(sudo -n k3s kubectl -n arc-runners get pods --no-headers 2>/dev/null | grep -c Running)"
          }
          measure() {
            python3 scripts/ci/c2_decode_probe.py "http://127.0.0.1:$port" "$1" 3 | tee -a "$results/priority.log"
          }
          show before | tee "$results/priority.log"
          measure before
          echo "=== fence script before"; sudo -n cat /usr/local/bin/ci-docker-fence.sh | head -40
          sudo -n systemctl set-property system.slice CPUWeight=2500
          sudo -n install -m 0755 scripts/ci/rig/ci-docker-fence.sh /usr/local/bin/ci-docker-fence.sh
          sudo -n systemctl restart ci-docker-fence.service
          sleep 5
          sudo -n systemctl status ci-docker-fence.service --no-pager | tail -6
          show after | tee -a "$results/priority.log"
          measure after
      - name: Rescan the PCI bus for a missing board
        # A board that drops off the bus outside a reset (a cancelled job, 2026-10-03: "3 Blackhole boards are present, not 4")
        # has no pre-reset snapshot for the reset's own heal to rescan its port from. This rescans the bus once, only when
        # fewer than four Tenstorrent boards are on it, waits for the fourth, and prints what the kernel logged.
        if: contains(steps.job.outputs.actions, 'rescan')
        shell: bash
        run: |
          set +e
          boards() { lspci -D -d 1e52: 2>/dev/null | wc -l; }
          echo "=== Tenstorrent boards on the bus before: $(boards)"; lspci -D -d 1e52:
          if [ "$(boards)" -lt 4 ]; then
            echo 1 | sudo -n tee /sys/bus/pci/rescan > /dev/null; echo "bus rescan write: exit $?"
            for i in $(seq 1 36); do [ "$(boards)" -ge 4 ] && break; sleep 5; done
            echo "=== after the rescan: $(boards)"; lspci -D -d 1e52:
          fi
          # A board on the bus without a by-id link (the post-reset telemetry race: udev made no link): re-probe its driver.
          linked() { local l; for l in "$QUAL_BYID_ROOT"/blackhole-*; do [ -e "$l" ] && udevadm info -q path -n "$(readlink -f "$l")" 2>/dev/null; done; }
          QUAL_BYID_ROOT=/dev/tenstorrent/by-id
          paths=$(linked); echo "=== by-id links: $(echo "$paths" | grep -c .)"
          for p in $(lspci -D -d 1e52: | awk '{print $1}'); do
            case "$paths" in *"/$p/"*) continue ;; esac
            echo "board at $p is on the bus without a by-id link: driver re-probe"
            echo "$p" | sudo -n tee /sys/bus/pci/drivers/tenstorrent/unbind > /dev/null; echo "unbind: exit $?"; sleep 3
            echo "$p" | sudo -n tee /sys/bus/pci/drivers/tenstorrent/bind > /dev/null; echo "bind: exit $?"
          done
          for i in $(seq 1 24); do [ "$(linked | grep -c .)" -ge 4 ] && break; sleep 5; done
          echo "=== by-id links after: $(linked | grep -c .)"
          echo "=== kernel"; sudo -n dmesg 2>/dev/null | grep -i -E "pciehp|tenstorrent|train|link" | tail -25
          [ "$(boards)" -ge 4 ] && [ "$(linked | grep -c .)" -ge 4 ] || { echo "::error::still $(boards) boards on the bus, $(linked | grep -c .) by-id links: the board needs a power cycle"; exit 1; }
      - name: Reset cards M and A
        if: contains(steps.job.outputs.actions, 'reset') && steps.job.outputs.cards != 'quad'
        working-directory: c2
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          # As the m3native gate does before every run, for its llrt.cpp:594 ethernet-core wedge:
          # card M and card A together by board id (scripts/ci/serving_pair.sh), never card B, then
          # the self-heal for a link that did not train or a missing by-id link. No firmware is
          # written. Refuses while any process other than tt-smi holds either card.
          results="$RUNNER_TEMP/c2-results"
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          smi=$(command -v tt-smi || echo /home/thatch/.local/bin/tt-smi)
          . scripts/ci/serving_pair.sh
          serving_pair_resolve 60
          clear=0
          for attempt in 1 2 3 4 5 6; do
            status=0
            "${prefix[@]}" fuser -v "${SERVING_PAIR_NODES[@]}" > "$results/holders.txt" 2>&1 || status=$?
            if [ "$status" = 1 ] && [ ! -s "$results/holders.txt" ]; then clear=1; break; fi
            if [ "$status" = 0 ] && ! grep -v -E '^\s*USER|tt-smi|^/dev/tenstorrent/[0-9]+:\s*$' "$results/holders.txt" | grep -q .; then clear=1; break; fi
            sleep 2
          done
          if [ "$clear" != 1 ]; then echo 'M or A is held; refusing to reset' >&2; cat "$results/holders.txt" >&2; exit 1; fi
          echo "resetting card M and card A: ${SERVING_PAIR_NODES[*]} (PCI ${SERVING_PAIR_PCI[*]})"
          status=0
          timeout -k 20 420 "${prefix[@]}" "$smi" -r "${SERVING_PAIR_NODES[@]}" > "$results/reset.log" 2>&1 || status=$?
          tail -15 "$results/reset.log"
          heal=0
          serving_pair_heal 60 720 2>&1 | tee -a "$results/reset.log" || heal=$?
          echo "reset_exit=$status heal_exit=$heal"
          serving_pair_resolve 120
          test "$status" = 0 && test "$heal" = 0
      - name: Reset all four cards
        if: contains(steps.job.outputs.actions, 'reset') && steps.job.outputs.cards == 'quad'
        working-directory: c2
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          # Ethernet links train only at board init and the four cards are a full mesh, so a subset reset leaves
          # links to the rest untrained: every board present goes in ONE tt-smi call, by the device nodes resolved
          # now (they renumber on every reset), never by tt-smi's own index. Then the heal (scripts/ci/card_set.sh):
          # poll for every board's by-id link, re-probe the driver of a board back without its link (the telemetry
          # race), rescan the own upstream port of a board that did not re-enumerate (a link that did not train).
          # No firmware is written. Refuses while any process other than tt-smi holds a card, and unless exactly
          # four boards are present.
          results="$RUNNER_TEMP/c2-results"
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          smi=$(command -v tt-smi || echo /home/thatch/.local/bin/tt-smi)
          . scripts/ci/card_set.sh
          card_set_resolve 60
          if ! card_set_unheld "$results/holders.txt"; then
            echo 'a card of the set is held; refusing to reset' >&2; cat "$results/holders.txt" >&2; exit 1
          fi
          echo "resetting all four cards: ${CARD_SET_NODES[*]} (PCI ${CARD_SET_PCI[*]})"
          status=0
          timeout -k 20 600 "${prefix[@]}" "$smi" -r "${CARD_SET_NODES[@]}" > "$results/reset.log" 2>&1 || status=$?
          tail -15 "$results/reset.log"
          heal=0
          card_set_heal 90 1000 2>&1 | tee -a "$results/reset.log" || heal=$?
          echo "reset_exit=$status heal_exit=$heal"
          card_set_resolve 180
          test "$status" = 0 && test "$heal" = 0
      - name: Four-card fabric probe (all four cards, inside the image)
        if: contains(steps.job.outputs.actions, 'fabric')
        working-directory: c2
        timeout-minutes: 45
        shell: bash
        env:
          TAG: ${{ steps.job.outputs.tag }}
          FABRIC: ${{ steps.job.outputs.fabric }}
          PROBE: ${{ steps.job.outputs.fabric_probe }}
        run: |
          set -euo pipefail
          # The (1, 4) mesh under the ring descriptor, opened once (one fabric config, one open: a second open in a
          # job is what the ethernet-core teardown wedge punishes), the ring proved against the cluster's trained
          # links, the model's own all-gather and reduce-scatter timed at 1 and 2 links, Ring and Linear. The
          # probe, tp4_mesh.py and the descriptor come from this checkout (mounted read-only), so a probe needs
          # only an image, not a build of this commit. Put reset before it after any failed run.
          image=zot.thatch.local:5000/tt-vllm:qwen38-c2-$TAG
          # C2_FABRIC_PROBE: the fabric probe (the default) or the reduction-order spike; both open the mesh once, from
          # this checkout, under the same descriptor and contract-off environment.
          case "${PROBE:-fabric}" in
            fabric) script=tp4_fabric_probe.py; report=fabric-probe.json ;;
            rs-tile) script=tp4_rs_tile_spike.py; report=rs-tile-spike.json ;;
            *) echo "unknown fabric probe: $PROBE" >&2; exit 1 ;;
          esac
          results="$RUNNER_TEMP/c2-results/fabric"
          mkdir -p "$results"
          docker image inspect "$image" > /dev/null
          if docker ps -a --format '{{.Names}}' | grep -q '^thatch-inference-'; then
            echo "a platform serving container exists; refusing to open the cards under it" >&2; exit 1
          fi
          name=qwen-c2-fabric
          docker rm -f "$name" >/dev/null 2>&1 || true
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          . scripts/ci/card_set.sh
          card_set_nodes 60
          if ! card_set_unheld "$RUNNER_TEMP/c2-results/fabric-holders.txt"; then
            echo 'a card of the set is held; refusing the probe' >&2; cat "$RUNNER_TEMP/c2-results/fabric-holders.txt" >&2; exit 1
          fi
          devices=()
          for node in $(card_set_devices); do devices+=(--device "$node"); done
          status=0
          timeout -k 30 1800 docker run --rm --name "$name" --read-only \
            --tmpfs /tmp:rw,exec,nosuid,size=512m --tmpfs /opt/tt-metal/generated:rw,exec,nosuid,size=1g \
            --tmpfs /root/.cache/ttnn:rw,exec,nosuid,size=1g --tmpfs /root/.cache/tt-metal-cache:rw,exec,nosuid,size=8g \
            --shm-size 4g --memory 80g --cpus 8 "${devices[@]}" \
            -v /dev/hugepages-1G:/dev/hugepages-1G --cap-add SYS_NICE \
            -v "$PWD:/c2:ro" -v "$results:/probe-results" \
            -e MESH_DEVICE=P150x4 -e PYTHONDONTWRITEBYTECODE=1 -e QWEN_C2_SERVING=0 \
            -e TT_METAL_CACHE=/root/.cache/tt-metal-cache -e TT_CACHE_PATH=/tmp/tt-weights \
            -e TT_MESH_GRAPH_DESC_PATH=/c2/scripts/ci/qwen_p150x4_ring_mesh_graph_descriptor.textproto \
            --entrypoint python3 "$image" -B "/c2/scripts/ci/$script" --fabric "$FABRIC" \
            --output "/probe-results/$report" 2>&1 | tee "$RUNNER_TEMP/c2-results/fabric-probe.log" || status=$?
          sudo -n chown -R "$(id -u):$(id -g)" "$results" 2>/dev/null || true
          grep -E 'FABRIC_PROBE|TP4_RS_TILE' "$RUNNER_TEMP/c2-results/fabric-probe.log" | tail -60 || true
          exit "$status"
      - name: Run a qualification harness on card M
        if: contains(steps.job.outputs.actions, 'cardm')
        working-directory: c2
        timeout-minutes: 100
        shell: bash
        env:
          HARNESS: ${{ steps.job.outputs.cardm_harness }}
          HARNESS_ARGS: ${{ steps.job.outputs.cardm_args }}
          HARNESS_ENV: ${{ steps.job.outputs.cardm_env }}
        run: |
          set -euo pipefail
          # Card B is reserved for another project, so a single-card harness (e.g. the K64j CB2a sections of
          # optimisation/ttnn-op/k64j/run_card_b.sh) runs here on card M, in the pair's concurrency group. Card M
          # only: QUAL_CARD is card M's board id and ALLOW_SERVING_CARD=1 lifts the harness's serving-pair
          # refusal, both set here after the job's environment (c2_serving_job.py refuses either, RESULTS,
          # CARD_B_ARGS and any QUAL_* in C2_CARDM_ENV, and accepts only a harness that selects its board by the
          # canonical qual_card.sh block, which refuses card B outright). The harness maps card M's node alone,
          # refuses while a host process holds card M or card A or a container can reach either (--privileged,
          # a device cgroup rule or Tenstorrent device request, /dev or /dev/tenstorrent bound, either node
          # mapped; a container given only card B's node is not in the way and not looked at further), and
          # never resets: after a hang it prints the pair's reset, which is the reset action's, never this step's.
          test -n "$HARNESS"
          results="/tmp/c2-cardm-results/$GITHUB_RUN_ID"
          # Other CI jobs build on this host with privileged buildx builder containers (docker/setup-buildx-action
          # removes them when its job ends). The harness refuses any privileged container, so wait for them first
          # (up to 45 minutes) instead of failing the window (2026-10-03, v336).
          for i in $(seq 1 180); do
            builders=$(docker ps --filter name=buildx_buildkit_ --format '{{.Names}}' | head -3 | tr '\n' ' ' || true)
            [ -z "${builders// /}" ] && break
            if [ $((i % 20)) = 1 ]; then echo "waiting for buildx builders to finish: $builders"; fi
            sleep 15
          done
          if docker ps -a --format '{{.Names}}' | grep -q '^thatch-inference-'; then
            echo "a platform serving container exists; refusing to open card M under it" >&2; exit 1
          fi
          m=$(readlink -f /dev/tenstorrent/by-id/blackhole-CEF5729692C19E6D)
          a=$(readlink -f /dev/tenstorrent/by-id/blackhole-3707293C249A5E67)
          echo "card M $m, card A $a"
          # The gate step's holder check (test_c2_serving_job pins it to the gate's text): nothing but the
          # telemetry exporter's tt-smi may hold M or A.
          clear=0
          for attempt in 1 2 3 4 5 6; do
            status=0
            sudo -n fuser -v "$m" "$a" > "$RUNNER_TEMP/c2-results/cardm-holders.txt" 2>&1 || status=$?
            if [ "$status" = 1 ] && [ ! -s "$RUNNER_TEMP/c2-results/cardm-holders.txt" ]; then clear=1; break; fi
            if [ "$status" = 0 ] && ! grep -v -E '^\s*USER|tt-smi|^/dev/tenstorrent/[0-9]+:\s*$' "$RUNNER_TEMP/c2-results/cardm-holders.txt" | grep -q .; then clear=1; break; fi
            sleep 2
          done
          if [ "$clear" != 1 ]; then echo 'M or A is held; refusing the card-M run' >&2; cat "$RUNNER_TEMP/c2-results/cardm-holders.txt" >&2; exit 1; fi
          # What runs before the harness, so the next step removes only a container this one started.
          docker ps -q | sort > "$RUNNER_TEMP/cardm-containers-before.txt"
          mkdir -p "$results"
          chmod 0777 "$results"
          read -r -a extra <<< "$HARNESS_ENV"
          echo "card M run: $HARNESS | args: $HARNESS_ARGS | env: ${HARNESS_ENV:-none} | results: $results"
          env ${extra[@]+"${extra[@]}"} QUAL_CARD=blackhole-CEF5729692C19E6D ALLOW_SERVING_CARD=1 RESULTS="$results" \
            CARD_B_ARGS="$HARNESS_ARGS" bash "$HARNESS" 2>&1 | tee "$results/harness-console.log"
      - name: Collect the card-M results
        if: always() && contains(steps.job.outputs.actions, 'cardm')
        shell: bash
        run: |
          set +e -uo pipefail   # best effort throughout: the runner's bash -e must not stop the collection
          # A container the card-M step started that still maps card M's node (the harness's EXIT trap removes its
          # own; a step killed at its timeout may not get there) is removed. Nothing else: a platform serving
          # container, a container that was there before, and one on card A or card B are never touched.
          m=$(readlink -f /dev/tenstorrent/by-id/blackhole-CEF5729692C19E6D)
          if [ -f "$RUNNER_TEMP/cardm-containers-before.txt" ]; then
            for id in $(docker ps -q | sort | comm -13 "$RUNNER_TEMP/cardm-containers-before.txt" -); do
              name=$(docker inspect -f '{{.Name}}' "$id" 2>/dev/null)
              case $name in /thatch-inference-*) continue ;; esac
              for path in $(docker inspect -f '{{range .HostConfig.Devices}}{{println .PathOnHost}}{{end}}' "$id" 2>/dev/null); do
                if [ -n "$m" ] && [ "$(readlink -f "$path")" = "$m" ]; then
                  echo "removing $id $name: it maps card M ($m)"
                  docker rm -f "$id" > /dev/null 2>&1 || true
                  break
                fi
              done
            done
          fi
          # The harness's files (root-owned: its container wrote them) into the uploaded results, all but the
          # kernel caches (kcache-*); then the run's directory goes.
          results="/tmp/c2-cardm-results/$GITHUB_RUN_ID"
          out="$RUNNER_TEMP/c2-results/cardm"
          if [ -d "$results" ]; then
            mkdir -p "$out"
            for f in "$results"/*; do
              [ -e "$f" ] || continue
              case ${f##*/} in kcache-*) continue ;; esac
              sudo -n cp -a "$f" "$out/" 2>/dev/null || cp -a "$f" "$out/" || true
            done
            sudo -n chown -R "$(id -u):$(id -g)" "$out" 2>/dev/null || true
            sudo -n rm -rf "$results" 2>/dev/null || rm -rf "$results" || true
          fi
          ls -la "$out" 2>/dev/null | head -40
          # The verdict line of either K64j harness: k64j_card_b.py's K64J_CARD, extent_reader_card_b.py's K64J_READER.
          grep -h -E '^K64J_(CARD|READER) ' "$out"/*.log 2>/dev/null | tail -2 || true
      - name: G1 base drift
        if: contains(steps.job.outputs.actions, 'drift')
        working-directory: c2
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # Read-only: what the first build's G1 would fail on, measured on the P8 base (no build, no tag,
          # no cards). Exit 1 means problems were found; it is reported, not raised.
          ctx="$RUNNER_TEMP/c2drift"
          rm -rf "$ctx"
          python3 -B scripts/ci/c2_overlay.py stage --repo . --out "$ctx"
          status=0
          python3 -B "$ctx/c2_image_provenance.py" --base-drift --context "$ctx" --graft /home/thatch/opgraft-K64j \
            --report "$RUNNER_TEMP/c2-results/base-drift.json" > "$RUNNER_TEMP/c2-results/base-drift.log" 2>&1 || status=$?
          tail -60 "$RUNNER_TEMP/c2-results/base-drift.log"
          rm -rf "$ctx"
          echo "base drift exit $status (1: the first build's G1 would fail on the WOULD FAIL lines)"
      - name: Build
        if: contains(steps.job.outputs.actions, 'build')
        working-directory: c2
        timeout-minutes: 75
        shell: bash
        env:
          TAG: ${{ steps.job.outputs.tag }}
          C2_BAKE_DEFAULT_PROFILE: ${{ steps.job.outputs.bake_default_profile }}
        run: |
          set -euo pipefail
          image=zot.thatch.local:5000/tt-vllm:qwen38-c2-$TAG
          for i in $(seq 1 60); do
            pgrep -f build-c2-serving-image >/dev/null || break
            echo "a build is in flight ($i): waiting"; tail -2 /home/thatch/c2-build.log || true; sleep 60
          done
          if docker image inspect "$image" >/dev/null 2>&1; then
            echo "$image present: $(docker image inspect "$image" --format '{{.Id}}')"
            exit 0
          fi
          # The overlay is docker/qwen-c2-overlay.txt, the one list; the build tags the image only
          # after G1 provenance (c2_image_provenance.py) passes. A tag present above skipped it:
          # images built before the manifest (v6-teardown and older) were never checked.
          # G1 closure, from git: no file the image carries may ship older than this commit unless
          # C2_KNOWN_STALE says why. The CPU suite runs these on pull requests only; images come from
          # tags. They run in the P8 base (python 3.10, the image's; git), not on the host's python.
          base=$(sed -n 's/^ARG BASE=//p' docker/qwen-c2-serving.Dockerfile)
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp -e VLLM_PLUGINS= \
            -v "$PWD:/src:ro" -w /src/scripts/ci --entrypoint python3 "$base" \
            -B -m unittest test_serving_image_copy_closure test_c2_image_overlay
          ctx="$RUNNER_TEMP/c2ctx"
          rm -rf "$ctx"
          python3 -B scripts/ci/c2_overlay.py stage --repo . --out "$ctx"
          tar -czf "$RUNNER_TEMP/c2ctx.tgz" -C "$ctx" .
          export C2_CHECKOUT="$PWD" C2_PROVENANCE_REPORT="$RUNNER_TEMP/c2-results/provenance.json"
          bash scripts/ci/build-c2-serving-image.sh "$RUNNER_TEMP/c2ctx.tgz" "$TAG" 2>&1 | tee "$RUNNER_TEMP/c2-results/build.log"
      - name: Prefix-reuse P0a probe in the image (CPU only, no device)
        if: contains(steps.job.outputs.actions, 'probe')
        working-directory: c2
        timeout-minutes: 50
        shell: bash
        env:
          TAG: ${{ steps.job.outputs.tag }}
        run: |
          set -euo pipefail
          # Design section 2.1, P0a: the general-prefix engine config through the image's own vLLM
          # 0.25.1 and TT plugin, then G1's prefix scheduler graft (scripts/ci/qwen_prefix_scheduler_patch.py
          # over qwen_prefix_registry.py) driven on the real TTScheduler. The checkout is mounted read-only at /c2; no --device, so
          # it opens no card. Prints PASS/FAIL per check and exits 1 on any FAIL.
          # Then the prefix gates' oracle (prefix_judge.Oracle) against the same real graft, request by
          # request (scripts/ci/prefix_oracle_check.py): the hardware gates fail on any Q it did not
          # predict, so it must be the graft's rules. It drives the image's own overlaid graft when the
          # image has one (and fails if that differs from the checkout's), and fails on a GOLDEN change.
          # Then sticky sessions (the c2-packed-prefix profiles) on the same image: the staged scheduler graft on the
          # fast path's scheduler shape (DFlash, 15 proposals, lookahead 16) with QWEN_FAST_STICKY_SESSIONS=1 resumes
          # at C0 as prefix_judge.Oracle(sticky=True) predicts, this vLLM drops a DFlash hit's last block with the
          # prefix cache on (its own Scheduler and the TT plugin's TTScheduler), and the fast path's policy admits
          # its CacheConfig - the three things the sticky oracle rests on, checked before any card. Those tests
          # skip where vLLM does not import, so required_tests.py fails on any skip.
          # All three always run; the step fails if any does.
          image=zot.thatch.local:5000/tt-vllm:qwen38-c2-$TAG
          docker image inspect "$image" --format "probe image $image {{.Id}}"
          name="qwen-prefix-p0a-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker rm -f "$name" "$name-oracle" "$name-sticky" >/dev/null 2>&1 || true' EXIT
          status=0
          timeout -k 20 1320 docker run --rm --name "$name" --network none --cpus 8 --memory 16g \
            -v /home/thatch/hf-cache/hub:/models:ro -v "$PWD:/c2:ro" \
            --entrypoint python3 "$image" /c2/scripts/ci/prefix_p0a_probe.py 2>&1 \
            | tee "$RUNNER_TEMP/c2-results/prefix-p0a.log" || status=$?
          timeout -k 20 900 docker run --rm --name "$name-oracle" --network none --cpus 8 --memory 16g \
            -v /home/thatch/hf-cache/hub:/models:ro -v "$PWD:/c2:ro" \
            --entrypoint python3 "$image" /c2/scripts/ci/prefix_oracle_check.py 2>&1 \
            | tee "$RUNNER_TEMP/c2-results/prefix-oracle.log" || status=$?
          timeout -k 20 600 docker run --rm --name "$name-sticky" --network none --cpus 8 --memory 16g \
            -e VLLM_PLUGINS= -e VLLM_TARGET_DEVICE=empty -e VLLM_USE_V2_MODEL_RUNNER=0 -e HF_HUB_OFFLINE=1 \
            -e PYTHONDONTWRITEBYTECODE=1 -e OMP_NUM_THREADS=2 -e MKL_NUM_THREADS=2 \
            -v "$PWD:/c2:ro" -w /c2/scripts/ci --entrypoint python3 "$image" -B required_tests.py --min 6 \
            test_qwen_prefix_scheduler_vllm.StickyDflashOnRealVllmTests \
            test_serving_scheduler.RealSchedulerTests.test_a_dflash_hit_drops_its_last_block_with_the_prefix_cache_on \
            test_serving_scheduler.TTPluginSchedulerTests.test_a_dflash_hit_drops_its_last_block_with_the_prefix_cache_on \
            2>&1 | tee "$RUNNER_TEMP/c2-results/prefix-sticky-vllm.log" || status=$?
          exit "$status"
      - name: Smoke on cards M+A
        if: contains(steps.job.outputs.actions, 'smoke') && steps.job.outputs.cards != 'quad'
        working-directory: c2
        timeout-minutes: 70
        shell: bash
        env:
          TAG: ${{ steps.job.outputs.tag }}
          PROFILE: ${{ steps.job.outputs.profile }}
          TESTS: ${{ steps.job.outputs.tests }}
          BENCH_SHAPES: ${{ steps.job.outputs.bench_shapes }}
        run: |
          set -euo pipefail
          image=zot.thatch.local:5000/tt-vllm:qwen38-c2-$TAG
          results="$RUNNER_TEMP/c2-results"
          name=qwen-c2-smoke
          m=$(readlink -f /dev/tenstorrent/by-id/blackhole-CEF5729692C19E6D)
          a=$(readlink -f /dev/tenstorrent/by-id/blackhole-3707293C249A5E67)
          echo "card M $m, card A $a"
          if docker ps -a --format '{{.Names}}' | grep -q '^thatch-inference-'; then
            echo "a platform serving container exists; refusing to open M+A under it" >&2; exit 1
          fi
          docker rm -f "$name" >/dev/null 2>&1 || true
          holders=$(sudo -n fuser "$m" "$a" 2>/dev/null | tr -s ' ' || true)
          if [ -n "${holders// /}" ]; then
            echo "M or A is held by: $holders" >&2; sudo -n fuser -v "$m" "$a" >&2 || true; exit 1
          fi
          trap 'docker logs "$name" > "$results/container.log" 2>&1 || true; docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          # The node agent's container shape (Thatch.Server.Compute container/adapter.rs), with a p300
          # descriptor and QWEN36_BATCHED_DECODE_MODE the contract must undo, and a platform-style argv.
          docker run -d --name "$name" --read-only \
            --tmpfs /tmp:rw,size=512m --tmpfs /opt/tt-metal/generated:rw,size=1g \
            --tmpfs /root/.cache/ttnn:rw,size=1g --tmpfs /root/.cache/tt-metal-cache:rw,size=8g \
            --shm-size 4g --memory 80g --cpus 8 --device "$m" --device "$a" \
            -v /dev/hugepages-1G:/dev/hugepages-1G --cap-add SYS_NICE \
            -v /home/thatch/hf-cache/hub:/models -e HF_HOME=/models -e HF_HUB_CACHE=/models \
            -e MESH_DEVICE=P300 -e QWEN36_BATCHED_DECODE_MODE=host -e VLLM_RPC_TIMEOUT=100000 \
            -e TT_MESH_GRAPH_DESC_PATH=/opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p300_mesh_graph_descriptor.textproto \
            -e QWEN_C2_PROFILE="$PROFILE" -p 127.0.0.1:8010:8000 \
            --entrypoint python3 "$image" -m vllm.entrypoints.openai.api_server \
            --model Qwen/Qwen3.8-27B --served-model-name Qwen/Qwen3.8-27B --host 0.0.0.0 --port 8000 \
            --reasoning-parser qwen3 --tool-call-parser qwen3_xml --enable-auto-tool-choice \
            --max-model-len 65536 --max-num-seqs 2 --block-size 64 --no-enable-prefix-caching \
            --additional-config '{"tt": {"l1_small_size": 24576, "fabric_config": "FABRIC_1D", "trace_region_size": 1073741824}}'
          started=$(date +%s); ready=0
          for i in $(seq 1 240); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$name" 2>/dev/null)" != true ]; then
              echo "container exited: $(docker inspect -f '{{.State.ExitCode}} {{.State.OOMKilled}}' "$name")" >&2
              docker logs --tail 80 "$name" >&2 || true; exit 1
            fi
            if curl -fsS -m 5 http://127.0.0.1:8010/v1/models > "$results/models.json" 2>/dev/null; then ready=1; break; fi
            sleep 15
          done
          echo "ready=$ready after $(( $(date +%s) - started )) s"; cat "$results/models.json" || true
          docker logs "$name" 2>&1 | grep -F '[QWEN-C2]' || true
          [ "$ready" = 1 ] || { docker logs --tail 120 "$name" >&2; exit 1; }
          AGREEMENT_OUT="$results/agreement-$PROFILE.json" BENCH_OUT="$results/bench-$PROFILE.json" \
            AGREEMENT_LABEL="$PROFILE" AGREEMENT_ROOT="$PWD" \
            python3 scripts/ci/c2_serving_smoke.py http://127.0.0.1:8010 Qwen/Qwen3.8-27B "$TESTS" \
            "$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["stdlib"])')/typing.py" \
            scripts/ci/build-c2-serving-image.sh 2>&1 | tee "$results/smoke.log"
          docker stats --no-stream "$name" | tee "$results/stats.txt" || true
          grep -F '[PINDIAG] dram after' <(docker logs "$name" 2>&1) | tail -8 || true
      - name: Run the gate in the agent's container shape
        if: contains(steps.job.outputs.actions, 'gate')
        working-directory: c2
        timeout-minutes: 380
        shell: bash
        env:
          TAG: ${{ steps.job.outputs.tag }}
          PROFILE: ${{ steps.job.outputs.profile }}
          GATE_PLAN: ${{ steps.job.outputs.gate_plan }}
          GATE_LENGTHS: ${{ steps.job.outputs.gate_lengths }}
          GATE_MAX_TOKENS: ${{ steps.job.outputs.gate_max_tokens }}
          GATE_MEMORY_PROMPT: ${{ steps.job.outputs.gate_memory_prompt }}
          GATE_PAIRS: ${{ steps.job.outputs.gate_pairs }}
          GATE_FAMILIES: ${{ steps.job.outputs.gate_families }}
          GATE_JIT: ${{ steps.job.outputs.gate_jit }}
          GATE_POLICY: ${{ steps.job.outputs.gate_policy }}
          GATE_POLICY_DECISION: ${{ steps.job.outputs.gate_policy_decision }}
          GATE_AUDITS: ${{ steps.job.outputs.gate_audits }}
          GATE_SALT: ${{ steps.job.outputs.gate_salt }}
          CARDS: ${{ steps.job.outputs.cards }}
        run: |
          set -euo pipefail
          # The fast path has never completed a request inside the serving image: every C2 rate was
          # measured in the gate's own container. This runs the gate's harness inside the image, in the
          # agent's container shape, with vLLM launched from the platform's argv so the contract's argv
          # is what serves (c2-serve-for-real-plan 2.1 item 2, 2.2 items 5 and 7). One container per arm.
          image=zot.thatch.local:5000/tt-vllm:qwen38-c2-$TAG
          results="$RUNNER_TEMP/c2-results/gate"
          docker image inspect "$image" > /dev/null
          if docker ps -a --format '{{.Names}}' | grep -q '^thatch-inference-'; then
            echo "a platform serving container exists; refusing to open M+A under it" >&2; exit 1
          fi
          # Every gate container goes with this step, however it ends (the driver removes its own too, and
          # turns SIGTERM into an exit): one left running would hold M+A after the concurrency group let go.
          # A leftover of a killed job is removed first - it holds the cards and makes docker run exit 125.
          remove_gate_containers() {
            docker ps -a --format '{{.Names}}' | grep '^qwen-c2-gate-' | xargs -r docker rm -f || true
          }
          stale=$(docker ps -a --format '{{.Names}}' | grep '^qwen-c2-gate-' || true)
          if [ -n "$stale" ]; then
            echo "removing gate containers a previous job left: $stale (reset M+A if the next arm wedges)"
            remove_gate_containers
          fi
          trap remove_gate_containers EXIT
          m=$(readlink -f /dev/tenstorrent/by-id/blackhole-CEF5729692C19E6D)
          a=$(readlink -f /dev/tenstorrent/by-id/blackhole-3707293C249A5E67)
          echo "card M $m, card A $a"
          # The telemetry exporter's tt-smi opens every card for a moment every 30 s: ignored, retried.
          clear=0
          for attempt in 1 2 3 4 5 6; do
            status=0
            sudo -n fuser -v "$m" "$a" > "$RUNNER_TEMP/c2-results/gate-holders.txt" 2>&1 || status=$?
            if [ "$status" = 1 ] && [ ! -s "$RUNNER_TEMP/c2-results/gate-holders.txt" ]; then clear=1; break; fi
            if [ "$status" = 0 ] && ! grep -v -E '^\s*USER|tt-smi|^/dev/tenstorrent/[0-9]+:\s*$' "$RUNNER_TEMP/c2-results/gate-holders.txt" | grep -q .; then clear=1; break; fi
            sleep 2
          done
          if [ "$clear" != 1 ]; then echo 'M or A is held; refusing the gate' >&2; cat "$RUNNER_TEMP/c2-results/gate-holders.txt" >&2; exit 1; fi
          # C2_CARDS=quad: the gate opens every Blackhole board present (its arms map exactly four), so all four are
          # checked (scripts/ci/card_set.sh: the same tt-smi-aside rule), and the resolved set is logged.
          if [ "$CARDS" = quad ]; then
            . scripts/ci/card_set.sh
            card_set_nodes 60
            if ! card_set_unheld "$RUNNER_TEMP/c2-results/gate-holders.txt"; then
              echo 'a card of the set is held; refusing the gate' >&2; cat "$RUNNER_TEMP/c2-results/gate-holders.txt" >&2; exit 1
            fi
          fi
          # What this step (380 min) and the job (600 min, from C2_JOB_STARTED) leave, less margins for
          # this step's tail: the driver refuses a plan list whose worst case (every arm to its limit,
          # every re-run) does not fit, before any container starts.
          step_left=$(( 380 * 60 - 600 ))
          job_left=$(( 600 * 60 - ($(date +%s) - ${C2_JOB_STARTED:?}) - 900 ))
          budget=$(( step_left < job_left ? step_left : job_left ))
          echo "gate budget: $budget s (step $step_left s, job $job_left s)"
          status=0
          python3 scripts/ci/c2_serving_gate.py --image "$image" --profile "$PROFILE" --plan "$GATE_PLAN" \
            ${GATE_LENGTHS:+--lengths "$GATE_LENGTHS"} --max-tokens "$GATE_MAX_TOKENS" --budget-seconds "$budget" \
            ${GATE_MEMORY_PROMPT:+--memory-prompt "$GATE_MEMORY_PROMPT"} --results "$results" \
            ${GATE_PAIRS:+--pairs "$GATE_PAIRS"} ${GATE_FAMILIES:+--families "$GATE_FAMILIES"} \
            ${GATE_JIT:+--jit "$GATE_JIT"} ${GATE_POLICY:+--policy "$GATE_POLICY"} \
            ${GATE_POLICY_DECISION:+--policy-decision "$GATE_POLICY_DECISION"} ${GATE_AUDITS:+--audits "$GATE_AUDITS"} \
            ${GATE_SALT:+--salt "$GATE_SALT"} --cards "$CARDS" 2>&1 \
            | tee "$RUNNER_TEMP/c2-results/gate.log" || status=$?
          # Read the launched argv (memory read-the-launched-argv): the contract's own line, per arm.
          for log in "$results"/*/server.log; do
            [ -f "$log" ] || continue
            echo "=== $log"; grep -F '[QWEN-C2]' "$log" | head -4 || true
            grep -F '[PINDIAG] dram after' "$log" | tail -8 || true
          done
          exit "$status"
      - name: Hand back the TP4 op-profile output
        # The ops-trace arm's tracy writes its profile tree as the container's root. The gate hands the tree back when the
        # arm ends; this runs again however the gate step ended (cancelled or timed out included), before the upload, keeps
        # the CPP report (compressed) if the gate did not get to it and prunes what is left above 8 MB: a root-owned tree
        # once broke the next checkout (EACCES). Still: never cancel a job with ops-* plans while an arm runs.
        if: always() && contains(steps.job.outputs.actions, 'gate') && contains(steps.job.outputs.gate_plan, 'ops-')
        working-directory: c2
        # One hand-back of at most 300 s per profiled arm, the compression and the pruning, with margin.
        timeout-minutes: 30
        shell: bash
        env:
          TAG: ${{ steps.job.outputs.tag }}
        run: |
          set -euo pipefail
          # A gate container a killed step left running would keep writing as root under the tree being handed back.
          docker ps -a --format '{{.Names}}' | grep '^qwen-c2-gate-ops-' | xargs -r docker rm -f || true
          # The gate's own image does the hand-back (it has a shell).
          image=zot.thatch.local:5000/tt-vllm:qwen38-c2-$TAG
          docker image inspect "$image" > /dev/null 2>&1 || image=""
          test -n "$image" || { echo "no local image tagged qwen38-c2-$TAG: nothing ran, nothing to hand back"; exit 0; }
          python3 scripts/ci/ops_profile_plan.py handback --results "$RUNNER_TEMP/c2-results/gate" --image "$image"
      - name: Prefix-reuse gates in the agent's container shape
        if: contains(steps.job.outputs.actions, 'prefix')
        working-directory: c2
        timeout-minutes: 380
        shell: bash
        env:
          TAG: ${{ steps.job.outputs.tag }}
          PREFIX_PROFILE: ${{ steps.job.outputs.prefix_profile }}
          PREFIX_PLAN: ${{ steps.job.outputs.prefix_plan }}
          PREFIX_BASELINE: ${{ steps.job.outputs.prefix_baseline }}
          PREFIX_AGENTS: ${{ steps.job.outputs.prefix_agents }}
          CARDS: ${{ steps.job.outputs.cards }}
        run: |
          set -euo pipefail
          # TT prefix-reuse design 2.2 (G1): a serving container per arm in the agent's shape, launched
          # from the platform's argv, driven over its OpenAI API from this host with real-text agent
          # conversations; the engine's own markers judge every hit against a cold twin.
          image=zot.thatch.local:5000/tt-vllm:qwen38-c2-$TAG
          results="$RUNNER_TEMP/c2-results/prefix"
          docker image inspect "$image" > /dev/null
          if docker ps -a --format '{{.Names}}' | grep -q '^thatch-inference-'; then
            echo "a platform serving container exists; refusing to open M+A under it" >&2; exit 1
          fi
          # The kill-switch drill writes this file through the container; the gate removes it, and so
          # does this trap - only when its content says the gate wrote it (an operator's flag stays).
          flag=/home/thatch/hf-cache/hub/.qwen-c2/prefix-reuse.off
          cleanup_prefix() {
            docker ps -a --format '{{.Names}}' | grep '^qwen-c2-prefix-' | xargs -r docker rm -f || true
            if [ "$(sudo -n cat "$flag" 2>/dev/null)" = qwen-c2-prefix-gate ]; then sudo -n rm -f "$flag" || true; fi
          }
          stale=$(docker ps -a --format '{{.Names}}' | grep '^qwen-c2-prefix-' || true)
          if [ -n "$stale" ]; then
            echo "removing prefix containers a previous job left: $stale (reset M+A if the next arm wedges)"
            cleanup_prefix
          fi
          trap cleanup_prefix EXIT
          m=$(readlink -f /dev/tenstorrent/by-id/blackhole-CEF5729692C19E6D)
          a=$(readlink -f /dev/tenstorrent/by-id/blackhole-3707293C249A5E67)
          echo "card M $m, card A $a"
          clear=0
          for attempt in 1 2 3 4 5 6; do
            status=0
            sudo -n fuser -v "$m" "$a" > "$RUNNER_TEMP/c2-results/prefix-holders.txt" 2>&1 || status=$?
            if [ "$status" = 1 ] && [ ! -s "$RUNNER_TEMP/c2-results/prefix-holders.txt" ]; then clear=1; break; fi
            if [ "$status" = 0 ] && ! grep -v -E '^\s*USER|tt-smi|^/dev/tenstorrent/[0-9]+:\s*$' "$RUNNER_TEMP/c2-results/prefix-holders.txt" | grep -q .; then clear=1; break; fi
            sleep 2
          done
          if [ "$clear" != 1 ]; then echo 'M or A is held; refusing the prefix gate' >&2; cat "$RUNNER_TEMP/c2-results/prefix-holders.txt" >&2; exit 1; fi
          if [ "$CARDS" = quad ]; then
            . scripts/ci/card_set.sh
            card_set_nodes 60
            if ! card_set_unheld "$RUNNER_TEMP/c2-results/prefix-holders.txt"; then
              echo 'a card of the set is held; refusing the prefix gate' >&2; cat "$RUNNER_TEMP/c2-results/prefix-holders.txt" >&2; exit 1
            fi
          fi
          # What this step (380 min) and the job (600 min, from C2_JOB_STARTED) leave, less margins.
          step_left=$(( 380 * 60 - 600 ))
          job_left=$(( 600 * 60 - ($(date +%s) - ${C2_JOB_STARTED:?}) - 900 ))
          budget=$(( step_left < job_left ? step_left : job_left ))
          echo "prefix gate budget: $budget s (step $step_left s, job $job_left s)"
          echo "busy ARC runner pods: $(sudo -n k3s kubectl -n arc-runners get pods --no-headers 2>/dev/null | grep -c Running || true)"
          status=0
          python3 scripts/ci/c2_prefix_gate.py --image "$image" --profile "$PREFIX_PROFILE" --plan "$PREFIX_PLAN" \
            --baseline "$PREFIX_BASELINE" --agents "$PREFIX_AGENTS" --budget-seconds "$budget" \
            --results "$results" --cards "$CARDS" 2>&1 | tee "$RUNNER_TEMP/c2-results/prefix.log" || status=$?
          # Read the launched argv (memory read-the-launched-argv) and the graft's install line, per arm.
          for log in "$results"/*/server.log; do
            [ -f "$log" ] || continue
            echo "=== $log"; grep -F '[QWEN-C2]' "$log" | head -4 || true
            grep -F '[PINDIAG] prefix: install' "$log" | head -2 || true
            grep -F 'Automatic prefix caching is' "$log" | head -2 || true
          done
          exit "$status"
      - name: Smoke on the four-card set
        if: contains(steps.job.outputs.actions, 'smoke') && steps.job.outputs.cards == 'quad'
        working-directory: c2
        timeout-minutes: 210
        shell: bash
        env:
          TAG: ${{ steps.job.outputs.tag }}
          PROFILE: ${{ steps.job.outputs.profile }}
          TESTS: ${{ steps.job.outputs.tests }}
          BENCH_SHAPES: ${{ steps.job.outputs.bench_shapes }}
        run: |
          set -euo pipefail
          # The pair smoke's shape on every Blackhole board present (a general-tp4 profile: the contract sets
          # MESH_DEVICE, the ring descriptor, the fabric and the engine limits from the profile, over the p300 values
          # the agent's container carries). C2_SMOKE_TESTS may name agreement (opt-in): greedy answers to real
          # repository text with per-token log-probabilities, saved as agreement-<profile>.json for
          # scripts/ci/tp_agreement.py compare against the pair's file; bench (opt-in too) runs
          # scripts/ci/tp_decode_bench.py's shapes (C2_BENCH_SHAPES) into bench-<profile>.json. The container is
          # always removed.
          image=zot.thatch.local:5000/tt-vllm:qwen38-c2-$TAG
          results="$RUNNER_TEMP/c2-results"
          name=qwen-c2-smoke
          if docker ps -a --format '{{.Names}}' | grep -q '^thatch-inference-'; then
            echo "a platform serving container exists; refusing to open the cards under it" >&2; exit 1
          fi
          docker rm -f "$name" >/dev/null 2>&1 || true
          . scripts/ci/card_set.sh
          card_set_nodes 60
          if ! card_set_unheld "$results/smoke-holders.txt"; then
            echo 'a card of the set is held; refusing the smoke' >&2; cat "$results/smoke-holders.txt" >&2; exit 1
          fi
          devices=()
          for node in $(card_set_devices); do devices+=(--device "$node"); done
          trap 'docker logs "$name" > "$results/container.log" 2>&1 || true; docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --read-only \
            --tmpfs /tmp:rw,size=512m --tmpfs /opt/tt-metal/generated:rw,size=1g \
            --tmpfs /root/.cache/ttnn:rw,size=1g --tmpfs /root/.cache/tt-metal-cache:rw,size=8g \
            --shm-size 4g --memory 80g --cpus 8 "${devices[@]}" \
            -v /dev/hugepages-1G:/dev/hugepages-1G --cap-add SYS_NICE \
            -v /home/thatch/hf-cache/hub:/models -e HF_HOME=/models -e HF_HUB_CACHE=/models \
            -e MESH_DEVICE=P300 -e QWEN36_BATCHED_DECODE_MODE=host -e VLLM_RPC_TIMEOUT=100000 \
            -e TT_MESH_GRAPH_DESC_PATH=/opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p300_mesh_graph_descriptor.textproto \
            -e QWEN_C2_GATE=1 -e QWEN_C2_PROFILE="$PROFILE" -p 127.0.0.1:8010:8000 \
            --entrypoint python3 "$image" -m vllm.entrypoints.openai.api_server \
            --model Qwen/Qwen3.8-27B --served-model-name Qwen/Qwen3.8-27B --host 0.0.0.0 --port 8000 \
            --reasoning-parser qwen3 --tool-call-parser qwen3_xml --enable-auto-tool-choice \
            --max-model-len 65536 --max-num-seqs 2 --block-size 64 --no-enable-prefix-caching \
            --additional-config '{"tt": {"l1_small_size": 24576, "fabric_config": "FABRIC_1D", "trace_region_size": 1073741824}}'
          started=$(date +%s); ready=0
          for i in $(seq 1 320); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$name" 2>/dev/null)" != true ]; then
              echo "container exited: $(docker inspect -f '{{.State.ExitCode}} {{.State.OOMKilled}}' "$name")" >&2
              docker logs --tail 80 "$name" >&2 || true; exit 1
            fi
            if curl -fsS -m 5 http://127.0.0.1:8010/v1/models > "$results/models.json" 2>/dev/null; then ready=1; break; fi
            sleep 15
          done
          echo "ready=$ready after $(( $(date +%s) - started )) s"; cat "$results/models.json" || true
          docker logs "$name" 2>&1 | grep -F -e '[QWEN-C2]' -e '[QWEN-TP4]' || true
          [ "$ready" = 1 ] || { docker logs --tail 120 "$name" >&2; exit 1; }
          AGREEMENT_OUT="$results/agreement-$PROFILE.json" BENCH_OUT="$results/bench-$PROFILE.json" \
            AGREEMENT_LABEL="$PROFILE" AGREEMENT_ROOT="$PWD" \
            python3 scripts/ci/c2_serving_smoke.py http://127.0.0.1:8010 Qwen/Qwen3.8-27B "$TESTS" \
            "$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["stdlib"])')/typing.py" \
            scripts/ci/build-c2-serving-image.sh 2>&1 | tee "$results/smoke.log"
          # The smoke exits 0 whatever its tests recorded: enforce the stop conditions (an errored or empty stream, garbage
          # text, an audit mismatch, and on a slide-on profile a ramp commit above 50 ms) before the next job of a chain.
          docker logs "$name" > "$results/container.log" 2>&1 || true
          python3 scripts/ci/c2_smoke_check.py --smoke-log "$results/smoke.log" --container-log "$results/container.log" \
            --profile "$PROFILE"
          docker stats --no-stream "$name" | tee "$results/stats.txt" || true
          grep -F '[PINDIAG] dram after' <(docker logs "$name" 2>&1) | tail -8 || true
      - name: Replay the node agent's serving sequence
        if: contains(steps.job.outputs.actions, 'replay')
        working-directory: c2
        timeout-minutes: 180
        shell: bash
        env:
          IMAGE: ${{ steps.job.outputs.platform_image }}
          REPLAY_BUDGET_SMOKE: ${{ steps.job.outputs.replay_budget_smoke }}
          REPLAY_PROFILE: ${{ steps.job.outputs.replay_profile }}
          REPLAY_SERVED_MODEL: ${{ steps.job.outputs.replay_served_model }}
          CARDS: ${{ steps.job.outputs.cards }}
        run: |
          set -euo pipefail
          test -n "$IMAGE"
          if docker ps --format '{{.Names}}' | grep -q '^thatch-inference-'; then
            echo "a platform serving container is running; refusing to open the cards under it" >&2; exit 1
          fi
          # The agent's container is gone once the pair is taken for development (unserve): then the
          # tracked record of it (replay v11's copy) is the source. A four-card replay takes the four-card record
          # when one is tracked (the mesh variables of the pair's are overridden by the profile's contract either way).
          source=thatch-inference-Qwen-Qwen3.8-27B
          record=scripts/ci/references/c2-serving/agent-container-36104200953.json
          if [ "$CARDS" = quad ] && [ -f scripts/ci/references/c2-serving/agent-container-quad.json ]; then
            record=scripts/ci/references/c2-serving/agent-container-quad.json
          fi
          docker inspect "$source" > /dev/null 2>&1 || source=$record
          if [ "$CARDS" = quad ]; then
            # Every Blackhole board present, read now (card_set.sh names none): exactly four, none held. The replay
            # resolves the same set for its --device list and refuses any other count.
            mkdir -p "$RUNNER_TEMP/c2-results"
            . scripts/ci/card_set.sh
            card_set_nodes 60
            if ! card_set_unheld "$RUNNER_TEMP/c2-results/replay-holders.txt"; then
              echo 'a card of the set is held; refusing the replay' >&2; cat "$RUNNER_TEMP/c2-results/replay-holders.txt" >&2; exit 1
            fi
          fi
          python3 scripts/ci/c2_platform_replay.py --source "$source" --image "$IMAGE" --cards "$CARDS" \
            ${REPLAY_PROFILE:+--profile "$REPLAY_PROFILE"} ${REPLAY_SERVED_MODEL:+--served-model "$REPLAY_SERVED_MODEL"} \
            ${REPLAY_BUDGET_SMOKE:+--budget-smoke} \
            --results "$RUNNER_TEMP/c2-results/replay"
      - name: Push
        if: contains(steps.job.outputs.actions, 'push')
        shell: bash
        env:
          TAG: ${{ steps.job.outputs.tag }}
        run: |
          set -euo pipefail
          image=zot.thatch.local:5000/tt-vllm:qwen38-c2-$TAG
          docker push "$image" | tail -3
          echo "pushed $(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
      - name: Start the node agent
        if: ${{ !cancelled() && contains(steps.job.outputs.actions, 'agentstart') }}
        shell: bash
        run: |
          # Actions runs bash with -e: `systemctl is-active` exits 3 for an inactive unit, which killed run 36988136422 after the
          # stop had worked. Every failure here is handled explicitly instead.
          set +e
          set -uo pipefail
          # The runner runs as the agent's user with HOME set to the runner's own directory: the unit is under the user's passwd
          # home, and systemctl --user needs the user's bus (run 36987818797 looked under the runner's HOME and refused).
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          export DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS:-unix:path=$XDG_RUNTIME_DIR/bus}"
          agent_home=$(getent passwd "$(id -un)" | cut -d: -f6)
          unit="${agent_home:-/nonexistent}/.config/systemd/user/thatch-node-agent.service"
          loaded=$(systemctl --user show -p LoadState --value thatch-node-agent.service 2>&1)
          echo "runner user $(id -un), passwd home ${agent_home:-?}, unit file $([ -f "$unit" ] && echo present || echo absent), LoadState ${loaded}"
          if [ ! -f "$unit" ] || [ "$loaded" != loaded ]; then
            echo "::error::the node agent's user unit is not visible here (unit $unit, LoadState $loaded): not the host runner, or no user bus; refusing" >&2
            exit 1
          fi
          results="$RUNNER_TEMP/c2-results"
          log="$results/agent.log"
          mkdir -p "$results"
          # The agent loads its placement onto whatever cards are free: a job's own process still holding one would make that load fail.
          if sudo -n fuser -s /dev/tenstorrent/[0-9]* 2>/dev/null; then
            echo "::error::a process holds a card; refusing to start the node agent" >&2
            sudo -n fuser -v /dev/tenstorrent/[0-9]* 2>&1 | tee -a "$log" >&2
            exit 1
          fi
          systemctl --user start thatch-node-agent.service
          state=$(systemctl --user is-active thatch-node-agent.service)
          echo "node agent after start: $state" | tee -a "$log"
          if [ "$state" != active ]; then
            echo "::error::the node agent is $state after the start" >&2
            exit 1
          fi
          deadline=$(( $(date +%s) + 1800 ))
          container=""; ids=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            for c in $(docker ps --filter status=running --format '{{.Names}}' | grep '^thatch-inference-' || true); do
              port=$(docker port "$c" 8000/tcp 2>/dev/null | head -1 | sed 's/.*://')
              [ -n "$port" ] || continue
              ids=$(curl -sS -m 10 "http://127.0.0.1:$port/v1/models" 2>/dev/null \
                | python3 -c 'import json,sys; print(" ".join(m["id"] for m in json.load(sys.stdin).get("data", [])))' 2>/dev/null || true)
              if [ -n "$ids" ]; then container=$c; break 2; fi
            done
            sleep 20
          done
          if [ -z "$container" ]; then
            echo "::error::no inference container answered /v1/models within 30 min" >&2
            echo "timed out waiting for a serving container" >> "$log"
            echo "=== agent journal"
            journalctl --user -u thatch-node-agent --since -35min --no-pager | grep -v -i heartbeat | tail -60 || true
            for c in $(docker ps -a --format '{{.Names}}' | grep '^thatch-inference-' || true); do
              echo "=== $c last 80 log lines"; docker logs --tail 80 "$c" 2>&1
            done
            exit 1
          fi
          image=$(docker inspect -f '{{.Config.Image}}' "$container")
          {
            echo "container: $container"
            echo "image: $image"
            echo "models: $ids"
          } | tee -a "$log"
          docker logs "$container" 2>&1 | grep -E '\[QWEN-C2\] profile|packed sampler arm' | head -5 | tee -a "$log" || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c2-serving-${{ github.run_id }}
          path: ${{ runner.temp }}/c2-results
          if-no-files-found: ignore
