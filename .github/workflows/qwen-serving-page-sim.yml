name: Qwen serving page replay simulator
on:
  push:
    tags: ['experiment/serving-page-sim-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: serving-page-candidate
          persist-credentials: false
      - name: Admit host and stage weight-free page probe
        working-directory: serving-page-candidate
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results
          python3 -B scripts/ci/runner_io_gate.py --attempts 1 --output experiment-results/runner-io-admission.json
          cp scripts/ci/serving-page-replay-probe.py scripts/ci/history-append-probe.py
          cmp scripts/ci/serving-page-replay-probe.py scripts/ci/history-append-probe.py
      - name: Captured cache writes follow appended physical pages
        working-directory: serving-page-candidate
        env:
          QWEN_SIM_ONLY: '1'
          QWEN_LEARNED_STACK: '1'
          QWEN_SIM_CASE: history-append
        run: timeout -k 15 330 bash scripts/ci/run-simulator.sh
      - name: Validate both-chip replay and clean close
        working-directory: serving-page-candidate
        run: |
          test "$(cat experiment-results/history-append.exit-status)" = 0
          python3 -B - <<'PY'
          import hashlib, json
          from pathlib import Path
          report = json.loads(Path('experiment-results/history-append.json').read_text())
          assert report['passed'] is True and report['closed_cleanly'] is True
          assert report['backend'] == 'simulator' and report['performance_qualified'] is False
          expected = {(ordinal, chip, name) for ordinal in (-1, 0, 1, 2, 3)
              for chip in (0, 1) for name in ('complete_cache', 'primary', 'singleton', 'reader')}
          assert len(report['checks']) == len(expected)
          assert {(entry['ordinal'], entry['chip'], entry['name']) for entry in report['checks']} == expected
          assert all(entry['exact'] is True for entry in report['checks'])
          for name in ('serving-page-replay-probe.py', 'serving_page_binding.py'):
              assert hashlib.sha256((Path('scripts/ci') / name).read_bytes()).hexdigest() == report['sources'][name]
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-serving-page-sim-${{ github.run_id }}
          path: serving-page-candidate/experiment-results/
