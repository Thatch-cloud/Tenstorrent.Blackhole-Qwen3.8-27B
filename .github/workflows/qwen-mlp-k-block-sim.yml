name: Qwen T16 K32 reduction block simulation
on:
  push:
    tags: ['experiment/mlp-k-block-sim-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: order-orchestrator
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8c102b20df22329106955b4006bf4d650bb94e40
          path: order-candidate
          persist-credentials: false
      - name: Stage K32 reduction candidate
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p order-candidate/experiment-results
          python3 -B order-orchestrator/scripts/ci/frozen_recipe_context.py --checkout order-candidate \
            --context 8192 --manifest order-candidate/experiment-results/frozen-geometry.json
          python3 -B order-orchestrator/scripts/ci/mlp_k_block.py --checkout order-candidate \
            --manifest order-candidate/experiment-results/k-block-candidate.json
          git -C order-candidate diff --check
      - name: Exact T16 eager replay and packed-weight checks
        timeout-minutes: 10
        working-directory: order-candidate
        env:
          QWEN_SIM_ONLY: '1'
          QWEN_LEARNED_STACK: '1'
          QWEN_SIM_CASE: fusion-t16-target
        run: timeout -k 30 570 bash scripts/ci/run-simulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-mlp-k-block-sim-${{ github.run_id }}
          path: order-candidate/experiment-results/
