name: Qwen block-stream T16 or T32 MLP replay
on:
  push:
    tags: ['experiment/mlp-block-stream-replay-v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: stream-orchestrator
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8c102b20df22329106955b4006bf4d650bb94e40
          path: stream-candidate
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 35296716954
          github-token: ${{ github.token }}
          name: qwen-mlp-block-stream-35296716954-1
          path: stream-transport
      - name: Admit storage and stage unchanged register math with bulk weights
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p stream-candidate/experiment-results
          python3 -B stream-orchestrator/scripts/ci/runner_io_gate.py --attempts 1 \
            --output stream-candidate/experiment-results/runner-io-admission.json
          python3 -B stream-orchestrator/scripts/ci/frozen_recipe_context.py --checkout stream-candidate \
            --context 8192 --manifest stream-candidate/experiment-results/frozen-geometry.json
          python3 -B stream-orchestrator/scripts/ci/mlp_block_stream_stage.py --checkout stream-candidate \
            --transport-report stream-transport/mlp-block-stream.json \
            --manifest stream-candidate/experiment-results/block-stream-candidate.json
          git -C stream-candidate diff --check
      - name: Select separately gated T32 width without changing arithmetic
        if: endsWith(github.ref_name, '-t32')
        run: |
          python3 -B stream-orchestrator/scripts/ci/mlp_block_stream_t32_stage.py --checkout stream-candidate \
            --manifest stream-candidate/experiment-results/block-stream-t32-candidate.json
          git -C stream-candidate diff --check
      - name: Exact eager outputs changed-input replay and stream integrity
        timeout-minutes: 8
        working-directory: stream-candidate
        env:
          QWEN_SIM_ONLY: '1'
          QWEN_LEARNED_STACK: '1'
          QWEN_SIM_CASE: fusion-t16-target
        run: timeout -k 15 450 bash scripts/ci/run-simulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-mlp-block-stream-replay-${{ github.run_id }}
          path: stream-candidate/experiment-results/
          if-no-files-found: error
