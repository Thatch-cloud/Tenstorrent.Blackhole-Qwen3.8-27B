name: Qwen long-context bring-up
on:
  push:
    tags: ['experiment/longctx-bringup-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  bringup:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: longctx
          persist-credentials: false
      - name: Confirm no process holds a card
        working-directory: longctx
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          paths=()
          for node in "${nodes[@]}"; do paths+=("/dev/tenstorrent/$node"); done
          status=0
          "${prefix[@]}" fuser -v "${paths[@]}" > experiment-results/holders.txt 2>&1 || status=$?
          if [ "$status" != 1 ] || [ -s experiment-results/holders.txt ]; then
            echo 'Device ownership not clear; not starting a server'
            cat experiment-results/holders.txt || true
            exit 1
          fi
          for metric in cpu memory io; do cat "/proc/pressure/$metric"; done \
            > experiment-results/host-pressure.txt
      - name: Start the server at 4 users x 161k and check readiness
        working-directory: longctx
        timeout-minutes: 32
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          # Bring-up only. Measures no throughput; falsifies the KV budget or does not.
          image=sha256:f1e9b1a64b4f7aa04cd3d3b36fefed4d47320bfdd0f4d108d2ca85a932cf9465
          target=/home/thatch/hf-cache/hub/models--Qwen--Qwen3.8-27B
          test -d "$target"
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          devices=()
          for node in "${nodes[@]}"; do devices+=(--device "/dev/tenstorrent/$node"); done
          name="qwen-longctx-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'timeout 15 docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout -k 30 1800 docker run --rm --name "$name" --network none \
            --hostname qwen-longctx --add-host qwen-longctx:127.0.0.1 \
            --cap-drop ALL --cap-add SYS_NICE --security-opt no-new-privileges \
            --pids-limit 4096 --memory 96g --cpus 16 --shm-size 8g \
            "${devices[@]}" \
            --mount type=bind,src=/dev/hugepages-1G,dst=/dev/hugepages-1G \
            --mount "type=bind,src=$target,dst=/models/hub/models--Qwen--Qwen3.8-27B,readonly" \
            --mount "type=bind,src=$PWD/scripts/ci,dst=/experiment-scripts/ci,readonly" \
            --mount "type=bind,src=$PWD/experiment-results,dst=/results" \
            --mount type=volume,src=qwen-experiments-f1e9b1a64b4f,dst=/experiment-cache \
            -e QWEN_HARDWARE_TESTS=1 -e QWEN_CARDS_ALLOCATED=1 \
            -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 -e VLLM_USE_V2_MODEL_RUNNER=0 \
            -e TT_METAL_HOME=/opt/tt-metal -e MESH_DEVICE=P300 -e OMP_NUM_THREADS=8 \
            -e TT_CACHE_PATH=/experiment-cache/weights -e TT_METAL_CACHE=/experiment-cache/kernels \
            -e TT_MESH_GRAPH_DESC_PATH=/opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p150_x2_mesh_graph_descriptor.textproto \
            --entrypoint python3 "$image" -B /experiment-scripts/ci/longctx_bringup_runner.py \
            --users 4 --context 163840 --results /results \
            > experiment-results/bringup-stdout.log 2>&1 || true
          echo '--- bringup summary ---'
          python3 -B -c "import json;d=json.load(open('experiment-results/bringup.json'));p=d['plan'];print('plan: %d users x %d ctx -> %d blocks, %.2f GiB KV'%(p['users'],p['context'],p['blocks'],p['kv_gib']));print('ready:',d.get('ready'),'stage:',d.get('stage'),'startup_s:',d.get('startup_seconds'));print('error:',d.get('error'));print('smoke:',(d.get('smoke_completion') or d.get('smoke_error') or '')[:200])" \
            || tail -25 experiment-results/bringup-stdout.log
          echo '--- kv / memory lines from server.log ---'
          python3 -B -c "import json;d=json.load(open('experiment-results/bringup.json'));[print(' ',x) for k in ('kv_cache_lines','gpu_blocks_lines','oom_lines') for x in (d.get('log') or {}).get(k,[])]" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-longctx-bringup-${{ github.run_id }}
          path: longctx/experiment-results/
