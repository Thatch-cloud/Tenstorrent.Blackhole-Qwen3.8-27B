name: Qwen split-K FP32 maxima simulator
on:
  push:
    tags: ['experiment/splitk-maxima-sim-v1', 'experiment/splitk-workers16-sim-v1']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 9
    steps:
      - name: Verify host and restore result ownership
        shell: bash
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          workspace=$(realpath -e "$GITHUB_WORKSPACE")
          results="$workspace/experiment-results"
          if [ -e "$results" ]; then
            test ! -L "$results"
            test "$(realpath -e "$results")" = "$results"
            sudo -n chown -R -h "$(id -u):$(id -g)" "$results"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Weight-free simulator build and correctness gate
        env:
          QWEN_SIM_ONLY: '1'
          QWEN_LEARNED_STACK: '1'
          QWEN_SIM_CASE: dspark-splitk
          QWEN_SPLITK_MAXIMA: '1'
          QWEN_SPLITK_WORKERS: ${{ github.ref == 'refs/tags/experiment/splitk-workers16-sim-v1' && '16' || '8' }}
        run: timeout -k 15 495 bash scripts/ci/run-simulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-splitk-maxima-sim-${{ github.run_id }}-${{ github.run_attempt }}
          path: experiment-results/
