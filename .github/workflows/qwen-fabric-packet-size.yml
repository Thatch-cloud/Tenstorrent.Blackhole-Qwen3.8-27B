name: Qwen fabric packet size
on:
  push:
    tags: ['experiment/fabric-packet-size-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  discover:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: fp
          persist-credentials: false
      - name: Find the knob that sets fabric packet size
        working-directory: fp
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results
          image=sha256:f1e9b1a64b4f7aa04cd3d3b36fefed4d47320bfdd0f4d108d2ca85a932cf9465
          name="qwen-fabric-pkt-discover-$GITHUB_RUN_ID"
          trap 'timeout 20 docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout -k 30 420 docker run --rm --name "$name" --network none \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 \
            --cpus 4 --memory 8g --tmpfs /tmp:rw,size=256m \
            --entrypoint bash "$image" -lc '
              echo "=== env vars mentioning FABRIC / PAYLOAD / PACKET ==="
              for so in $(find /opt/tt-metal -name "*.so" -size +1M 2>/dev/null | head -20); do
                strings "$so" 2>/dev/null
              done | grep -oE "TT_[A-Z0-9_]*(FABRIC|PAYLOAD|PACKET|CHANNEL|ETH)[A-Z0-9_]*" \
                | sort -u
              echo "=== the warning and its neighbours ==="
              for so in $(find /opt/tt-metal -name "*.so" -size +1M 2>/dev/null | head -20); do
                strings "$so" 2>/dev/null
              done | grep -iE "suboptimal for transporting|packet size to maximize" | sort -u
              echo "=== any source file that carries it ==="
              grep -rIl "suboptimal for transporting" /opt/tt-metal 2>/dev/null | head -5
            ' > experiment-results/packet-knobs.txt 2>&1 || true
          cat experiment-results/packet-knobs.txt
          grep -oE '^TT_[A-Z0-9_]+$' experiment-results/packet-knobs.txt \
            > experiment-results/candidates.txt || true
          echo "--- candidates ---"; cat experiment-results/candidates.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-fabric-packet-knobs-${{ github.run_id }}
          path: fp/experiment-results/

  tuned:
    needs: discover
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: fp
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen-fabric-packet-knobs-${{ github.run_id }}
          path: fp/knobs/
      - name: Confirm no process holds a card
        working-directory: fp
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          paths=()
          for node in "${nodes[@]}"; do paths+=("/dev/tenstorrent/$node"); done
          status=0
          "${prefix[@]}" fuser -v "${paths[@]}" > experiment-results/holders.txt 2>&1 || status=$?
          if [ "$status" != 1 ] || [ -s experiment-results/holders.txt ]; then
            echo 'Device ownership not clear'
            cat experiment-results/holders.txt || true
            exit 1
          fi
      - name: Measure with the packet size raised
        working-directory: fp
        timeout-minutes: 24
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          image=sha256:f1e9b1a64b4f7aa04cd3d3b36fefed4d47320bfdd0f4d108d2ca85a932cf9465
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          devices=()
          for node in "${nodes[@]}"; do devices+=(--device "/dev/tenstorrent/$node"); done
          sets=()
          while read -r knob; do
            case "$knob" in
              *PAYLOAD*|*PACKET*) sets+=(--set "$knob=8192");;
            esac
          done < <(cat knobs/candidates.txt 2>/dev/null || true)
          if [ "${#sets[@]}" -eq 0 ]; then
            echo 'No payload or packet knob discovered; running the arm anyway so the'
            echo 'readback records what this build reports by default.'
          fi
          echo "applying: ${sets[*]:-none}"
          name="qwen-fabric-pkt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'timeout 20 docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout -k 30 1200 docker run --rm --name "$name" --network none \
            --cap-drop ALL --cap-add SYS_NICE --security-opt no-new-privileges \
            --pids-limit 4096 --cpus 8 --memory 48g --shm-size 8g \
            "${devices[@]}" \
            --mount type=bind,src=/dev/hugepages-1G,dst=/dev/hugepages-1G \
            --mount "type=bind,src=$PWD,dst=/source,readonly" \
            --tmpfs /tmp:rw,size=512m \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/source/scripts/ci \
            -e QWEN_HARDWARE_TESTS=1 -e QWEN_CARDS_ALLOCATED=1 \
            -e TT_METAL_HOME=/opt/tt-metal \
            -e TT_MESH_GRAPH_DESC_PATH=/opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p150_x2_mesh_graph_descriptor.textproto \
            --entrypoint python3 "$image" -B /source/scripts/ci/fabric_packet_size_probe.py \
            --iters 30 "${sets[@]}" \
            > experiment-results/fabric-pkt-stdout.log 2>&1 || true
          sed -n '/FABRIC_PKT_JSON_BEGIN/,/FABRIC_PKT_JSON_END/p' \
            experiment-results/fabric-pkt-stdout.log | sed '1d;$d' \
            > experiment-results/fabric-pkt.json || true
          echo '--- did the suboptimal warning survive? that is the control ---'
          grep -c 'suboptimal for transporting' experiment-results/fabric-pkt-stdout.log \
            > experiment-results/warning-count.txt || echo 0 > experiment-results/warning-count.txt
          cat experiment-results/warning-count.txt
          if [ ! -s experiment-results/fabric-pkt.json ]; then
            echo 'No structured result; tail of stdout:'
            tail -60 experiment-results/fabric-pkt-stdout.log || true
            exit 1
          fi
          cat experiment-results/fabric-pkt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-fabric-packet-size-${{ github.run_id }}
          path: fp/experiment-results/
