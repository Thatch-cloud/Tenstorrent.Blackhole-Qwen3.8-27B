name: Qwen fabric packet size
on:
  push:
    tags: ['experiment/fabric-packet-size-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  discover:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: fp
          persist-credentials: false
      - name: Find the knob that sets fabric packet size
        working-directory: fp
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results/source
          image=sha256:f1e9b1a64b4f7aa04cd3d3b36fefed4d47320bfdd0f4d108d2ca85a932cf9465
          name="qwen-fabric-pkt-extract-$GITHUB_RUN_ID"
          docker create --name "$name" --entrypoint /bin/true "$image" >/dev/null
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker cp "$name:/opt/tt-metal/ttnn/cpp/ttnn/operations/ccl/ccl_common.cpp"             experiment-results/source/ccl_common.cpp
          echo '=== the warning and what feeds it ==='
          grep -n -B 30 'suboptimal for transporting'             experiment-results/source/ccl_common.cpp | tail -50             > experiment-results/warning-context.txt || true
          cat experiment-results/warning-context.txt
          echo '=== how packet size is obtained ==='
          grep -rn 'max_payload_size\|packet_size\|channel_buffer_size'             experiment-results/source/ccl_common.cpp | head -30             > experiment-results/packet-size-refs.txt || true
          cat experiment-results/packet-size-refs.txt
          echo '=== fabric headers that define it ==='
          docker cp "$name:/opt/tt-metal/tt_metal/api/tt-metalium/fabric.hpp"             experiment-results/source/fabric.hpp 2>/dev/null || true
          docker cp "$name:/opt/tt-metal/tt_metal/fabric/fabric_context.hpp"             experiment-results/source/fabric_context.hpp 2>/dev/null || true
          grep -rn 'max_payload_size\|set_.*packet\|CHANNEL_BUFFER'             experiment-results/source/*.hpp 2>/dev/null | head -30             > experiment-results/header-refs.txt || true
          cat experiment-results/header-refs.txt || true
          echo '=== who requests a packet size ==='
          for f in tt_metal/fabric/fabric_context.cpp                    tt_metal/fabric/erisc_datamover_builder.hpp                    tt_metal/fabric/erisc_datamover_builder.cpp; do
            docker cp "$name:/opt/tt-metal/$f" experiment-results/source/ 2>/dev/null || true
          done
          grep -rn 'validate_and_apply_packet_size\|compute_max_payload_size_bytes\|requested_size\|max_packet_payload_size_bytes'             experiment-results/source/ 2>/dev/null | head -40             > experiment-results/request-path.txt || true
          cat experiment-results/request-path.txt || true
          echo '=== what ttnn exposes, no device attached ==='
          timeout -k 20 240 docker run --rm --network none --cap-drop ALL             --cpus 4 --memory 8g --tmpfs /tmp:rw,size=256m             --mount "type=bind,src=$PWD,dst=/source,readonly"             -e TT_METAL_HOME=/opt/tt-metal -e PYTHONDONTWRITEBYTECODE=1             --entrypoint python3 "$image" -B /source/scripts/ci/fabric_api_dump.py             > experiment-results/ttnn-fabric-api.json 2>&1 || true
          cat experiment-results/ttnn-fabric-api.json || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-fabric-packet-knobs-${{ github.run_id }}
          path: fp/experiment-results/

  baseline:
    needs: discover
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: fp
          persist-credentials: false
      - name: Confirm no process holds a card
        working-directory: fp
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          paths=()
          for node in "${nodes[@]}"; do paths+=("/dev/tenstorrent/$node"); done
          status=0
          "${prefix[@]}" fuser -v "${paths[@]}" > experiment-results/holders.txt 2>&1 || status=$?
          if [ "$status" != 1 ] || [ -s experiment-results/holders.txt ]; then
            echo 'Device ownership not clear'
            cat experiment-results/holders.txt || true
            exit 1
          fi
      - name: Measure the default packet size
        working-directory: fp
        timeout-minutes: 24
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          image=sha256:f1e9b1a64b4f7aa04cd3d3b36fefed4d47320bfdd0f4d108d2ca85a932cf9465
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          devices=()
          for node in "${nodes[@]}"; do devices+=(--device "/dev/tenstorrent/$node"); done
          name="qwen-fabric-pkt-baseline-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'timeout 20 docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout -k 30 1200 docker run --rm --name "$name" --network none             --cap-drop ALL --cap-add SYS_NICE --security-opt no-new-privileges             --pids-limit 4096 --cpus 8 --memory 48g --shm-size 8g             "${devices[@]}"             --mount type=bind,src=/dev/hugepages-1G,dst=/dev/hugepages-1G             --mount "type=bind,src=$PWD,dst=/source,readonly"             --tmpfs /tmp:rw,size=512m             -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/source/scripts/ci             -e QWEN_HARDWARE_TESTS=1 -e QWEN_CARDS_ALLOCATED=1             -e TT_METAL_HOME=/opt/tt-metal             -e TT_MESH_GRAPH_DESC_PATH=/opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p150_x2_mesh_graph_descriptor.textproto             --entrypoint python3 "$image" -B /source/scripts/ci/fabric_packet_size_probe.py             --iters 30 --packet-size 0             > experiment-results/fabric-pkt-baseline.log 2>&1 || true
          sed -n '/FABRIC_PKT_JSON_BEGIN/,/FABRIC_PKT_JSON_END/p'             experiment-results/fabric-pkt-baseline.log | sed '1d;$d'             > experiment-results/fabric-pkt-baseline.json || true
          echo '--- control: did the suboptimal warning survive? ---'
          grep -c 'suboptimal for transporting' experiment-results/fabric-pkt-baseline.log             > experiment-results/warning-count-baseline.txt || echo 0 > experiment-results/warning-count-baseline.txt
          cat experiment-results/warning-count-baseline.txt
          if [ ! -s experiment-results/fabric-pkt-baseline.json ]; then
            echo 'No structured result; tail of stdout:'
            tail -60 experiment-results/fabric-pkt-baseline.log || true
            exit 1
          fi
          cat experiment-results/fabric-pkt-baseline.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-fabric-pkt-baseline-${{ github.run_id }}
          path: fp/experiment-results/

  tuned:
    needs: baseline
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: fp
          persist-credentials: false
      - name: Confirm no process holds a card
        working-directory: fp
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          paths=()
          for node in "${nodes[@]}"; do paths+=("/dev/tenstorrent/$node"); done
          status=0
          "${prefix[@]}" fuser -v "${paths[@]}" > experiment-results/holders.txt 2>&1 || status=$?
          if [ "$status" != 1 ] || [ -s experiment-results/holders.txt ]; then
            echo 'Device ownership not clear'
            cat experiment-results/holders.txt || true
            exit 1
          fi
      - name: Measure with the packet size raised to 8192 B
        working-directory: fp
        timeout-minutes: 24
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          image=sha256:f1e9b1a64b4f7aa04cd3d3b36fefed4d47320bfdd0f4d108d2ca85a932cf9465
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          devices=()
          for node in "${nodes[@]}"; do devices+=(--device "/dev/tenstorrent/$node"); done
          name="qwen-fabric-pkt-tuned-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'timeout 20 docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout -k 30 1200 docker run --rm --name "$name" --network none             --cap-drop ALL --cap-add SYS_NICE --security-opt no-new-privileges             --pids-limit 4096 --cpus 8 --memory 48g --shm-size 8g             "${devices[@]}"             --mount type=bind,src=/dev/hugepages-1G,dst=/dev/hugepages-1G             --mount "type=bind,src=$PWD,dst=/source,readonly"             --tmpfs /tmp:rw,size=512m             -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/source/scripts/ci             -e QWEN_HARDWARE_TESTS=1 -e QWEN_CARDS_ALLOCATED=1             -e TT_METAL_HOME=/opt/tt-metal             -e TT_MESH_GRAPH_DESC_PATH=/opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p150_x2_mesh_graph_descriptor.textproto             --entrypoint python3 "$image" -B /source/scripts/ci/fabric_packet_size_probe.py             --iters 30 --packet-size 8192             > experiment-results/fabric-pkt-tuned.log 2>&1 || true
          sed -n '/FABRIC_PKT_JSON_BEGIN/,/FABRIC_PKT_JSON_END/p'             experiment-results/fabric-pkt-tuned.log | sed '1d;$d'             > experiment-results/fabric-pkt-tuned.json || true
          echo '--- control: did the suboptimal warning survive? ---'
          grep -c 'suboptimal for transporting' experiment-results/fabric-pkt-tuned.log             > experiment-results/warning-count-tuned.txt || echo 0 > experiment-results/warning-count-tuned.txt
          cat experiment-results/warning-count-tuned.txt
          if [ ! -s experiment-results/fabric-pkt-tuned.json ]; then
            echo 'No structured result; tail of stdout:'
            tail -60 experiment-results/fabric-pkt-tuned.log || true
            exit 1
          fi
          cat experiment-results/fabric-pkt-tuned.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-fabric-pkt-tuned-${{ github.run_id }}
          path: fp/experiment-results/

  planes:
    needs: tuned
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: fp
          persist-credentials: false
      - name: Confirm no process holds a card
        working-directory: fp
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          paths=()
          for node in "${nodes[@]}"; do paths+=("/dev/tenstorrent/$node"); done
          status=0
          "${prefix[@]}" fuser -v "${paths[@]}" > experiment-results/holders.txt 2>&1 || status=$?
          if [ "$status" != 1 ] || [ -s experiment-results/holders.txt ]; then
            echo 'Device ownership not clear'
            cat experiment-results/holders.txt || true
            exit 1
          fi
      - name: Measure at 8192 B across four routing planes
        working-directory: fp
        timeout-minutes: 24
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          image=sha256:f1e9b1a64b4f7aa04cd3d3b36fefed4d47320bfdd0f4d108d2ca85a932cf9465
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          devices=()
          for node in "${nodes[@]}"; do devices+=(--device "/dev/tenstorrent/$node"); done
          name="qwen-fabric-pkt-planes-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'timeout 20 docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout -k 30 1200 docker run --rm --name "$name" --network none             --cap-drop ALL --cap-add SYS_NICE --security-opt no-new-privileges             --pids-limit 4096 --cpus 8 --memory 48g --shm-size 8g             "${devices[@]}"             --mount type=bind,src=/dev/hugepages-1G,dst=/dev/hugepages-1G             --mount "type=bind,src=$PWD,dst=/source,readonly"             --tmpfs /tmp:rw,size=512m             -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/source/scripts/ci             -e QWEN_HARDWARE_TESTS=1 -e QWEN_CARDS_ALLOCATED=1             -e TT_METAL_HOME=/opt/tt-metal             -e TT_MESH_GRAPH_DESC_PATH=/opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p150_x2_mesh_graph_descriptor.textproto             --entrypoint python3 "$image" -B /source/scripts/ci/fabric_packet_size_probe.py             --iters 30 --packet-size 8192 --num-planes 4             > experiment-results/fabric-pkt-planes.log 2>&1 || true
          sed -n '/FABRIC_PKT_JSON_BEGIN/,/FABRIC_PKT_JSON_END/p'             experiment-results/fabric-pkt-planes.log | sed '1d;$d'             > experiment-results/fabric-pkt-planes.json || true
          echo '--- control: did the suboptimal warning survive? ---'
          grep -c 'suboptimal for transporting' experiment-results/fabric-pkt-planes.log             > experiment-results/warning-count-planes.txt || echo 0 > experiment-results/warning-count-planes.txt
          cat experiment-results/warning-count-planes.txt
          if [ ! -s experiment-results/fabric-pkt-planes.json ]; then
            echo 'No structured result; tail of stdout:'
            tail -60 experiment-results/fabric-pkt-planes.log || true
            exit 1
          fi
          cat experiment-results/fabric-pkt-planes.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-fabric-pkt-planes-${{ github.run_id }}
          path: fp/experiment-results/
