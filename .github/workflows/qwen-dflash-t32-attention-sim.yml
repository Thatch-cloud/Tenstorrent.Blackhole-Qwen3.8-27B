name: Qwen DFlash T32 native attention simulation
on:
  push:
    tags: ['experiment/dflash-t32-attention-sim-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: dflash-t32-sim-${{ github.run_id }}
          persist-credentials: false
      - name: Stage full-query masks and gate storage before Docker
        working-directory: dflash-t32-sim-${{ github.run_id }}
        run: |
          mkdir -p experiment-results
          python3 -B scripts/ci/runner_io_gate.py --attempts 1 --output experiment-results/runner-io-admission.json
          python3 -B scripts/ci/dflash_t32_native_stage.py --manifest experiment-results/t32-simulator-sources.json
      - name: Weight-free T32 mask isolation and changed-input replay
        working-directory: dflash-t32-sim-${{ github.run_id }}
        env:
          QWEN_SIM_ONLY: '1'
          QWEN_LEARNED_STACK: '1'
          QWEN_SIM_CASE: dflash-t16-native-attention
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          timeout -k 20 480 bash scripts/ci/run-simulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-dflash-t32-attention-${{ github.run_id }}-${{ github.run_attempt }}
          path: dflash-t32-sim-${{ github.run_id }}/experiment-results/
          if-no-files-found: error
