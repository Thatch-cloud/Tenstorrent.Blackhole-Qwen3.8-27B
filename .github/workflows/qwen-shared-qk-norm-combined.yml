name: Qwen matched shared-QK norm readers
on:
  push:
    tags: ['experiment/shared-qk-norm-combined-v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  combined:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: norm-orchestrator
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8c102b20df22329106955b4006bf4d650bb94e40
          path: norm-combined
          persist-credentials: false
      - name: Restore winning runtime and scatter qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          evidence=$(mktemp -d "$RUNNER_TEMP/qwen-read-order-combined.XXXXXX")
          gh run download 35060395395 --repo "$GITHUB_REPOSITORY" --name qwen-frozen-32k-numerical-35060395395-1 --dir "$evidence/numerical"
          gh run download 35062238298 --repo "$GITHUB_REPOSITORY" --name qwen-frozen-recovered-35062238298-1 --dir "$evidence/diagnostics"
          gh run download 35068517785 --repo "$GITHUB_REPOSITORY" --name qwen-frozen-32k-numerical-35068517785-1 --dir "$evidence/target"
          gh run download 35024279412 --repo "$GITHUB_REPOSITORY" --name qwen-history-append-hardware-35024279412 --dir "$evidence/history"
          gh run download 35086789628 --repo "$GITHUB_REPOSITORY" --name qwen-frozen-gdn-cache-35086789628-1 --dir "$evidence/norm"
          gh run download 35158163367 --repo "$GITHUB_REPOSITORY" --name qwen-draft-tail-hardware-35158163367 --dir "$evidence/draft-tail"
          gh run download 35214644611 --repo "$GITHUB_REPOSITORY" --name qwen-frozen-gdn-cache-35214644611-1 --dir "$evidence/scatter"
          test "$(cat "$evidence/norm/gdn-shared-recurrence.exit-status")" = 0
          test "$(cat "$evidence/draft-tail/draft-tail-hardware.exit-status")" = 0
          cp "$evidence/history/history-append-hardware.json" norm-combined/scripts/ci/history-append-hardware.json
          cp "$evidence/norm/gdn-shared-recurrence.json" norm-combined/scripts/ci/frozen-gdn-norm.json
          cp "$evidence/draft-tail/draft-tail-hardware.json" norm-combined/scripts/ci/frozen-draft-tail-hardware.json
          mkdir -p norm-combined/experiment-results
          chmod 2775 norm-combined/experiment-results
          python3 -B norm-orchestrator/scripts/ci/frozen_recipe_context.py --checkout norm-combined \
            --context 32768 --scalar-reciprocal --target-replay --combined-runtime --norm-prefetch \
            --manifest norm-combined/experiment-results/frozen-geometry.json
          python3 -B norm-orchestrator/scripts/ci/frozen_draft_tail_stage.py --checkout norm-combined \
            --geometry norm-combined/experiment-results/frozen-geometry.json \
            --manifest norm-combined/experiment-results/draft-tail-sources.json
          python3 -B norm-orchestrator/scripts/ci/frozen_stage_evidence.py --repository norm-orchestrator \
            --numerical "$evidence/numerical" --diagnostics "$evidence/diagnostics" --target "$evidence/target" \
            --output norm-combined/scripts/ci/frozen-evidence > norm-combined/experiment-results/component-qualification.json
          python3 -B norm-orchestrator/scripts/ci/frozen_ladder_stage.py --checkout norm-combined \
            --manifest norm-combined/experiment-results/ladder-sources.json
          python3 -B norm-orchestrator/scripts/ci/shared_qk_norm_stage.py --checkout norm-combined \
            --evidence "$evidence/scatter" --manifest norm-combined/experiment-results/norm-combined-sources.json
          git -C norm-combined diff --check
      - name: Check host pressure before loading
        run: |
          python3 -B norm-orchestrator/scripts/ci/runner_io_gate.py --attempts 4 \
            --output norm-combined/experiment-results/runner-io-admission.json
      - name: Matched complete T16 audits and ABBA requests
        working-directory: norm-combined
        env:
          GH_TOKEN: ${{ github.token }}
          QWEN_CARDS_ALLOCATED: '1'
          QWEN_FROZEN_COMBINED_RUNTIME: '1'
          QWEN_SHARED_QK_NORM_COMPARISON: '1'
          QWEN_DSPARK_REQUEST_CONTEXT: '4096'
          QWEN_DSPARK_MODE: request-target-attention
          QWEN_DSPARK_CODING_TASK: merge_intervals
          QWEN_DSPARK_MLP_DOWN: '0'
          QWEN_DSPARK_SCORE_LAYOUT: '1'
          QWEN_DSPARK_BANKED_PROPOSAL: '0'
          QWEN_DSPARK_NATIVE_SLOT: '0'
          QWEN_DSPARK_FUSION_T16: '1'
          QWEN_DSPARK_CAPTURED_PUBLICATION: '1'
          QWEN_DSPARK_MLP_FOOTPRINT: '0'
          QWEN_DSPARK_DRAFT_PROFILE: '0'
          QWEN_DSPARK_HISTORY_PROFILE: '0'
        run: timeout -k 20 600 bash scripts/ci/run-dspark-hardware.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-shared-qk-norm-combined-${{ github.run_id }}
          path: norm-combined/experiment-results/
