name: Qwen prefill device profile
on:
  push:
    tags: ['experiment/prefill-profile-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  profile:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: pp
          persist-credentials: false
      - name: Confirm no process holds a card
        working-directory: pp
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          paths=()
          for node in "${nodes[@]}"; do paths+=("/dev/tenstorrent/$node"); done
          status=0
          "${prefix[@]}" fuser -v "${paths[@]}" > experiment-results/holders.txt 2>&1 || status=$?
          if [ "$status" != 1 ] || [ -s experiment-results/holders.txt ]; then
            echo 'Device ownership not clear'
            cat experiment-results/holders.txt || true
            exit 1
          fi
      - name: Profile prefill at several prompt lengths
        working-directory: pp
        timeout-minutes: 65
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          image=sha256:bd878710e15c574e53451976122a9ebb0d5f146fdd37eeb92a9138f773be33fa
          target=/home/thatch/hf-cache/hub/models--Qwen--Qwen3.8-27B
          model=/models/hub/models--Qwen--Qwen3.8-27B/snapshots/1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
          mkdir -p experiment-results/profile
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          devices=()
          for node in "${nodes[@]}"; do devices+=(--device "/dev/tenstorrent/$node"); done
          name="qwen-pp-profile-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'timeout 20 docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout -k 30 3600 docker run --rm --name "$name" --network none \
            --cap-drop ALL --cap-add SYS_NICE --security-opt no-new-privileges \
            --pids-limit 4096 --memory 96g --cpus 16 --shm-size 8g \
            "${devices[@]}" \
            --mount type=bind,src=/dev/hugepages-1G,dst=/dev/hugepages-1G \
            --mount "type=bind,src=$target,dst=/models/hub/models--Qwen--Qwen3.8-27B,readonly" \
            --mount "type=bind,src=$PWD/scripts/ci/prefill_profile.py,dst=/bench/prefill_profile.py,readonly" \
            --mount "type=bind,src=$PWD/scripts/ci/prefill-device-profile.sh,dst=/bench/prefill-device-profile.sh,readonly" \
            --mount "type=bind,src=$PWD/experiment-results/profile,dst=/experiment/results" \
            --group-add "$(stat -c %g experiment-results/profile)" \
            --mount type=volume,src=qwen-experiments-f1e9b1a64b4f,dst=/experiment-cache \
            -e QWEN_HARDWARE_TESTS=1 -e QWEN_CARDS_ALLOCATED=1 \
            -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 -e VLLM_USE_V2_MODEL_RUNNER=0 \
            -e TT_METAL_HOME=/opt/tt-metal -e MESH_DEVICE=P300 -e OMP_NUM_THREADS=8 \
            -e TT_CACHE_PATH=/experiment-cache/weights -e TT_METAL_CACHE=/experiment-cache/kernels \
            -e TT_MESH_GRAPH_DESC_PATH=/opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p150_x2_mesh_graph_descriptor.textproto \
            --entrypoint bash "$image" /bench/prefill-device-profile.sh \
            /bench/prefill_profile.py --model "$model" --context 65536 \
            --lengths 4096,16384,32768 --signpost \
            > experiment-results/pp-stdout.log 2>&1 || true
          sed -n '/PREFILL_PROFILE_JSON_BEGIN/,/PREFILL_PROFILE_JSON_END/p' \
            experiment-results/pp-stdout.log | sed '1d;$d' \
            > experiment-results/prefill-profile.json || true
          ls -la experiment-results/profile/metadata/ || true
          if [ ! -s experiment-results/prefill-profile.json ]; then
            echo 'No structured result; tail of stdout:'
            tail -60 experiment-results/pp-stdout.log || true
            exit 1
          fi
          cat experiment-results/prefill-profile.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-prefill-profile-${{ github.run_id }}
          path: pp/experiment-results/
