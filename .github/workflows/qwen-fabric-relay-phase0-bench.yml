name: Qwen fabric-relay Phase-0 device benchmarks
on:
  push:
    tags: ['experiment/fabric-relay-phase0-bench-v1']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  bench:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 12
    steps:
      - name: Verify dedicated host
        run: test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: P0.1 PCIe and P0.2 fabric bandwidth on the pinned image
        working-directory: ${{ github.workspace }}
        env:
          QWEN_CARDS_ALLOCATED: '1'
        run: |
          mkdir -p experiment-results
          chmod 2775 experiment-results
          timeout -k 15 500 bash scripts/ci/run-fabric-relay-phase0-bench.sh
      - name: Phase-0 gate summaries
        if: always()
        run: |
          for f in experiment-results/p0-bench-*.json; do
            [ -e "$f" ] || continue
            echo "=== $f ==="
            cat "$f"
          done
          [ -e experiment-results/p02-fabric-unavailable.txt ] && \
            cat experiment-results/p02-fabric-unavailable.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-fabric-relay-phase0-bench-${{ github.run_id }}
          path: experiment-results/
