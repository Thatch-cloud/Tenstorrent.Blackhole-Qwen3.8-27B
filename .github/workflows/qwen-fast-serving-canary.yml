name: Qwen combined fast serving hardware canary
on:
  push:
    tags: ['experiment/fast-serving-canary-v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  canary:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: fast-serving-canary
          persist-credentials: false
      - name: Admit image, fixtures and exact hardware reference
        working-directory: fast-serving-canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results canary/draft-config
          python3 -B scripts/ci/runner_io_gate.py --attempts 4 --output experiment-results/runner-io-admission.json
          docker image inspect sha256:29153355a914393e98345ff77c5bd3619943f1d93b6fd0042d7fe538665c2ff1 --format '{{json .Id}}' > experiment-results/image-id.json
          gh run download 35341952099 --repo "$GITHUB_REPOSITORY" --name qwen-frozen-gdn-grouped-gather-35341952099-1 --dir canary/grouped-gather-evidence
          gh run download 35321449903 --repo "$GITHUB_REPOSITORY" --name qwen-cumulative-t16-35321449903 --dir canary/reference
          cp canary/reference/dspark-captured-publication-request-hardware.json canary/reference.json
          echo '0be812cceaf6f91686570bb02a9991cc5a58d8aaa95e05d0633388802799a2bc  canary/reference.json' | sha256sum -c -
          curl -fsSL --max-time 30 https://huggingface.co/incoai/Qwen3.8-27B-DFlash2/resolve/dedf8df68adfb1afeaf7b7480c0a0243108177b4/config.json > canary/draft-config/config.json
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('canary/draft-config/config.json').read_text())
          assert config['architectures'] == ['DFlash2DraftModel']
          assert config['num_hidden_layers'] == 5 and config['hidden_size'] == 5120
          assert config['vocab_size'] == 248320 and config['sliding_window'] == 2048
          assert config['dflash_config']['target_layer_ids'] == [5, 19, 33, 47, 61]
          PY
          cp scripts/ci/serving_canary_client.py scripts/ci/serving_canary_runner.py canary/
      - name: Run isolated two-card HTTP canary
        working-directory: fast-serving-canary
        run: |
          image=sha256:29153355a914393e98345ff77c5bd3619943f1d93b6fd0042d7fe538665c2ff1
          target=/home/thatch/hf-cache/hub/models--Qwen--Qwen3.8-27B
          cache=/home/thatch/.cache/qwen-experiments
          revision=dedf8df68adfb1afeaf7b7480c0a0243108177b4
          mounts=()
          for component in attention convolution mlp projection selector; do
            source="$cache/dflash2-$component-$revision"
            test -f "$source/manifest.json"
            mounts+=(--mount "type=bind,src=$source,dst=/experiment-dflash-fixture/$component,readonly")
          done
          for layer in 1 2 3 4; do
            source="$cache/dflash2-stack-$revision/layer-$layer"
            test -f "$source/manifest.json"
            mounts+=(--mount "type=bind,src=$source,dst=/experiment-dflash-fixture/layer-$layer,readonly")
          done
          test -d "$target/snapshots/1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
          test "$(docker volume inspect --format '{{index .Labels "thatch.qwen.experiment-cache"}}' qwen-experiments-f1e9b1a64b4f)" = true
          name="qwen-serving-canary-$GITHUB_RUN_ID"
          cleanup() {
            status=$?
            trap - EXIT
            docker logs "$name" > experiment-results/container.log 2>&1 || true
            docker cp "$name:/experiment/results/." experiment-results/ || true
            docker rm -f "$name" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 143' TERM
          trap 'exit 130' INT
          docker create --name "$name" --network none --hostname qwen-canary --add-host qwen-canary:127.0.0.1 \
            --cap-drop ALL --cap-add SYS_NICE --security-opt no-new-privileges \
            --pids-limit 4096 --memory 96g --cpus 16 --shm-size 8g \
            --device /dev/tenstorrent/0 --device /dev/tenstorrent/2 \
            --mount type=bind,src=/dev/tenstorrent,dst=/host-dev/tenstorrent,readonly \
            --mount type=bind,src=/dev/hugepages-1G,dst=/dev/hugepages-1G \
            --mount "type=bind,src=$target,dst=/models/hub/models--Qwen--Qwen3.8-27B,readonly" \
            --mount "type=bind,src=$PWD/canary,dst=/canary,readonly" \
            --mount "type=bind,src=$PWD/canary/draft-config,dst=/draft-config,readonly" \
            --mount type=volume,src=qwen-experiments-f1e9b1a64b4f,dst=/experiment-cache "${mounts[@]}" \
            -e QWEN_HARDWARE_TESTS=1 -e QWEN_CARDS_ALLOCATED=1 -e QWEN_PROJECTION_LINKS=4 \
            -e QWEN_MLP_BLOCK_STREAM_EXPERIMENT=1 -e QWEN_DRAFT_KV_SLIDE_EXPERIMENT=1 \
            -e QWEN_GDN_DIRECT_WINDOW=1 \
            -e QWEN_FAST_PHASE_TIMING=1 \
            -e QWEN_GDN_GROUPED_GATHER_ABBA=1 \
            -e QWEN_FABRIC_LINK_PROBE=1 -e QWEN_SDPA_BF8=1 -e QWEN_SDPA_TREE_SCRATCH_ROUNDS=1 \
            -e QWEN_FROZEN_COMBINED_RUNTIME=1 -e QWEN_DSPARK_REQUEST_CONTEXT=4096 \
            -e QWEN_GDN_SHARED_QK_EXPERIMENT=1 -e QWEN_SKIP_UNUSED_SINGLETON_POSITIONS=1 \
            -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 -e VLLM_USE_V2_MODEL_RUNNER=0 \
            -e TT_METAL_HOME=/opt/tt-metal -e MESH_DEVICE=P300 -e OMP_NUM_THREADS=8 \
            -e TT_CACHE_PATH=/experiment-cache/weights -e TT_METAL_CACHE=/experiment-cache/kernels \
            -e TT_MESH_GRAPH_DESC_PATH=/opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p150_x2_mesh_graph_descriptor.textproto \
            --entrypoint python3 "$image" -B /canary/serving_canary_runner.py
          timeout -k 15 900 docker start -a "$name"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$name")" = 0
      - name: Validate warm combined comparison
        working-directory: fast-serving-canary
        run: |
          python3 -B scripts/ci/serving_gather_report.py --results experiment-results --evidence canary/grouped-gather-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-fast-serving-canary-${{ github.run_id }}
          path: fast-serving-canary/experiment-results/
