name: Qwen fabric-relay framework unit
on:
  pull_request:
    branches: [main]
    paths:
      - 'optimisation/fabric-relay/**'
      - 'scripts/ci/fabric_relay_phase0_identity.py'
      - 'scripts/ci/test_fabric_relay_phase0_identity.py'
      - 'docs/fabric-weight-loading-plan.md'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: qwen-fabric-relay-unit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: optimisation/fabric-relay/spec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate the phase registry
        run: python optimisation/fabric-relay/spec/validate_spec.py
      - name: Fabric-relay host tests
        run: python -B -m unittest discover -s optimisation/fabric-relay -p 'test_*.py' -v
      - name: Registry test gate
        run: python -B -m unittest discover -s optimisation/fabric-relay/spec -p 'test_*.py' -v
      - name: Phase-0 identity capture tests
        run: python -B -m unittest discover -s scripts/ci -p 'test_fabric_relay_phase0_identity.py' -v
      - name: Shell syntax gates for phase-0 scripts
        run: |
          bash -n scripts/ci/run-fabric-relay-phase0-bench.sh
          bash -n scripts/ci/fabric-relay-phase0-bench-inner.sh
      - run: git diff --check
