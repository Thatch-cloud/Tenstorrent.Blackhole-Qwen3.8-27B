name: Qwen pinned kernel capability inventory
on:
  push:
    tags: ['experiment/frozen-kernel-inventory-v1', 'experiment/frozen-profiler-export-inventory-v1', 'experiment/prefill-cache-inventory-*', 'experiment/gdn-conv-inventory-*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: kernel-inventory-orchestrator
          persist-credentials: false
      - name: Read pinned sources without cards or model weights
        timeout-minutes: 2
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          output=$(mktemp -d "$RUNNER_TEMP/qwen-kernel-inventory.XXXXXX")
          echo "QWEN_INVENTORY_OUTPUT=$output" >> "$GITHUB_ENV"
          image=sha256:f1e9b1a64b4f7aa04cd3d3b36fefed4d47320bfdd0f4d108d2ca85a932cf9465
          inventory_script=frozen_kernel_inventory.py
          if [[ "$GITHUB_REF_NAME" = experiment/prefill-cache-inventory-* ]]; then
            inventory_script=prefill_cache_inventory.py
          fi
          if [[ "$GITHUB_REF_NAME" = experiment/gdn-conv-inventory-* ]]; then
            inventory_script=gdn_conv_inventory.py
          fi
          timeout -k 10 90 docker run --rm --pull never --network none --read-only \
            --cpus 2 --memory 2g --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --mount "type=bind,src=$GITHUB_WORKSPACE/kernel-inventory-orchestrator/scripts/ci,dst=/inventory-scripts,readonly" \
            --mount "type=bind,src=$output,dst=/inventory-output" \
            --entrypoint python3 "$image" -B "/inventory-scripts/$inventory_script" \
            --output /inventory-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-kernel-inventory-${{ github.run_id }}
          path: ${{ env.QWEN_INVENTORY_OUTPUT }}/
