name: Qwen T16 T32 integration CPU
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: qwen-integration-cpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONPATH: scripts/ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.4.6 PyYAML==6.0.2
      - name: T32 and unchanged T16 regression gates
        run: |
          python -B -m unittest discover -s scripts/ci -p 'test_*t32*.py'
          python -B -m unittest test_full_dspark_request test_fused_t16_scope test_native_draft_sdpa test_history_publication_profile test_cpu_simulator_ci test_target_t16_context_cli test_winning_verifier_profile test_winning_risc_attribution
          python -B -m unittest test_dspark_confidence_reference test_dspark_confidence_fixture test_dspark_confidence_parity
          python -B -m unittest discover -s scripts/ci -p 'test_frozen_ladder*.py'
          python -B -m unittest test_full_window_tail test_full_window_geometry_admission test_frozen_runtime_context test_frozen_recipe_context
          python -B -m unittest test_prefill_cache_inventory test_winning_device_attribution
          python -B -m unittest test_mlp_clock_samples test_mlp_clock_projection test_frozen_mlp_wait_zones
          python -B -m unittest test_mlp_clock_capture test_mlp_clock_stage
          python -B -m unittest test_mlp_clock_report
          python -B -m unittest test_mlp_clock_hardware
          python -B -m unittest test_mlp_clock_combined
          python -B -m unittest test_mlp_clock_experiment
          python -B -m unittest test_mlp_clock_combined_report
          python -B -m unittest test_mlp_weight_read_order
          python -B -m unittest test_mlp_read_order_gate
          python -B -m unittest test_mlp_read_order_comparison
          python -B -m unittest test_mlp_read_order_experiment
          python -B -m unittest test_mlp_read_order_report
          python -B -m unittest test_shared_qk_norm_scatter
          python -B -m unittest test_shared_qk_norm_scatter_gate
          python -B -m unittest test_shared_qk_norm_comparison
          python -B -m unittest test_shared_qk_norm_report
          python -B -m unittest test_mlp_compute_clock
          python -B -m unittest test_mlp_compute_clock_capture
          python -B -m unittest test_mlp_compute_clock_report
          python -B -m unittest test_mlp_compute_clock_hardware
          python -B -m unittest test_mlp_compute_clock_combined test_mlp_compute_clock_experiment test_mlp_compute_clock_combined_report
          python -B -m unittest test_mlp_weight_pipeline
          python -B -m unittest test_dspark_projection_precision
          python -B -m unittest test_dspark_layer_precision
          python -B -m unittest test_dspark_precision_comparison
          python -B -m unittest test_dspark_precision_device
          python -B -m unittest test_dspark_precision_gate
          python -B -m unittest test_dspark_projection_precision_stage
          python -B -m unittest test_dspark_projection_precision_report
          python -B -m unittest test_mlp_weight_pipeline_gate test_mlp_weight_pipeline_experiment test_mlp_weight_pipeline_comparison test_mlp_weight_pipeline_report
          python -B -m unittest test_ladder_cache_reference
          python -B -m unittest test_prefill_gdn_checkpoint test_prefill_prefix_resume test_prefill_prefix_features
          python -B -m unittest test_prefill_prefix_lookup test_prefill_prefix_boundary
          python -B -m unittest test_prefill_prefix_integration
          python -B -m unittest test_prefill_prefix_residency
          python -B -m unittest test_prefill_checkpoint_allocation
          python -B -m unittest test_prefill_prefix_session
          python -B -m unittest test_prefill_prefix_stage test_prefill_prefix_experiment.PrefixExperimentTests
          python -B -m unittest test_dspark_request_experiment.DSparkRequestExperimentTests.test_cached_pp_is_separate_from_cold_pp_and_keeps_full_cycle_tg test_dspark_request_experiment.DSparkRequestExperimentTests.test_incomplete_cached_accounting_or_scope_rejected
          python -B -m unittest test_history_concat_lifetime test_history_concat_gate
          bash -n scripts/ci/run-simulator.sh
          bash -n scripts/ci/simulator-suite.sh
          bash -n scripts/ci/mlp-clock-hardware-suite.sh
          git diff --check
