name: Qwen T16 T32 integration CPU
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: qwen-integration-cpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONPATH: scripts/ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.4.6 PyYAML==6.0.2
      - name: T32 and unchanged T16 regression gates
        run: |
          python -B -m unittest test_dflash_host_attribution
          python -B -m unittest test_dram_eligibility_inventory
          python -B -m unittest test_dram_harvest_probe
          python -B -m unittest test_firmware_staging_manifest
          python -B -m unittest test_firmware_flash_workflow
