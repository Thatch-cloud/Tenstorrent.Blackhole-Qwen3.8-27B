name: Qwen GDN input overlap simulation
on:
  push:
    tags: ['experiment/gdn-input-overlap-sim-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: gdn-input-overlap-orchestrator
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8c102b20df22329106955b4006bf4d650bb94e40
          path: gdn-input-overlap-candidate
          persist-credentials: false
      - name: Stage zero-buffer input overlap
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p gdn-input-overlap-candidate/experiment-results
          python3 -B gdn-input-overlap-orchestrator/scripts/ci/frozen_recipe_context.py \
            --checkout gdn-input-overlap-candidate --context 8192 \
            --manifest gdn-input-overlap-candidate/experiment-results/frozen-geometry.json
          python3 -B gdn-input-overlap-orchestrator/scripts/ci/gdn_input_overlap_stage.py \
            --checkout gdn-input-overlap-candidate > gdn-input-overlap-candidate/experiment-results/cache-candidate.json
          git -C gdn-input-overlap-candidate diff --check
          git -C gdn-input-overlap-candidate diff > gdn-input-overlap-candidate/experiment-results/cache.patch
      - name: Synthetic eager and changed-input replay qualification
        timeout-minutes: 10
        working-directory: gdn-input-overlap-candidate
        env:
          QWEN_SIM_ONLY: '1'
          QWEN_LEARNED_STACK: '1'
          QWEN_SIM_CASE: gdn-shared-recurrence
        run: timeout -k 30 570 bash scripts/ci/run-simulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-frozen-gdn-input-overlap-${{ github.run_id }}-${{ github.run_attempt }}
          path: gdn-input-overlap-candidate/experiment-results/
