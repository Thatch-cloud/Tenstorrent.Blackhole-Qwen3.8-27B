name: Qwen fused gate/up mapping sweep
on:
  push:
    tags: ['experiment/fused-mapping-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: fused-sweep
          persist-credentials: false
      - name: Confirm no process holds a card
        working-directory: fused-sweep
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          paths=()
          for node in "${nodes[@]}"; do paths+=("/dev/tenstorrent/$node"); done
          status=0
          "${prefix[@]}" fuser -v "${paths[@]}" > experiment-results/holders.txt 2>&1 || status=$?
          if [ "$status" != 1 ] || [ -s experiment-results/holders.txt ]; then
            echo 'Device ownership not clear; not opening a card'
            cat experiment-results/holders.txt || true
            exit 1
          fi
          for metric in cpu memory io; do cat "/proc/pressure/$metric"; done \
            > experiment-results/host-pressure.txt
          cat experiment-results/host-pressure.txt
      - name: Sweep the reviewed fused mappings
        working-directory: fused-sweep
        timeout-minutes: 24
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          # Opens the cards once. Synthetic weights; no serving path is touched.
          image=sha256:f1e9b1a64b4f7aa04cd3d3b36fefed4d47320bfdd0f4d108d2ca85a932cf9465
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          devices=()
          for node in "${nodes[@]}"; do devices+=(--device "/dev/tenstorrent/$node"); done
          name="qwen-fusedsweep-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'timeout 5 docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout -k 20 1300 docker run --rm --name "$name" --network none \
            --cap-drop ALL --cap-add SYS_NICE --security-opt no-new-privileges \
            --pids-limit 4096 --cpus 12 --memory 48g --shm-size 8g \
            -e PYTHONDONTWRITEBYTECODE=1 -e TT_METAL_HOME=/opt/tt-metal \
            --tmpfs /tmp:rw,size=2g "${devices[@]}" \
            --mount type=bind,src=/dev/hugepages-1G,dst=/dev/hugepages-1G \
            --mount "type=bind,src=$PWD,dst=/source,readonly" \
            -w /opt/tt-metal \
            --entrypoint python3 "$image" -B /source/scripts/ci/fused_mapping_sweep.py \
            > experiment-results/fused-sweep.log 2>&1 || true
          sed -n '/FUSED_SWEEP_JSON_BEGIN/,/FUSED_SWEEP_JSON_END/p' \
            experiment-results/fused-sweep.log | sed '1d;$d' \
            > experiment-results/fused-sweep.json || true
          tail -8 experiment-results/fused-sweep.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-fused-sweep-${{ github.run_id }}
          path: fused-sweep/experiment-results/
