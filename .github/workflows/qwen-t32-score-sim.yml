name: Qwen T32 fused score replay
on:
  push:
    tags: ['experiment/t32-score-sim-*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 9
    steps:
      - name: Verify dedicated host
        run: test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: score-source-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
      - name: Record host IO pressure (advisory for correctness only)
        continue-on-error: true
        working-directory: score-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p experiment-results
          python3 -B scripts/ci/runner_io_gate.py --output experiment-results/preflight-io.json
      - name: Weight-free complete 31-query feedback replay
        working-directory: score-source-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          QWEN_SIM_ONLY: '1'
          QWEN_LEARNED_STACK: '1'
          QWEN_SIM_CASE: t32-markov-fused
        run: |
          timeout -k 15 450 bash scripts/ci/run-simulator.sh
          PYTHONPATH=scripts/ci python3 -B scripts/ci/t32-score-result.py \
            --report experiment-results/t32-markov.json \
            --output experiment-results/t32-score-qualification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-t32-score-${{ github.run_id }}
          path: score-source-${{ github.run_id }}-${{ github.run_attempt }}/experiment-results/
