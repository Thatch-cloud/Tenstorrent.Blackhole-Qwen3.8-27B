name: Qwen same-recipe combined context ladder
on:
  push:
    tags: ['experiment/combined-ladder-v1', 'experiment/combined-ladder-retry-v2']
permissions:
  contents: read
  actions: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  combined:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        context: ${{ fromJSON(github.ref_name == 'experiment/combined-ladder-retry-v2' && '[4096,8192,65536]' || '[4096,8192,16384,32768,65536,131072,262144]') }}
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    steps:
      - name: Verify host and restore artifact ownership
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          workspace=$(realpath -e "$GITHUB_WORKSPACE")
          results="$workspace/frozen-hardware/experiment-results"
          if [ -e "$results" ]; then
            test ! -L "$results"
            test "$(realpath -e "$results")" = "$results"
            sudo -n chown -R -h "$(id -u):$(id -g)" "$results"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: frozen-orchestrator
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8c102b20df22329106955b4006bf4d650bb94e40
          path: frozen-hardware
          persist-credentials: false
      - name: Stage unchanged kernels and combined ladder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          evidence=$(mktemp -d "$RUNNER_TEMP/qwen-ladder-evidence.XXXXXX")
          gh run download 35060395395 --repo "$GITHUB_REPOSITORY" --name qwen-frozen-32k-numerical-35060395395-1 --dir "$evidence/numerical"
          gh run download 35062238298 --repo "$GITHUB_REPOSITORY" --name qwen-frozen-recovered-35062238298-1 --dir "$evidence/diagnostics"
          gh run download 35068517785 --repo "$GITHUB_REPOSITORY" --name qwen-frozen-32k-numerical-35068517785-1 --dir "$evidence/target"
          gh run download 35024279412 --repo "$GITHUB_REPOSITORY" --name qwen-history-append-hardware-35024279412 --dir "$evidence/history"
          gh run download 35086789628 --repo "$GITHUB_REPOSITORY" --name qwen-frozen-gdn-cache-35086789628-1 --dir "$evidence/norm"
          gh run download 35158163367 --repo "$GITHUB_REPOSITORY" --name qwen-draft-tail-hardware-35158163367 --dir "$evidence/draft-tail"
          test "$(cat "$evidence/norm/gdn-shared-recurrence.exit-status")" = 0
          test "$(cat "$evidence/draft-tail/draft-tail-hardware.exit-status")" = 0
          cp "$evidence/history/history-append-hardware.json" frozen-hardware/scripts/ci/history-append-hardware.json
          cp "$evidence/norm/gdn-shared-recurrence.json" frozen-hardware/scripts/ci/frozen-gdn-norm.json
          cp "$evidence/draft-tail/draft-tail-hardware.json" frozen-hardware/scripts/ci/frozen-draft-tail-hardware.json
          mkdir -p frozen-hardware/experiment-results
          python3 -B frozen-orchestrator/scripts/ci/frozen_recipe_context.py \
            --checkout frozen-hardware --context 32768 --scalar-reciprocal --target-replay --combined-runtime --norm-prefetch \
            --manifest frozen-hardware/experiment-results/frozen-geometry.json
          python3 -B frozen-orchestrator/scripts/ci/frozen_draft_tail_stage.py --checkout frozen-hardware \
            --geometry frozen-hardware/experiment-results/frozen-geometry.json \
            --manifest frozen-hardware/experiment-results/draft-tail-sources.json
          python3 -B frozen-orchestrator/scripts/ci/frozen_stage_evidence.py \
            --repository frozen-orchestrator --numerical "$evidence/numerical" \
            --diagnostics "$evidence/diagnostics" --target "$evidence/target" \
            --output frozen-hardware/scripts/ci/frozen-evidence \
            > frozen-hardware/experiment-results/component-qualification.json
          python3 -B frozen-orchestrator/scripts/ci/frozen_ladder_stage.py --checkout frozen-hardware \
            --manifest frozen-hardware/experiment-results/ladder-sources.json
          python3 -B frozen-orchestrator/scripts/ci/frozen_benchmark_timeout.py --checkout frozen-hardware \
            > frozen-hardware/experiment-results/benchmark-timeout-policy.json
          git -C frozen-hardware diff --check
          git -C frozen-hardware diff > frozen-hardware/experiment-results/geometry.patch
      - name: Check host pressure before weight loading
        run: |
          python3 -B frozen-orchestrator/scripts/ci/runner_io_gate.py \
            --output frozen-hardware/experiment-results/runner-io-admission.json
      - name: Run complete same-recipe context row
        working-directory: frozen-hardware
        env:
          GH_TOKEN: ${{ github.token }}
          QWEN_CARDS_ALLOCATED: '1'
          QWEN_FROZEN_COMBINED_RUNTIME: '1'
          QWEN_DSPARK_REQUEST_CONTEXT: '${{ matrix.context }}'
          QWEN_DSPARK_MODE: request-target-attention
          QWEN_DSPARK_CODING_TASK: merge_intervals
          QWEN_DSPARK_MLP_DOWN: '0'
          QWEN_DSPARK_SCORE_LAYOUT: '1'
          QWEN_DSPARK_BANKED_PROPOSAL: '0'
          QWEN_DSPARK_NATIVE_SLOT: '0'
          QWEN_DSPARK_FUSION_T16: '1'
          QWEN_DSPARK_CAPTURED_PUBLICATION: '1'
          QWEN_DSPARK_MLP_FOOTPRINT: '0'
          QWEN_DSPARK_DRAFT_PROFILE: '0'
          QWEN_DSPARK_HISTORY_PROFILE: '0'
        run: bash scripts/ci/run-dspark-hardware.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-combined-ladder-${{ matrix.context }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: frozen-hardware/experiment-results/
