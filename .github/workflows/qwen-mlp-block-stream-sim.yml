name: Qwen MLP block-stream transport simulation
on:
  push:
    tags: ['experiment/mlp-block-stream-sim-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: mlp-stream-${{ github.run_id }}
          persist-credentials: false
      - name: Admit host storage before Docker creation
        working-directory: mlp-stream-${{ github.run_id }}
        run: |
          mkdir -p experiment-results
          python3 -B scripts/ci/runner_io_gate.py --attempts 1 \
            --output experiment-results/runner-io-admission.json
      - name: Exact packed-word transport on simulated chips
        working-directory: mlp-stream-${{ github.run_id }}
        env:
          QWEN_SIM_ONLY: '1'
          QWEN_LEARNED_STACK: '1'
          QWEN_SIM_CASE: mlp-block-stream
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          timeout -k 15 240 bash scripts/ci/run-simulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-mlp-block-stream-${{ github.run_id }}-${{ github.run_attempt }}
          path: mlp-stream-${{ github.run_id }}/experiment-results/
          if-no-files-found: error
