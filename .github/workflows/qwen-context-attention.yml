name: Qwen matched context attention gate
on:
  push:
    tags: ['experiment/context-attention-4k-v1', 'experiment/context-attention-ladder-v1', 'experiment/context-attention-32k-diagnostic-v1', 'experiment/context-attention-32k-diagnostic-v2', 'experiment/context-attention-32k-diagnostic-v3', 'experiment/context-attention-32k-diagnostic-maxima-v1']
permissions:
  contents: read
  actions: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  hardware:
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        context: ${{ fromJSON(github.ref == 'refs/tags/experiment/context-attention-4k-v1' && '[4096]' || startsWith(github.ref, 'refs/tags/experiment/context-attention-32k-diagnostic-') && '[32768]' || '[8192,16384,32768,65536,131072,262144]') }}
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 10
    steps:
      - name: Verify host and restore result ownership
        shell: bash
        run: |
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          workspace=$(realpath -e "$GITHUB_WORKSPACE")
          results="$workspace/experiment-results"
          if [ -e "$results" ]; then
            test ! -L "$results"
            test "$(realpath -e "$results")" = "$results"
            sudo -n chown -R -h "$(id -u):$(id -g)" "$results"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Same simulator-qualified kernel, context numerical and replay gate
        env:
          GH_TOKEN: ${{ github.token }}
          QWEN_CARDS_ALLOCATED: '1'
          QWEN_MATCHED_CONTEXT: ${{ matrix.context }}
          QWEN_SPLITK_MAXIMA: ${{ github.ref == 'refs/tags/experiment/context-attention-32k-diagnostic-maxima-v1' && '1' || '0' }}
        run: |
          mkdir -p experiment-results
          chmod 2775 experiment-results
          timeout -k 15 540 bash scripts/ci/run-dspark-splitk-hardware.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-context-attention-${{ matrix.context }}-${{ github.run_id }}
          path: experiment-results/
