name: Qwen prefetch arm on MLP shapes
on:
  push:
    tags: ['experiment/prefetch-arm-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  arm:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: prefetch-arm
          persist-credentials: false
      - name: Confirm no process holds a card
        working-directory: prefetch-arm
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          paths=()
          for node in "${nodes[@]}"; do paths+=("/dev/tenstorrent/$node"); done
          status=0
          "${prefix[@]}" fuser -v "${paths[@]}" > experiment-results/holders.txt 2>&1 || status=$?
          if [ "$status" != 1 ] || [ -s experiment-results/holders.txt ]; then
            echo 'Device ownership not clear; not opening a card'
            cat experiment-results/holders.txt || true
            exit 1
          fi
          for metric in cpu memory io; do cat "/proc/pressure/$metric"; done \
            > experiment-results/host-pressure.txt
          cat experiment-results/host-pressure.txt
      - name: Run the arm
        working-directory: prefetch-arm
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          # This job opens the cards exactly once. Correctness before timing;
          # no speedup is claimed and the override stays unset.
          image=sha256:f1e9b1a64b4f7aa04cd3d3b36fefed4d47320bfdd0f4d108d2ca85a932cf9465
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          devices=()
          for node in "${nodes[@]}"; do devices+=(--device "/dev/tenstorrent/$node"); done
          name="qwen-arm-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'timeout 5 docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout -k 20 700 docker run --rm --name "$name" --network none \
            --cap-drop ALL --cap-add SYS_NICE --security-opt no-new-privileges \
            --pids-limit 4096 --cpus 12 --memory 48g --shm-size 8g \
            -e PYTHONDONTWRITEBYTECODE=1 -e TT_METAL_HOME=/opt/tt-metal \
            --tmpfs /tmp:rw,size=1g "${devices[@]}" \
            --mount type=bind,src=/dev/hugepages-1G,dst=/dev/hugepages-1G \
            --mount "type=bind,src=$PWD,dst=/source,readonly" \
            -w /opt/tt-metal \
            --entrypoint python3 "$image" -B /source/scripts/ci/prefetch_matmul_arm.py \
            > experiment-results/prefetch-arm.log 2>&1 || true
          sed -n '/PREFETCH_ARM_JSON_BEGIN/,/PREFETCH_ARM_JSON_END/p' \
            experiment-results/prefetch-arm.log | sed '1d;$d' \
            > experiment-results/prefetch-arm.json || true
          python3 -B scripts/ci/prefetch_arm_summary.py \
            --report experiment-results/prefetch-arm.json \
            --log experiment-results/prefetch-arm.log
      - name: MLP arm - prefetched gate+up+multiply vs native 1D control
        working-directory: prefetch-arm
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          image=sha256:f1e9b1a64b4f7aa04cd3d3b36fefed4d47320bfdd0f4d108d2ca85a932cf9465
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          devices=()
          for node in "${nodes[@]}"; do devices+=(--device "/dev/tenstorrent/$node"); done
          name="qwen-mlparm-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'timeout 5 docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout -k 20 700 docker run --rm --name "$name" --network none \
            --cap-drop ALL --cap-add SYS_NICE --security-opt no-new-privileges \
            --pids-limit 4096 --cpus 12 --memory 48g --shm-size 8g \
            -e PYTHONDONTWRITEBYTECODE=1 -e TT_METAL_HOME=/opt/tt-metal \
            --tmpfs /tmp:rw,size=1g "${devices[@]}" \
            --mount type=bind,src=/dev/hugepages-1G,dst=/dev/hugepages-1G \
            --mount "type=bind,src=$PWD,dst=/source,readonly" \
            -w /opt/tt-metal \
            --entrypoint python3 "$image" -B /source/scripts/ci/prefetch_mlp_arm.py \
            > experiment-results/prefetch-mlp.log 2>&1 || true
          sed -n '/PREFETCH_MLP_JSON_BEGIN/,/PREFETCH_MLP_JSON_END/p' \
            experiment-results/prefetch-mlp.log | sed '1d;$d' \
            > experiment-results/prefetch-mlp.json || true
          tail -6 experiment-results/prefetch-mlp.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-prefetch-arm-${{ github.run_id }}
          path: prefetch-arm/experiment-results/
