name: Qwen fabric topology
on:
  push:
    tags: ['experiment/fabric-topology-v*']
permissions:
  contents: read
concurrency:
  group: qwen-two-p150a-exclusive
  cancel-in-progress: false
jobs:
  descriptors:
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: ft
          persist-credentials: false
      - name: Extract the mesh graph descriptors the runtime can choose from
        working-directory: ft
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results/descriptors
          image=sha256:f1e9b1a64b4f7aa04cd3d3b36fefed4d47320bfdd0f4d108d2ca85a932cf9465
          name="qwen-fabric-topo-extract-$GITHUB_RUN_ID"
          docker create --name "$name" --entrypoint /bin/true "$image" >/dev/null
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          root=/opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors
          docker cp "$name:$root" experiment-results/descriptors
          echo '--- descriptors available ---'
          ls -1 experiment-results/descriptors/mesh_graph_descriptors | head -40
          echo '--- the one the runtime is pinned to ---'
          cat experiment-results/descriptors/mesh_graph_descriptors/p150_x2_mesh_graph_descriptor.textproto
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-fabric-descriptors-${{ github.run_id }}
          path: ft/experiment-results/

  links:
    needs: descriptors
    runs-on: [self-hosted, Linux, X64, thatch-qwen-p150a-pair]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: ft
          persist-credentials: false
      - name: Confirm no process holds a card
        working-directory: ft
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          mkdir -p experiment-results
          prefix=()
          if [ "$(id -u)" != 0 ]; then prefix=(sudo -n); fi
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          paths=()
          for node in "${nodes[@]}"; do paths+=("/dev/tenstorrent/$node"); done
          status=0
          "${prefix[@]}" fuser -v "${paths[@]}" > experiment-results/holders.txt 2>&1 || status=$?
          if [ "$status" != 1 ] || [ -s experiment-results/holders.txt ]; then
            echo 'Device ownership not clear'
            cat experiment-results/holders.txt || true
            exit 1
          fi
      - name: Ask the runtime which ethernet cores are linked
        working-directory: ft
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = thatch-build-amd64-02-cp-temp
          image=sha256:f1e9b1a64b4f7aa04cd3d3b36fefed4d47320bfdd0f4d108d2ca85a932cf9465
          mapfile -t nodes < <(ls /dev/tenstorrent | grep -E '^[0-9]+$' | sort)
          devices=()
          for node in "${nodes[@]}"; do devices+=(--device "/dev/tenstorrent/$node"); done
          name="qwen-fabric-topo-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'timeout 20 docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          timeout -k 30 900 docker run --rm --name "$name" --network none \
            --cap-drop ALL --cap-add SYS_NICE --security-opt no-new-privileges \
            --pids-limit 4096 --cpus 8 --memory 48g --shm-size 8g \
            "${devices[@]}" \
            --mount type=bind,src=/dev/hugepages-1G,dst=/dev/hugepages-1G \
            --mount "type=bind,src=$PWD,dst=/source,readonly" \
            --tmpfs /tmp:rw,size=512m \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/source/scripts/ci \
            -e QWEN_HARDWARE_TESTS=1 -e QWEN_CARDS_ALLOCATED=1 \
            -e TT_METAL_HOME=/opt/tt-metal \
            -e TT_MESH_GRAPH_DESC_PATH=/opt/tt-metal/tt_metal/fabric/mesh_graph_descriptors/p150_x2_mesh_graph_descriptor.textproto \
            --entrypoint python3 "$image" -B /source/scripts/ci/fabric_link_topology.py \
            > experiment-results/fabric-topo-stdout.log 2>&1 || true
          sed -n '/FABRIC_TOPO_JSON_BEGIN/,/FABRIC_TOPO_JSON_END/p' \
            experiment-results/fabric-topo-stdout.log | sed '1d;$d' \
            > experiment-results/fabric-topo.json || true
          if [ ! -s experiment-results/fabric-topo.json ]; then
            echo 'No structured result; tail of stdout:'
            tail -60 experiment-results/fabric-topo-stdout.log || true
            exit 1
          fi
          cat experiment-results/fabric-topo.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-fabric-topology-${{ github.run_id }}
          path: ft/experiment-results/
